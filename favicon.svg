<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The Distribution mark alone: no plate, no rounded rect. A tab strip supplies
    its own background, and the navy tile made the mark read as a badge rather
    than as the logo.

    The market curve is Sky in both schemes — it reads on a light and a dark tab
    strip alike, where Deep Navy disappears against dark chrome. Only the
    baseline switches, since a Paper hairline is invisible on white. SVG
    favicons are styled by the BROWSER's colour scheme, so that switch tracks
    the OS/browser theme, not the app's own light/dark toggle.
  -->
  <style>
    .base { stroke: #16305e; }
    @media (prefers-color-scheme: dark) {
      .base { stroke: #fbfbf9; }
    }
  </style>
  <!--
    The mark is 220×110 (2:1), so in a square icon it is centred and the spare
    height left as padding rather than stretched. 60/220 ≈ 0.2727, with 2px of
    side margin so the curve tips aren't clipped when rendered at 16px.
  -->
  <g transform="translate(2,17) scale(0.2727)">
    <path d="M8,100 C58,100 62,18 92,18 C122,18 128,100 176,100 Z" fill="#5a8ae6" opacity="0.95"></path>
    <path d="M48,100 C96,100 102,42 128,42 C154,42 160,100 212,100 Z" fill="#FFD700" opacity="0.85"></path>
    <line class="base" x1="4" y1="100" x2="216" y2="100" stroke-width="8" stroke-linecap="round"></line>
  </g>
</svg>
