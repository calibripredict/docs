name: Join specs

# Rebuilds api-reference/openapi/calibri.yaml — the ONE document the site
# renders — from the three per-service specs.
#
# WHY THIS EXISTS. The service repos (atlas, persona, pythia) each push their
# own generated spec into api-reference/openapi/ when their API changes. Nothing
# in that flow touches calibri.yaml, and docs.json points at calibri.yaml. So
# without this workflow the inputs update and the rendered reference does not:
# the site keeps serving whatever the joined file said the last time a human ran
# the script locally, while every signal says the docs are current.
#
# That is the exact failure the generate-and-drift-check design exists to
# prevent, reintroduced one level up. A stale doc that LOOKS maintained is worse
# than an obviously old one, because nobody goes looking.
on:
  workflow_dispatch:

  push:
    branches: [master]
    paths:
      - "api-reference/openapi/account.yaml"
      - "api-reference/openapi/identity.yaml"
      - "api-reference/openapi/public.yaml"
      - "scripts/join-specs.sh"
      - "scripts/gen-model-pages.py"
      - ".github/workflows/join-specs.yml"

# A service sync can land while this run is in flight. Cancelling the older run
# is right: the newer one already includes its inputs.
concurrency:
  group: join-specs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Join the three specs
        run: ./scripts/join-specs.sh

      - name: Validate the site
        # Validate the SITE, not the file. Redocly has passed specs that
        # Mintlify then refused, and a broken build here takes the whole
        # reference down — so this gate is what decides whether the join is
        # allowed to land.
        run: npx --yes mint@latest validate

      - name: Commit the joined document
        run: |
          # The join writes three things now: the document, the generated model
          # pages, and the navigation group listing them. `git diff` alone would
          # miss a brand-new model page, so ask about untracked files too.
          generated=(api-reference/openapi/calibri.yaml api-reference/models docs.json)

          if [ -z "$(git status --porcelain -- "${generated[@]}")" ]; then
            echo "reference already current — nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_it() {
            git add -A -- "${generated[@]}"
            git commit -m "chore: rebuild the joined API reference

          Regenerated by scripts/join-specs.sh from account.yaml, identity.yaml
          and public.yaml, along with the model pages under api-reference/models
          and their navigation group. Do not edit these by hand — the next join
          overwrites them."
          }

          commit_it

          # Push, and if the remote moved under us, REBUILD on top of it rather
          # than rebasing.
          #
          # The remote moves for a good reason: docs are edited in the Mintlify
          # web editor, which commits straight to this branch. A save landing
          # between our checkout and our push rejects the push, and without this
          # loop the run goes red and the spec quietly never lands.
          #
          # Rebuild rather than rebase because calibri.yaml is fully GENERATED —
          # there is no meaningful merge of two versions of it, and `--ours` /
          # `--theirs` are inverted during a rebase, which is exactly how the
          # wrong one gets kept. Re-running the join against the newer inputs
          # always converges and never invents a state.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed"
              exit 0
            fi

            echo "remote moved (likely a web-editor save) — rebuilding on top of it"
            git fetch origin master
            git reset --hard origin/master
            ./scripts/join-specs.sh

            if [ -z "$(git status --porcelain -- "${generated[@]}")" ]; then
              echo "already current after rebuild — nothing to push"
              exit 0
            fi
            commit_it
          done

          echo "::error::could not push after 3 attempts — the branch is moving faster than the join"
          exit 1
