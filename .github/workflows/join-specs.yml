name: Join specs

# Rebuilds api-reference/openapi/calibri.yaml — the ONE document the site
# renders — from the three per-service specs.
#
# WHY THIS EXISTS. The service repos (atlas, persona, pythia) each push their
# own generated spec into api-reference/openapi/ when their API changes. Nothing
# in that flow touches calibri.yaml, and docs.json points at calibri.yaml. So
# without this workflow the inputs update and the rendered reference does not:
# the site keeps serving whatever the joined file said the last time a human ran
# the script locally, while every signal says the docs are current.
#
# That is the exact failure the generate-and-drift-check design exists to
# prevent, reintroduced one level up. A stale doc that LOOKS maintained is worse
# than an obviously old one, because nobody goes looking.
on:
  workflow_dispatch:

  push:
    branches: [master]
    paths:
      - "api-reference/openapi/account.yaml"
      - "api-reference/openapi/identity.yaml"
      - "api-reference/openapi/public.yaml"
      - "scripts/join-specs.sh"
      - ".github/workflows/join-specs.yml"

# A service sync can land while this run is in flight. Cancelling the older run
# is right: the newer one already includes its inputs.
concurrency:
  group: join-specs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Join the three specs
        run: ./scripts/join-specs.sh

      - name: Validate the site
        # Validate the SITE, not the file. Redocly has passed specs that
        # Mintlify then refused, and a broken build here takes the whole
        # reference down — so this gate is what decides whether the join is
        # allowed to land.
        run: npx --yes mint@latest validate

      - name: Commit the joined document
        run: |
          if git diff --quiet -- api-reference/openapi/calibri.yaml; then
            echo "calibri.yaml already current — nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-reference/openapi/calibri.yaml
          git commit -m "chore: rebuild the joined API reference

          Regenerated by scripts/join-specs.sh from account.yaml, identity.yaml
          and public.yaml. Do not edit this file by hand — the next join
          overwrites it."
          git push
