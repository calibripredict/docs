    CreateOrderRequest:
      properties:
        direction:
          description: 'Whether you are opening or closing. `buy` posts collateral and acquires the outcome; `sell` offers outcome tokens you already hold, so it locks INVENTORY rather than cash and its `locked` is zero. Defaults to `buy`, which is how every order behaved before position exit. See /account/positions for how much of a holding is sellable.'
          enum:
            - 'buy'
            - 'sell'
          example: 'buy'
          type: 'string'
        market:
          description: 'Market id.'
          example: '12'
          type: 'string'
        ord_type:
          enum:
            - 'limit'
            - 'market'
          example: 'limit'
          type: 'string'
        post_only:
          description: 'Reject the order if it would take liquidity. A post-only order reserves no taker fee, because it can only ever rest as a maker.'
          example: false
          type: 'boolean'
        price:
          description: 'Limit price, `0.01`–`0.99`, in whole cents (e.g. 0.27, not 0.275) — an order finer than the market precision is rejected, not rounded. Required for a limit order.'
          example: '0.60'
          type: 'string'
        side:
          description: 'The OUTCOME this order is about — never buy/sell. Pair it with `direction`: a sell of `yes` and a buy of `no` are different orders that happen to sit on the same side of the book.'
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: 'string'
        signed_order:
          $ref: '#/components/schemas/SignedOrderEntity'
          description: 'The EIP-712-signed order. Validated before anything is placed — a signature the server cannot verify is rejected, never rested.'
