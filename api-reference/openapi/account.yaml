          type: 'array'
        safe:
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: 'string'
      required:
        - 'safe'
        - 'all'
        - 'calls'
      type: 'object'
    SessionKeyRevokeRequest:
      properties:
        key_id:
          description: 'Revoke one grant. Omit to revoke EVERY outstanding grant — which is constant gas however many exist, because it is the emergency path.'
          example: '7'
          type: 'string'
      type: 'object'
    SessionKeyStatusEntity:
      properties:
        default_ttl:
          description: 'The grant length this deployment actually hands out.'
          example: 2592000
          type: 'number'
        enabled:
          description: 'False when the deployment has no session contracts, the service is unreachable, or the member has no passkey wallet. Not an error — the caller falls back to prompting the passkey per order.'
          example: true
          type: 'boolean'
        handler_installed:
          description: 'Whether the Safe''s session-aware fallback handler is installed.'
          example: true
          type: 'boolean'
        idle_lock_seconds:
          description: 'How long a device may hold an unlocked key without placing an order. Served rather than compiled into the client — a missing value must never be read as "no lock".'
          example: 900
          type: 'number'
        last_key_id:
          description: 'Highest grant id issued. Every order signature carries it, so read this after relaying an authorisation.'
          example: '7'
          type: 'string'
        max_ttl:
          description: 'The registry''s immutable on-chain ceiling, in seconds.'
          example: 15552000
          type: 'number'
        safe:
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: 'string'
      required:
        - 'enabled'
      type: 'object'
    SettledMarketEntity:
      properties:
        cost:
          description: 'What the position cost: collateral plus the fees charged on the fills.'
          example: '36.22065000'
          type: 'string'
        event_id:
          example: 14710
          type:
            - 'number'
            - 'null'
        event_image_url:
          example: null
          type:
            - 'string'
            - 'null'
        event_slug:
          description: 'The parent event''s slug — what the row links to.'
          example: 'btc-updown-5m'
          type:
            - 'string'
            - 'null'
        event_title:
          example: 'Bitcoin Up or Down 5m'
          type:
            - 'string'
            - 'null'
        fees:
          description: 'The fee part of `cost`.'
          example: '0.72065000'
          type: 'string'
        market_id:
          example: '14738'
          type: 'string'
        market_title:
          example: 'Bitcoin Up or Down 5m — 11:15–11:20 UTC'
          type:
            - 'string'
            - 'null'
        payout:
          description: 'What it paid. `0` on a market you lost.'
          example: '50.00000000'
          type: 'string'
        quote_currency:
          example: 'usdc'
          type:
            - 'string'
            - 'null'
        result:
          description: 'How the market resolved.'
          enum:
            - 'settled_yes'
            - 'settled_no'
          example: 'settled_yes'
          type:
            - 'string'
            - 'null'
        settled_at:
          example: '2026-09-11T11:21:37.000Z'
          type:
            - 'string'
            - 'null'
        settlement_status:
          description: 'On-chain settlement state, or `null` when this holding never touched the chain (a custodial fill has nothing to confirm).'
          enum:
            - 'confirmed'
            - 'pending'
          example: 'confirmed'
          type:
            - 'string'
            - 'null'
        side:
          description: 'The side you held. `both` when you bought both outcomes of the same market — rare, and reported rather than collapsed to the larger leg.'
          enum:
            - 'yes'
            - 'no'
            - 'both'
          example: 'yes'
          type: 'string'
        volume:
          description: 'Contracts held at resolution.'
          example: '50'
          type: 'string'
      required:
        - 'market_id'
        - 'market_title'
        - 'event_id'
        - 'event_title'
        - 'event_slug'
        - 'event_image_url'
        - 'result'
        - 'side'
        - 'volume'
        - 'cost'
        - 'fees'
        - 'payout'
        - 'quote_currency'
        - 'settlement_status'
        - 'settled_at'
      type: 'object'
    SignedOrderEntity:
      properties:
        expiration:
          description: 'Unix seconds. Must be non-zero, unexpired, and within 365 days.'
          example: '1797600000'
          type: 'string'
        fee_rate_bps:
          description: 'Must be `"0"`. The taker fee is collected separately on-chain from your Safe, not through this field.'
          example: '0'
          type: 'string'
        maker:
          description: 'Your Safe — the address the collateral comes from. For signature type 3 this equals `signer`.'
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: 'string'
        maker_amount:
          description: 'USDC in, 6-decimal base units. `round(price × volume × 1e6)`.'
          example: '60000000'
          type: 'string'
        nonce:
          description: 'Exchange nonce.'
          example: '0'
          type: 'string'
        salt:
          description: 'Random per-order value. Two orders with identical terms must not share one.'
          example: '5821094412'
          type: 'string'
        side:
          description: 'Always `0` (BUY). Both YES and NO legs are buys that mint — the side you are taking is carried by `token_id` alone.'
          enum:
            - 0
          example: 0
          type: 'number'
        signature:
          description: 'The EIP-712 signature. For a session-signed order this is `abi.encode(keyId, r, s)` — exactly 96 bytes — which is how the server tells a session key from a passkey.'
          example: '0x4f2a…'
          type: 'string'
        signature_type:
          description: '`2` POLY_GNOSIS_SAFE (your Safe, owned by your wallet) or `3` POLY_1271 (your Safe, owned by a passkey). Read it from `signature_type` on the wallet config rather than choosing one — an order signed the way the other type requires is rejected.'
          enum:
            - 2
            - 3
          example: 2
          type: 'number'
        signer:
          description: 'Whoever signed. Your wallet EOA for types 0 and 2; the Safe itself for type 3, where a passkey or session key produced the signature.'
          example: '0xE1188438C85C98aADFf1a88f97764E607B4978C3'
          type: 'string'
        taker:
          description: 'The zero address — the order is public and anyone may match it.'
          example: '0x0000000000000000000000000000000000000000'
          type: 'string'
        taker_amount:
          description: 'Outcome tokens out, 6-decimal. `round(volume × 1e6)`.'
          example: '100000000'
          type: 'string'
        token_id:
          description: 'The ERC-1155 position id for YOUR side. This is what says which market and which outcome — a signed order carries no market field.'
          example: '7138104...'
          type: 'string'
      required:
        - 'salt'
        - 'maker'
        - 'signer'
        - 'taker'
        - 'token_id'
        - 'maker_amount'
        - 'taker_amount'
        - 'expiration'
        - 'nonce'
        - 'fee_rate_bps'
        - 'side'
        - 'signature_type'
        - 'signature'
      type: 'object'
    TransactionBridgeEntity:
      properties:
        amount:
          description: 'USDC that left the source network: what you deposited, or the total a withdrawal took from your wallet (fee included). `null` when unknown.'
          example: '50'
          type:
            - 'string'
            - 'null'
        direction:
          description: '`in`: a deposit bridged from another network. `out`: a withdrawal delivered to one.'
          example: 'out'
          type: 'string'
        fee:
          description: 'Our bridge fee in USDC. `null` when there was none or it is not known yet.'
          example: '3'
          type:
            - 'string'
            - 'null'
        other_chain_key:
          description: 'The other network: a deposit''s source, a withdrawal''s destination.'
          example: 'ethereum'
          type:
            - 'string'
            - 'null'
        other_chain_name:
          example: 'Ethereum'
          type:
            - 'string'
            - 'null'
        other_from_address:
          description: 'A deposit: the address that sent it on the source network (the first sender when several transfers were bridged together). `null` for a withdrawal, or until known.'
          example: '0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed'
          type:
            - 'string'
            - 'null'
        other_tx_explorer_url:
          description: 'Block-explorer URL of `other_tx_hash`, or `null`.'
          example: 'https://etherscan.io/tx/0x4be1…'
          type:
            - 'string'
            - 'null'
        other_tx_hash:
          description: 'A deposit: the transaction that sent it on the source network. A withdrawal: the transaction that delivered it (`null` until delivered).'
          example: '0x4be1…'
          type:
            - 'string'
            - 'null'
        received:
          description: 'USDC that arrived on the other side. `null` until it has.'
          example: '46.99'
          type:
            - 'string'
            - 'null'
        state:
          description: 'Where the bridge is (see the bridge transfers list for the states).'
          example: 'completed'
          type: 'string'
      required:
        - 'direction'
        - 'other_chain_key'
        - 'other_chain_name'
        - 'other_tx_hash'
        - 'other_tx_explorer_url'
        - 'other_from_address'
        - 'amount'
        - 'fee'
        - 'received'
        - 'state'
      type: 'object'
    TransactionEntity:
      properties:
        address:
          description: 'Address involved, for an on-chain row.'
          example: '0xE1188438C85C98aADFf1a88f97764E607B4978C3'
          type: 'string'
        beneficiary_id:
          description: 'Custodial funding only — not used on Calibri.'
          example: 12
          type: 'number'
        blockchain_key:
          example: 'polygon-mainnet'
          type: 'string'
        blockchain_name:
          example: 'Polygon'
          type: 'string'
        bridge:
          $ref: '#/components/schemas/TransactionBridgeEntity'
          description: 'Deposits and withdrawals that crossed chains: the other side of the bridge. `null` otherwise.'
        change_voucher_amount:
          description: 'Voucher flow — not used on Calibri.'
          example: '0'
          type: 'string'
        change_voucher_expiry:
          description: 'Voucher flow — not used on Calibri.'
          example: '2026-09-01T00:00:00Z'
          type: 'string'
        change_voucher_pin:
          description: 'Voucher flow — not used on Calibri.'
          example: '—'
          type: 'string'
        created_at:
          description: 'ISO-8601.'
          example: '2026-08-07T10:00:00Z'
          type: 'string'
        credit_amount:
          example: '40.00'
          type: 'string'
        credit_currency:
          description: 'Currency received.'
          example: 'usdc'
          type: 'string'
        debit_amount:
          example: '60.00'
          type: 'string'
        debit_currency:
          description: 'Currency sent.'
          example: 'usdc'
          type: 'string'
        description:
          description: 'System-generated summary.'
          example: 'Bought 100 YES @ 0.60'
          type: 'string'
        event_id:
          example: 45
          type: 'number'
        event_image_url:
          example: 'https://cdn.calibri.io/events/btc.png'
          type: 'string'
        event_title:
          example: 'Bitcoin 5-minute'
          type: 'string'
        executor_address:
          description: 'The address that submitted the transaction.'
          example: '0x7830c87c02e56aff27fa8ab1241711331fa86f43'
          type: 'string'
        expires_at:
          description: 'ISO-8601.'
          example: '2026-08-08T00:00:00Z'
          type: 'string'
        fee:
          description: 'The taker fee on this fill.'
          example: '0.17'
          type: 'string'
        fee_currency:
          example: 'usdc'
          type: 'string'
        from_address:
          description: 'Deposits: the address that sent it (lowercase). `null` for other entries or when not recorded.'
          example: '0x5aaeb6053f3e94c9b9a09f33669435e7ef1beaed'
          type:
            - 'string'
            - 'null'
        id:
          example: 90231
          type: 'number'
        initiated_from:
          description: 'Where the movement originated.'
          example: 'web'
          type: 'string'
        market_id:
          description: 'Market this row belongs to.'
          example: '12'
          type: 'string'
        market_title:
          example: 'Will BTC close above its open?'
          type: 'string'
        member_description:
          description: 'Your own note against this row.'
          example: 'my hedge'
          type: 'string'
        on_chain:
          description: 'Whether the row corresponds to an on-chain movement.'
          example: true
          type: 'boolean'
        order_id:
          example: 90231
          type: 'string'
        origin_volume:
          description: 'Original order volume.'
          example: '100'
          type: 'string'
        paid_at:
          description: 'When the movement completed. ISO-8601.'
          example: '2026-08-07T10:00:05Z'
          type: 'string'
        payment_method_icon_url:
          description: 'Payment-provider flow — not used on Calibri.'
          example: '—'
          type: 'string'
        payment_method_name:
          description: 'Payment-provider flow — not used on Calibri.'
          example: '—'
          type: 'string'
        payment_method_precision:
          description: 'Payment-provider flow — not used on Calibri.'
          example: 2
          type: 'number'
        payment_method_provider:
          description: 'Payment-provider flow — not used on Calibri.'
          example: '—'
          type: 'string'
        price:
          description: 'Fill price.'
          example: '0.60'
          type: 'string'
        quote_currency:
          description: 'Settlement currency for the market.'
          example: 'usdc'
          type: 'string'
        receiver:
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: 'string'
        reference_id:
          example: 90231
          type: 'number'
        reference_type:
          description: 'Related entity type.'
          example: 'Order'
          type: 'string'
        sender:
          example: '0xE1188438C85C98aADFf1a88f97764E607B4978C3'
          type: 'string'
        settlement_status:
          description: 'On-chain mint badge, where the row came from a contract.'
          example: 'confirmed'
          type: 'string'
        side:
          description: 'Which leg, for a trade.'
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: 'string'
        state:
          example: 'active'
          type: 'string'
        txid:
          description: 'Blockchain txid or internal reference.'
          example: '0x9f2c…'
          type: 'string'
        txid_explorer_url:
          description: 'Deposits and withdrawals: the full block-explorer URL of `txid`, on the chain that transaction is actually on (for a wallet deposit or withdrawal always Polygon, even when `blockchain_key` names the network a cross-chain withdrawal went to). `null` for other entries, or when there is no txid or explorer.'
          example: 'https://polygonscan.com/tx/0x9f2c…'
          type:
            - 'string'
            - 'null'
        type:
          description: 'One of `trade`, `referral`, `maker_reward`.'
          example: 'trade'
          type: 'string'
        updated_at:
          description: 'ISO-8601.'
          example: '2026-08-07T10:05:00Z'
          type: 'string'
        voucher_pin:
          description: 'Voucher flow — not used on Calibri.'
          example: '—'
          type: 'string'
      required:
        - 'id'
        - 'type'
        - 'created_at'
        - 'txid_explorer_url'
        - 'bridge'
        - 'from_address'
      type: 'object'
  securitySchemes:
    apiKey:
      description: 'HMAC-signed API key. Send X-Auth-Apikey, X-Auth-Nonce and X-Auth-Signature.'
      in: 'header'
      name: 'X-Auth-Apikey'
      type: 'apiKey'
info:
  description: 'The authenticated member surface: balances, signed-order placement,

    contracts, rewards, and the self-custody wallet endpoints.


    Calibri holds no funds. Every order carries your own EIP-712 signature,

    and every transfer out of your Safe is a transaction you sign, so

    authenticating here proves who you are — it does not authorise the

    movement of money.'
  title: 'Calibri Account & Trading'
  version: '1.0.0'
openapi: '3.1.0'
paths:
  /api/v2/atlas/account/balances:
    get:
      description: 'Your balances per currency. `balance_safe` (available) and `locked_safe` (reserved) are the mirror of the USDC in your own on-chain Safe — those are the figures that matter. `redeemable_safe` is winnings the contract owes you that you have not redeemed yet: not spendable until you do. `balance` / `locked` / `total` are the operator-held pool, which Calibri does not operate, so they are always "0".'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BalanceEntity'
                type: 'array'
          description: ''
      summary: 'All balances'
      tags:
        - 'Account'
  /api/v2/atlas/account/balances/{currency}:
    get:
      description: 'One currency''s balance. Same shape as a list element — prefer `balance_safe` / `locked_safe` / `redeemable_safe` over the always-zero operator pool fields.'
      parameters:
        - in: 'path'
          name: 'currency'
          required: true
          schema:
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceEntity'
          description: ''
      summary: 'Balance by currency'
      tags:
        - 'Account'
  /api/v2/atlas/account/bridge/config:
    get:
      description: 'The chains you can deposit USDC from besides Polygon, each with its minimum, typical time to credit and current fee estimate, plus your deposit address (the same on every chain). USDC sent to that address on a listed chain is bridged to Polygon and credited automatically. Only USDC, and only on the listed chains.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeConfigEntity'
          description: ''
      summary: 'Cross-chain deposit config'
      tags:
        - 'Other'
  /api/v2/atlas/account/bridge/transfers:
    get:
      description: 'Your cross-chain USDC bridges, newest first — one row per bridge: deposits (`direction: in`, from arrival on the source chain to credit on Polygon) and withdrawals (`direction: out`, from the burn on Polygon to the mint on the destination chain). `direction` filters to one of them. Pagination in the `Page`, `Per-Page` and `Total` headers. The list is not pushed live: refetch it, e.g. when the regular deposit notification for the credited mint arrives.'
      parameters:
        - description: 'Rows per page. Defaults to 25, capped at 100.'
          example: 25
          in: 'query'
          name: 'limit'
          required: false
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: 'integer'
        - description: 'Page number, from 1.'
          example: 1
          in: 'query'
          name: 'page'
          required: false
          schema:
            default: 1
            minimum: 1
            type: 'integer'
        - description: '`in` (deposits) or `out` (withdrawals). Both when omitted.'
          example: 'out'
          in: 'query'
          name: 'direction'
          required: false
          schema:
            enum:
              - 'in'
              - 'out'
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BridgeTransferEntity'
                type: 'array'
          description: ''
      summary: 'Cross-chain deposits and withdrawals'
      tags:
        - 'Other'
  /api/v2/atlas/account/bridge/transfers/{id}/consent:
    post:
      description: 'When gas is high, a cross-chain deposit waits in `awaiting_consent` with a `quote`: bridging now costs `quote.target_fee`, more than the standard fee. Send that exact amount as `max_fee` to accept it; the deposit is then bridged and you receive the amount minus that fee. If the fee has changed since you saw it, the answer is 409 with the current `quote` (and `code`: `quote_changed`, `stale_quote` or `not_awaiting_consent`) — show it and ask again. Not accepting is fine: the bridge re-checks gas every 10 minutes and bridges on its own once the standard fee covers the cost. Rate limited to 10 per minute.'
      parameters:
        - in: 'path'
          name: 'id'
          required: true
          schema:
            type: 'string'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeConsentRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeConsentEntity'
          description: ''
      summary: 'Accept a cross-chain deposit fee'
      tags:
        - 'Other'
  /api/v2/atlas/account/bridge/withdraw/quote:
    get:
      description: 'Prices a withdrawal of `amount` USDC from your wallet on Polygon to `destination` on another network (`chain_key`, a chain from the bridge config), and returns the wallet transaction to sign for it (`safe_tx`: one batch that pays the fee, approves and burns the rest over Circle CCTP). Sign `safe_tx` and relay it through `POST /account/wallet/relay` with this `quote_id` before `expires_at` (5 minutes); a quote can be used once. `fee` is ours, `max_cctp_fee` the most Circle may keep, `receive` the minimum you receive. `destination` must be a checksummed address other than your wallet; a wallet (not passkey) account can withdraw only to its linked wallet. Refusals are 422 with `code`: `below_minimum`, `withdrawals_disabled`, `chain_inactive`, `receive_not_positive`, `no_safe`, `no_wallet`, `destination_is_safe`, `destination_not_linked_wallet`. Rate limited to 10 per minute.'
      parameters:
        - description: 'Recipient on the destination chain, checksummed.'
          example: '0x5aAeb6053F3E94C9b9A09f33669435E7Ef1BeAed'
          in: 'query'
          name: 'destination'
          required: true
          schema:
            type: 'string'
        - description: 'USDC to withdraw (fee included).'
          example: '50'
          in: 'query'
          name: 'amount'
          required: true
          schema:
            type: 'string'
        - description: 'Destination chain key.'
          example: 'ethereum'
          in: 'query'
          name: 'chain_key'
          required: true
          schema:
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeWithdrawQuoteEntity'
          description: ''
      summary: 'Quote a cross-chain withdrawal'
      tags:
        - 'Other'
  /api/v2/atlas/account/contracts:
    get:
      description: 'Your matched positions. A winning contract settles to the full 1.00 per share — the fee was taken at trade time — but winnings are NOT auto-paid: you redeem them yourself.'
      parameters:
        - description: 'Contracts per page. Defaults to 50.'
          example: 25
          in: 'query'
          name: 'limit'
          required: false
          schema:
            default: 50
            minimum: 1
            type: 'integer'
        - description: 'Page number, from 1. Newest contract first.'
          example: 1
          in: 'query'
          name: 'page'
          required: false
          schema:
            default: 1
            minimum: 1
            type: 'integer'
        - description: 'Contracts either leg of which came from this order — useful for following one fill. Matches the yes side or the no side.'
          example: 90210
          in: 'query'
          name: 'order_id'
          required: false
          schema:
            type: 'number'
        - description: 'Filter to one market, by the engine''s market id.'
          example: '5871'
          in: 'query'
          name: 'market_id'
          required: false
          schema:
            type: 'string'
        - description: 'Filter by verdict — the same vocabulary the `state` field returns: `active`, `settled_yes`, `settled_no`, `voided`. Two conveniences on top: `settled` is shorthand for both settled values, and a comma-separated list is an OR (`settled_yes,voided`). `pending` is accepted as an alias of `active`. Not an enum in this schema precisely because a list is a legal value.'
          example: 'settled_yes,voided'
          in: 'query'
          name: 'state'
          required: false
          schema:
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ContractEntity'
                type: 'array'
          description: ''
      summary: 'Your contracts'
      tags:
        - 'Positions'
  /api/v2/atlas/account/contracts/{id}:
    get:
      description: 'One matched position, only if you are a party to it. Same object as a list element — useful when following a fill or settlement deep-link.'
      parameters:
        - in: 'path'
          name: 'id'
          required: true
          schema:
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractEntity'
          description: ''
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      summary: 'Contract by id'
      tags:
        - 'Positions'
  /api/v2/atlas/account/limits:
    get:
      description: 'Funding-method and global limits for your account. Use before submitting a deposit or withdrawal so you fail client-side instead of on the wire. Pass `with_remaining` to include how much of each limit is left; filter with `currency` and `reference_type`.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsEntity'
          description: ''
      summary: 'Account limits'
      tags:
        - 'Account'
  /api/v2/atlas/account/orders:
    post:
      description: 'Places a non-custodial order. `signed_order` is an EIP-712 signature over the CTF Exchange Order struct. Atlas validates it — a signature it cannot verify is rejected rather than placed — then relays to the engine and attaches the signature. Placing locks the stake PLUS the maximum taker fee the fill could incur; the unused reserve is released. PASSKEY WALLETS: a passkey signs only in the browser it was registered in, and browser-held session keys are non-extractable, so neither can sign from a script. To place orders programmatically, add a SECOND SIGNING KEY to your wallet (Settings → Wallet → Signing keys) — an address you hold the key for, which becomes an owner of the same Safe. Orders stay `signature_type` 3 with maker == signer == the Safe; the signature becomes a standard Safe owner signature over the EIP-712 `SafeMessage(bytes message)` whose message is `abi.encode(orderHash)`, in a domain of (chainId, the Safe). Signing the order hash directly always fails.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEntity'
          description: ''
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: 'Signature or validation failure'
      summary: 'Place a signed order'
      tags:
        - 'Trade'
  /api/v2/atlas/account/positions:
    get:
      description: 'Your net holdings per market and outcome, with the quantity you can sell right now (total less anything already reserved by a resting sell order). Use this to offer a position for sale; use /account/contracts for the trade history behind it.'
      parameters:
        - description: 'Positions per page. Defaults to 100, capped at 200.'
          example: 100
          in: 'query'
          name: 'limit'
          required: false
          schema:
            default: 100
            maximum: 200
            minimum: 1
            type: 'integer'
        - description: 'Page number, from 1.'
          example: 1
          in: 'query'
          name: 'page'
          required: false
          schema:
            default: 1
            minimum: 1
            type: 'integer'
        - description: 'Default true: only holdings with a quantity above zero. Pass `false` to include settled and fully-exited holdings, which are kept as zero rows for the audit trail.'
          example: true
          in: 'query'
          name: 'open_only'
          required: false
          schema:
            default: true
            type: 'boolean'
        - description: 'Filter to one outcome.'
          example: 'yes'
          in: 'query'
          name: 'outcome'
          required: false
          schema:
            enum:
              - 'yes'
              - 'no'
            type: 'string'
        - description: 'Filter to several markets at once — comma-separated engine market ids, at most 50. Lets an event page read its holdings across all of its markets in one call. Combines with the other filters; a non-numeric id or a longer list is a 400.'
          example: '5871,5872,5873'
          in: 'query'
          name: 'market_ids'
          required: false
          schema:
            type: 'string'
        - description: 'Filter to one market, by the engine''s market id.'
          example: '5871'
          in: 'query'
          name: 'market_id'
          required: false
          schema:
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PositionEntity'
                type: 'array'
          description: ''
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: '`market_ids` holds a non-numeric id or more than the cap'
      summary: 'Your positions'
      tags:
        - 'Positions'
  /api/v2/atlas/account/preferences:
    get:
      description: 'Your display preferences. Today: `leaderboard_opt_out` — whether your username appears on the public PnL leaderboard.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesEntity'
          description: ''
      summary: 'Read preferences'
      tags:
        - 'Account'
    put:
      description: 'Partial update — send only the fields to change. Unknown keys are ignored. Returns the full preferences object after apply.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdateRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesEntity'
          description: ''
      summary: 'Update preferences'
      tags:
        - 'Account'
  /api/v2/atlas/account/referrals/earnings:
    get:
      description: 'Commission from members you referred, funded from the taker fee they pay on fills. Lifetime totals by currency, split into what is still waiting for the daily payout (`pending_by_currency`) and what has already been paid to your wallet (`paid_by_currency`); the same per referred member; the payout history, one entry per payout sweep; when the next payout is due; and how often the sweep runs.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralEarningsEntity'
          description: ''
      summary: 'Referral earnings'
      tags:
        - 'Rewards'
  /api/v2/atlas/account/rewards/liquidity:
    get:
      description: 'Liquidity rewards earned for resting orders, one row per market per UTC day, newest first. Scored daily at 01:00 UTC for the previous day and paid by the daily sweep — `status` moves pending → paying → paid. Filter with `status`; paginate with `page` and `limit` (totals in the `Page` / `Per-Page` / `Total` headers).'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LiquidityRewardEntity'
                type: 'array'
          description: ''
      summary: 'Your liquidity rewards'
      tags:
        - 'Rewards'
  /api/v2/atlas/account/rewards/pending:
    get:
      description: 'Maker rebates and referral rewards accrued but not yet swept. Rewards accrue the moment a trade fills and are paid on a daily sweep, so this ticks up between payouts. Reaching 0 after a sweep is expected, not an error.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRewardsEntity'
          description: ''
      summary: 'Pending rewards'
      tags:
        - 'Rewards'
  /api/v2/atlas/account/settled:
    get:
      description: 'Every market you held when it resolved — the position you held, what it cost you (collateral plus fees), and what it paid. A market you lost appears here with a payout of 0, which is why this is not the same as filtering your transactions: a losing position moves no money at settlement and so has no transaction. One row per market, newest first.'
      parameters:
        - description: 'Markets per page. Defaults to 25, capped at 100.'
          example: 25
          in: 'query'
          name: 'limit'
          required: false
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: 'integer'
        - description: 'Page number, from 1. Most recently settled market first.'
          example: 1
          in: 'query'
          name: 'page'
          required: false
          schema:
            default: 1
            minimum: 1
            type: 'integer'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SettledMarketEntity'
                type: 'array'
          description: ''
      summary: 'Settled markets'
      tags:
        - 'Positions'
  /api/v2/atlas/account/stats/pnl:
    get:
      description: 'Realized PnL from settled contracts, per-market breakdown, and capital in/out. Open positions are not valued here — mark them client-side against the live price feed. `pnl_currency` narrows the response to a single collateral currency.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlEntity'
          description: ''
      summary: 'Prediction PnL'
      tags:
        - 'Account'
  /api/v2/atlas/account/stats/pnl/history:
    get:
      description: 'Cumulative realized PnL over time, plus cumulative net deposits. Defaults to the last 30 days in daily buckets. Open positions are not valued — a member holding only open positions sees a flat line until their markets settle.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PnlPointEntity'
                type: 'array'
          description: ''
      summary: 'Prediction PnL history'
      tags:
        - 'Account'
  /api/v2/atlas/account/transactions:
    get:
      description: 'Your ledger across deposits, withdrawals, trades, internal transfers, referral earnings and maker rewards. Filter with `currency`, `type`, and time bounds; paginate with `page` and `limit` — totals land in the `Page` / `Per-Page` / `Total` response headers.'
      parameters:
        - description: 'Entries per page, 1–1000. Defaults to 50.'
          example: 50
          in: 'query'
          name: 'limit'
          required: false
          schema:
            default: 50
            maximum: 1000
            minimum: 1
            type: 'integer'
        - description: 'Page number, from 1. Read `Total` off the response headers.'
          example: 1
          in: 'query'
          name: 'page'
          required: false
          schema:
            default: 1
            minimum: 1
            type: 'integer'
        - description: 'Sort direction on the entry timestamp. Defaults to `desc`.'
          example: 'desc'
          in: 'query'
          name: 'order_by'
          required: false
          schema:
            default: 'desc'
            enum:
              - 'asc'
              - 'desc'
            type: 'string'
        - description: 'Upper bound, Unix SECONDS.'
          example: 1725148800
          in: 'query'
          name: 'time_to'
          required: false
          schema:
            type: 'number'
        - description: 'Lower bound, Unix SECONDS — not milliseconds, and not ISO-8601. A millisecond value lands far in the future and returns nothing rather than erroring.'
          example: 1722470400
          in: 'query'
          name: 'time_from'
          required: false
          schema:
            type: 'number'
        - description: 'Find the entry for one on-chain transaction.'
          example: '0x9f2c…'
          in: 'query'
          name: 'txid'
          required: false
          schema:
            type: 'string'
        - description: 'Filter by what produced the entry.'
          example: 'trade'
          in: 'query'
          name: 'type'
          required: false
          schema:
            enum:
              - 'deposit'
              - 'withdraw'
              - 'internal_transfer'
              - 'trade'
              - 'referral'
              - 'referral_reward'
              - 'maker_reward'
              - 'lp_reward'
            type: 'string'
        - description: 'Filter to one asset. Matches either side of the entry, credit or debit.'
          example: 'usdc'
          in: 'query'
          name: 'currency'
          required: false
          schema:
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TransactionEntity'
                type: 'array'
          description: ''
      summary: 'Transaction history'
      tags:
        - 'Account'
  /api/v2/atlas/account/wallet:
    get:
      description: 'The same funding config without the market fields — your Safe (the deposit destination), its owner, and any outstanding setup. For a wallet page that is not tied to a market.'
      parameters:
        - description: 'Comma-separated sub-resources to carry inline, each under a key of the same name holding exactly what its own route returns: `owners` (GET /account/wallet/owners), `session_key` (GET /account/wallet/session-key), `auto_redeem` (GET /account/wallet/auto-redeem), `redeemable` (GET /account/wallet/redeemable). They are resolved in parallel from one wallet lookup, so one round-trip replaces five. Unknown names are ignored. Every requested key is always present: an include that is not applicable to the account (e.g. `owners` without a passkey wallet, a 400 on its own route) is `null` here rather than a failed request.'
          example: 'owners,session_key,auto_redeem,redeemable'
          in: 'query'
          name: 'include'
          required: false
          schema:
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfWalletBundleEntity'
          description: ''
      summary: 'CTF wallet'
      tags:
        - 'Wallet'
  /api/v2/atlas/account/wallet/auto-redeem:
    get:
      description: 'Whether resolved winnings are redeemed into your Safe automatically, and the contract to approve (or revoke) to change it.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfAutoRedeemEntity'
          description: ''
      summary: 'Auto-redeem status'
      tags:
        - 'Wallet'
    put:
      description: 'Call after relaying `setApprovalForAll(auto_redeemer_address, enabled)` from your Safe. Returns 409 if the chain does not show that approval yet.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRedeemRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfAutoRedeemEntity'
          description: ''
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: '`enabled` is not a boolean'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: 'Auto-redeem is unavailable for this account, the Safe is not registered yet, or the chain does not show the approval (or its revocation) yet'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: 'On-chain state could not be read'
      summary: 'Set auto-redeem'
      tags:
        - 'Wallet'
  /api/v2/atlas/account/wallet/markets/{id}:
    get:
      description: 'Everything needed to build and sign an order for one market. Check `safe_status` first: on `setup_required` an order will rest and then fail to settle.'
      parameters:
        - in: 'path'
          name: 'id'
          required: true
          schema:
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfConfigEntity'
          description: ''
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: 'Market is not CTF-registered'
      summary: 'CTF config for a market'
      tags:
        - 'Wallet'
  /api/v2/atlas/account/wallet/owners:
    get:
      description: 'Returns the Safe and its current owners. A passkey wallet has exactly one owner (the signer contract derived from your passkey) until you add a signing wallet of your own.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeOwnersEntity'
          description: ''
      summary: 'List the keys that can sign for your wallet'
      tags:
        - 'Wallet'
    post:
      description: 'Returns the Safe call authorising another address to sign for your wallet (or removing one, with `remove: true`). Sign it with your passkey and relay it — nothing changes until you do. An added key is a full owner: it can place orders, withdraw, redeem, and remove your passkey. Adding a key you already added returns no calls.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafeOwnerRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeOwnerPrepareEntity'
          description: ''
      summary: 'Add or remove a signing key on your wallet'
      tags:
        - 'Wallet'
  /api/v2/atlas/account/wallet/passkey:
    post:
      description: 'Registers the PUBLIC half of a WebAuthn credential and derives the signer contract and Safe address from it. The private half never leaves your authenticator, so Calibri holds no key and cannot recover the account — enrol on a platform whose passkeys sync, or the wallet dies with the device.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyEnrolRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfWalletEntity'
          description: ''
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      summary: 'Enrol a passkey wallet'
      tags:
        - 'Wallet'
  /api/v2/atlas/account/wallet/redeemable:
    get:
      description: 'Settled markets whose self-custody payout you have not yet redeemed, with the wallet config to sign the redeem.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfRedeemableEntity'
          description: ''
      summary: 'Redeemable winnings'
      tags:
        - 'Wallet'
  /api/v2/atlas/account/wallet/relay:
    post:
      description: 'Gasless relay for any Safe transaction you have signed — setup approvals, redeeming winnings, or moving USDC out. The operator executes and pays the gas; it cannot act without your signature. The Safe must be your own.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayResultEntity'
          description: ''
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      summary: 'Relay a Safe transaction'
      tags:
        - 'Wallet'
  /api/v2/atlas/account/wallet/session-key:
    delete:
      description: 'Returns the Safe call to revoke one grant, or every outstanding grant when `key_id` is omitted. Revocation takes effect the moment it is relayed and does kill resting orders that key signed.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionKeyRevokeRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKeyRevokeEntity'
          description: ''
      summary: 'Revoke a session key'
      tags:
        - 'Wallet'
    get:
      description: 'Whether session keys are usable, the highest grant id issued, and the policy TTLs. Returns `enabled: false` rather than an error where the deployment has no session contracts — the caller then falls back to prompting the passkey per order.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKeyStatusEntity'
          description: ''
      summary: 'Session key status'
      tags:
        - 'Wallet'
    post:
      description: 'Returns the Safe calls that authorise a browser-held P-256 key to sign orders. Nothing is authorised until you sign and relay them. `expires_at` is clamped DOWN to policy. The key is never a Safe owner, so withdraw and redeem stay passkey-only.'
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionKeyPrepareRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKeyPrepareEntity'
          description: ''
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      summary: 'Authorise a session key'
      tags:
        - 'Wallet'
  /api/v2/atlas/public/currencies:
    get:
      description: 'Visible currencies in the registry. Collateral is USDC (6-decimal) on the chain named by `blockchain_key`. Fields describing operator-custodied funding — deposit and withdrawal fees, minimums, enabled flags — are retained for schema stability and do not apply: funding happens on your own Safe.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CurrencyEntity'
                type: 'array'
          description: ''
      security: []
      summary: 'List currencies'
      tags:
        - 'Currencies'
  /api/v2/atlas/public/currencies/{id}:
    get:
      description: 'One currency from the registry, by code (e.g. `usdc`). Same object as a list element; only visible currencies resolve.'
      parameters:
        - in: 'path'
          name: 'id'
          required: true
          schema:
            type: 'string'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyEntity'
          description: ''
      security: []
      summary: 'Currency by id'
      tags:
        - 'Currencies'
  /api/v2/atlas/public/health/alive:
    get:
      description: 'Liveness probe for the Atlas process. Returns plain-text `200` when the process is up — not a dependency check, and not a trading-engine readiness signal.'
      parameters: []
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: 'string'
          description: 'Alive. The body is the literal string `200`, as `text/plain`.'
      security: []
      summary: 'Health check'
      tags:
        - 'Health'
  /api/v2/atlas/public/rates:
    get:
      description: 'USD-based reference rates, refreshed from a price provider on our own clock. DISPLAY ONLY: every market is priced, collateralised and settled in USDC, and an order signature commits to a USDC amount — these decide what number is shown beside it and nothing else. Served from memory, so poll no faster than `ttl_seconds`.'
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatesEntity'
          description: ''
      security: []
      summary: 'Reference exchange rates'
      tags:
        - 'Currencies'
security:
  - apiKey: []
servers:
  - description: 'Production'
    url: 'https://calibri.io'
