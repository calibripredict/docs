openapi: 3.1.0
info:
  title: Calibri API
  version: '1.0.0'
  description: >-
    The Calibri API. Discover markets, read live books, place signed orders,
    and manage positions and account data.

    Routed by path prefix to the service that answers it — which is an
    implementation detail, not something a caller has to reason about.
servers:
  - description: Production
    url: https://calibri.io
tags:
  - name: Health
    description: Service liveness.
    x-displayName: Health
  - name: Events
    description: Discover events and their metadata.
    x-displayName: Events
  - name: Markets
    description: List markets and load market detail for trading.
    x-displayName: Markets
  - name: Series
    description: Recurring event series.
    x-displayName: Series
  - name: Tags
    description: Editorial shelves used to browse the catalogue.
    x-displayName: Tags
  - name: Market Data
    description: Order book, depth, trade tape, tickers, and candles.
    x-displayName: Market Data
  - name: Assets
    description: Underlying asset price history for price-feed markets.
    x-displayName: Assets
  - name: Community
    description: Leaderboard and platform activity.
    x-displayName: Community
  - name: Currencies
    description: Currency registry.
    x-displayName: Currencies
  - name: Trade
    description: Place, list, and cancel orders.
    x-displayName: Trade
  - name: Positions
    description: Your matched contracts.
    x-displayName: Positions
  - name: Wallet
    description: Self-custody Safe, passkey, session keys, and relay.
    x-displayName: Wallet
  - name: Rewards
    description: Maker rebates and referral earnings.
    x-displayName: Rewards
  - name: Account
    description: Balances, ledger, PnL, limits, preferences, and profile.
    x-displayName: Account
externalDocs:
  description: ''
  url: ''
paths:
  /api/v2/pythia/orders:
    get:
      description: |-
        Your prediction orders. Open (`wait`) rows come from the live
        engine index; terminal history (`done`, `cancel`, `reject`) from
        storage. Pass `state=wait` for the open-orders tab — that is what
        the product calls for resting orders, custodial and non-custodial
        alike. Placement path differs (Atlas signed-order vs this service's
        direct POST); list and cancel do not.

        Pagination: `page` / `limit` in, totals in the `Page` / `Per-Page` /
        `Total` response headers.
      parameters:
        - description: wait (open), done, cancel, reject
          in: query
          name: state
          schema:
            type: string
        - description: Market id
          in: query
          name: market
          schema:
            type: string
        - description: limit or market
          in: query
          name: ord_type
          schema:
            type: string
        - description: 'Side filter: yes or no'
          in: query
          name: type
          schema:
            type: string
        - description: Lower bound, Unix SECONDS (not milliseconds)
          in: query
          name: time_from
          schema:
            type: integer
        - description: Upper bound, Unix SECONDS (not milliseconds)
          in: query
          name: time_to
          schema:
            type: integer
        - description: asc or desc (default desc)
          in: query
          name: order_by
          schema:
            type: string
        - description: Page (default 1)
          in: query
          name: page
          schema:
            type: integer
        - description: Rows per page, 1-100 (default 100)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemberOrder'
                type: array
          description: OK
          headers:
            Page:
              schema:
                type: integer
            Per-Page:
              schema:
                type: integer
            Total:
              schema:
                type: integer
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
        - apiKey: []
      summary: Your orders
      tags:
        - Trade
  /api/v2/pythia/orders/{id}:
    get:
      description: |-
        One of your orders. Open orders resolve from the live index;
        terminal ones fall back to history. Returns 404 for another
        member's order rather than 403.
      parameters:
        - description: Order id
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberOrder'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      security:
        - apiKey: []
      summary: Order by id
      tags:
        - Trade
  /api/v2/pythia/orders/{id}/cancel:
    post:
      description: |-
        Cancels one of your open (`wait`) orders and refunds unmatched
        collateral. Same route for custodial and non-custodial resting
        orders — non-custodial placement is via Atlas; once resting, cancel
        is here. Terminal orders return 422.
      parameters:
        - description: Order id
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCancelResult'
          description: Accepted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
      security:
        - apiKey: []
      summary: Cancel an order
      tags:
        - Trade
  /api/v2/pythia/public/activity:
    get:
      description: |-
        Recent platform activity across ordinary trades, large trades,
        settlements and newly activated markets, newest first. Filter with
        `type` (`trades`, `settlements`, `new_markets`); omit it for the
        combined feed.
      parameters:
        - description: trades, settlements or new_markets
          in: query
          name: type
          schema:
            type: string
        - description: Rows, 1-200 (default 50)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivityItem'
                type: array
          description: OK
      summary: Activity feed
      tags:
        - Community
      security: []
  /api/v2/pythia/public/assets:
    get:
      description: |-
        Underlying symbols that have recorded tick/candle history
        (e.g. exchange products feeding candle-direction markets). Read
        this rather than hard-coding a product list that will go stale.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSymbolsResponse'
              example:
                symbols:
                  - BTC-USD
                  - ETH-USD
                  - SOL-USD
          description: OK
      summary: Asset symbols
      tags:
        - Assets
      security: []
  /api/v2/pythia/public/assets/{symbol}/candles:
    get:
      description: >-
        The EXCHANGE'S OWN published candles, stored verbatim — not recomputed

        from sampled ticks. A candle derived from samples has systematically

        narrower wicks, and a member trading off the chart is paid off the

        exchange's candle, so the two have to be the same numbers by
        construction.


        Paged BACKWARD only: send the returned next_to as the new to.
      parameters:
        - description: Coinbase product id, e.g. BTC-USD
          in: path
          name: symbol
          required: true
          schema:
            type: string
        - description: 'A width the exchange publishes: 1m, 5m, 15m, 1h, 6h, 1d (default 1m)'
          in: query
          name: granularity
          schema:
            type: string
        - description: Page cursor, Unix seconds. Defaults to now
          in: query
          name: to
          schema:
            type: integer
        - description: Candles per page, 1-1000 (default 300)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCandlesResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Asset candles
      tags:
        - Assets
      security: []
  /api/v2/pythia/public/assets/{symbol}/prices:
    get:
      description: |-
        The recorded tick stream over a closed range, oldest first — the shape
        that draws one window. BOTH bounds are required: this endpoint draws a
        window, and a window has two ends.

        `t` is Unix seconds, matching the live websocket tick, so a historical
        fetch and a live subscription concatenate without a time conversion in
        the middle.
      parameters:
        - description: Coinbase product id, e.g. BTC-USD
          in: path
          name: symbol
          required: true
          schema:
            type: string
        - description: Range start, Unix seconds
          in: query
          name: from
          required: true
          schema:
            type: integer
        - description: Range end, Unix seconds. Must be after from
          in: query
          name: to
          required: true
          schema:
            type: integer
        - description: Max points, 1-5000 (default 5000)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPricesResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Asset ticks
      tags:
        - Assets
      security: []
  /api/v2/pythia/public/assets/{symbol}/window:
    get:
      description: >-
        The exchange's own candle for ONE window — the price to beat, and the

        price so far. This is the figure a candle-direction market settles on.


        Two flags, and the distinction matters: `complete` means the window is

        over BY THE CLOCK; `confirmed` means the stored candle was read AFTER
        its

        bucket closed and can no longer change. In the seconds between, complete

        is true while close is still mid-formation — do not present an

        unconfirmed close as final.
      parameters:
        - description: Coinbase product id, e.g. BTC-USD
          in: path
          name: symbol
          required: true
          schema:
            type: string
        - description: Window opening instant, Unix seconds, on a granularity boundary
          in: query
          name: start
          required: true
          schema:
            type: integer
        - description: Window width in seconds (default 300)
          in: query
          name: granularity_seconds
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetWindowResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Asset window
      tags:
        - Assets
      security: []
  /api/v2/pythia/public/events:
    get:
      description: |-
        The catalogue of events, each with its child markets.

        A generated or sub-daily series is COLLAPSED to a single entry — a
        five-minute feed publishes 288 events a day and must not fill the feed.
        Pass `series` to drill into one and get its individual windows; that is
        the only way to see them.
      parameters:
        - description: Filter by category
          in: query
          name: category
          schema:
            type: string
        - description: Filter by status. `resolved` covers determined and settled
          in: query
          name: status
          schema:
            type: string
        - description: Filter to one tag slug
          in: query
          name: tag
          schema:
            type: string
        - description: Filter to one series slug. Expands it rather than collapsing
          in: query
          name: series
          schema:
            type: string
        - description: Sort order, e.g. newest
          in: query
          name: sort
          schema:
            type: string
        - description: Reverse the sort
          in: query
          name: reverse
          schema:
            type: boolean
        - description: Order of markets[] within each event
          in: query
          name: market_sort
          schema:
            type: string
        - description: Page size, applied after collapsing
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Event'
                type: array
          description: OK
      summary: List events
      tags:
        - Events
      security: []
  /api/v2/pythia/public/events/{slug}:
    get:
      description: |-
        One event with its markets — the same object as a list element.
        Falls back to MySQL for older windows that have left the live
        cache, so bookmarked and historical links keep resolving.
      parameters:
        - description: Event slug
          in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Event by slug
      tags:
        - Events
      security: []
  /api/v2/pythia/public/leaderboard:
    get:
      description: |-
        Top members by realised PnL on settled contracts. `username` is a
        privacy-masked display name (or an explicit display name when set).
        A member with settled contracts in more than one currency appears
        once per currency. Filter with `period` (`all`, `24h`, `7d`, `30d`).
      parameters:
        - description: all (default), 24h, 7d or 30d
          in: query
          name: period
          schema:
            type: string
        - description: Rows, 1-500 (default 100)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
                type: array
          description: OK
      summary: Leaderboard
      tags:
        - Community
      security: []
  /api/v2/pythia/public/markets:
    get:
      description: |-
        Every live market as a flat list, with the same object shape as market
        detail (pricing fields and CTF ids included). An order — including a
        signed one — can be built straight from a list response without a
        per-market follow-up call.
      parameters:
        - description: >-
            Filter on the published status. `resolved` covers determined and
            settled
          in: query
          name: status
          schema:
            type: string
        - description: Filter by base unit
          in: query
          name: base_unit
          schema:
            type: string
        - description: Filter by quote unit
          in: query
          name: quote_unit
          schema:
            type: string
        - description: asc (default) or desc
          in: query
          name: ordering
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MarketPayload'
                type: array
          description: OK
      summary: List markets
      tags:
        - Markets
      security: []
  /api/v2/pythia/public/markets/{market}:
    get:
      description: >-
        One market with pricing fields and CTF ids needed to build an order.

        Falls back to stored data for settled and voided markets, so historical

        markets and bookmarked links keep resolving after the engine has dropped
        them.
      parameters:
        - description: Market id
          in: path
          name: market
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPayload'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Market detail
      tags:
        - Markets
      security: []
  /api/v2/pythia/public/markets/{market}/contracts/recent:
    get:
      description: |-
        The public trade tape — recently matched YES/NO contracts at a
        price and volume, newest first. Served for settled markets too
        (historical tape from storage), not only live engine markets.
      parameters:
        - description: Market id
          in: path
          name: market
          required: true
          schema:
            type: string
        - description: Rows, 1-1000 (default 100)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicContract'
                type: array
          description: OK
      summary: Recent contracts
      tags:
        - Market Data
      security: []
  /api/v2/pythia/public/markets/{market}/depth:
    get:
      description: |-
        Aggregated book as `[price, volume]` pairs per side, best-first,
        plus a server timestamp. Lighter than the full order-book payload —
        use this for depth charts; use the order-book endpoint when you
        need side-tagged levels.
      parameters:
        - description: Market id
          in: path
          name: market
          required: true
          schema:
            type: string
        - description: Levels per side, 1-100 (default 100)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepthResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Depth
      tags:
        - Market Data
      security: []
  /api/v2/pythia/public/markets/{market}/k-line:
    get:
      description: |-
        OHLC history for the market's own probability (not the underlying
        asset). Each row is [timestamp, open, high, low, close, volume],
        timestamp in Unix seconds. Settled markets are still served from
        storage so historical charts keep loading.
      parameters:
        - description: Market id
          in: path
          name: market
          required: true
          schema:
            type: string
        - description: 'Period in minutes: 1,5,15,30,60,120,240,360,720,1440,4320,10080'
          in: query
          name: period
          schema:
            type: integer
        - description: Unix seconds
          in: query
          name: time_from
          schema:
            type: integer
        - description: Unix seconds
          in: query
          name: time_to
          schema:
            type: integer
        - description: Rows, 1-10000 (default 30)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  items:
                    type: object
                  type: array
                type: array
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: K-line (candles)
      tags:
        - Market Data
      security: []
  /api/v2/pythia/public/markets/{market}/order-book:
    get:
      description: |-
        Aggregated combined book. Because YES + NO = 1.00 there is one book,
        expressed as YES bids and NO bids. Each level carries side, price and
        volume ONLY — no order ids, timestamps or owner data are exposed.
        Use `depth` for the lighter `[price, volume]` chart shape.
      parameters:
        - description: Market id
          in: path
          name: market
          required: true
          schema:
            type: string
        - description: Levels per side, 1-200 (default 20)
          in: query
          name: asks_limit
          schema:
            type: integer
        - description: Levels per side, 1-200 (default 20)
          in: query
          name: bids_limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Order book
      tags:
        - Market Data
      security: []
  /api/v2/pythia/public/markets/{market}/ticker:
    get:
      description: >-
        Rolling 24h ticker for one market — last, open, high, low, volume

        and change. For a live multi-market dashboard prefer `GET
        /public/tickers`.
      parameters:
        - description: Market id
          in: path
          name: market
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerResponse'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Ticker
      tags:
        - Market Data
      security: []
  /api/v2/pythia/public/series:
    get:
      description: |-
        Every series backing at least one active event, busiest first.
        Derived from the live event cache — empty shelves never appear.
        Use a series slug with `GET /public/events?series=` to expand
        collapsed windows.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SeriesCount'
                type: array
          description: OK
      summary: List series
      tags:
        - Series
      security: []
  /api/v2/pythia/public/tags:
    get:
      description: |-
        Every tag with at least one ACTIVE event on it, busiest first, with
        an event count. Derived from the live event cache, so an empty shelf
        never appears — use for category navigation, not a static taxonomy.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagCount'
                type: array
          description: OK
      summary: List tags
      tags:
        - Tags
      security: []
  /api/v2/pythia/public/tickers:
    get:
      description: |-
        A snapshot of the rolling 24h ticker for every live market, keyed
        by market id. Prefer this over N single-market ticker calls when
        building a multi-market board.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: '#/components/schemas/TickerResponse'
                type: object
              example:
                '12':
                  at: 1723033200
                  ticker:
                    buy: '0.62'
                    sell: '0.64'
                    low: '0.58'
                    high: '0.67'
                    open: '0.60'
                    last: '0.62'
                    avg_price: '0.61'
                    vol: '1500.25'
                    amount: '900.50'
                    price_change_percent: +3.33%
                '13':
                  at: 1723033200
                  ticker:
                    buy: '0.41'
                    sell: '0.43'
                    low: '0.39'
                    high: '0.47'
                    open: '0.45'
                    last: '0.42'
                    avg_price: '0.43'
                    vol: '820.00'
                    amount: '352.60'
                    price_change_percent: -6.67%
          description: OK
      summary: All tickers
      tags:
        - Market Data
      security: []
  /api/v2/atlas/account/balances:
    get:
      description: >-
        Your balances per currency. `balance_safe` (available) and `locked_safe`
        (reserved) are the mirror of the USDC in your own on-chain Safe — those
        are the figures that matter. `balance` / `locked` / `total` are the
        operator-held pool, which Calibri does not operate, so they are always
        "0".
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BalanceEntity'
                type: array
          description: ''
      security: []
      summary: All balances
      tags:
        - Account
  /api/v2/atlas/account/balances/{currency}:
    get:
      description: >-
        One currency's balance. Same shape as a list element — prefer
        `balance_safe` / `locked_safe` over the always-zero operator pool
        fields.
      parameters:
        - in: path
          name: currency
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceEntity'
          description: ''
      security: []
      summary: Balance by currency
      tags:
        - Account
  /api/v2/atlas/account/contracts:
    get:
      description: >-
        Your matched positions. A winning contract settles to the full 1.00 per
        share — the fee was taken at trade time — but winnings are NOT
        auto-paid: you redeem them yourself.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ContractEntity'
                type: array
          description: ''
      security: []
      summary: Your contracts
      tags:
        - Positions
  /api/v2/atlas/account/contracts/{id}:
    get:
      description: >-
        One matched position, only if you are a party to it. Same object as a
        list element — useful when following a fill or settlement deep-link.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractEntity'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      security: []
      summary: Contract by id
      tags:
        - Positions
  /api/v2/atlas/account/limits:
    get:
      description: >-
        Funding-method and global limits for your account. Use before submitting
        a deposit or withdrawal so you fail client-side instead of on the wire.
        Pass `with_remaining` to include how much of each limit is left; filter
        with `currency` and `reference_type`.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsEntity'
          description: ''
      security: []
      summary: Account limits
      tags:
        - Account
  /api/v2/atlas/account/orders:
    post:
      description: >-
        Places a non-custodial order. `signed_order` is an EIP-712 signature
        over the CTF Exchange Order struct. Atlas validates it — a signature it
        cannot verify is rejected rather than placed — then relays to the engine
        and attaches the signature. Placing locks the stake PLUS the maximum
        taker fee the fill could incur; the unused reserve is released.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEntity'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: Signature or validation failure
      security: []
      summary: Place a signed order
      tags:
        - Trade
  /api/v2/atlas/account/preferences:
    get:
      description: >-
        Your display preferences. Today: `leaderboard_opt_out` — whether your
        username appears on the public PnL leaderboard.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesEntity'
          description: ''
      security: []
      summary: Read preferences
      tags:
        - Account
    put:
      description: >-
        Partial update — send only the fields to change. Unknown keys are
        ignored. Returns the full preferences object after apply.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesEntity'
          description: ''
      security: []
      summary: Update preferences
      tags:
        - Account
  /api/v2/atlas/account/referrals/earnings:
    get:
      description: >-
        Lifetime commission from members you referred: totals by currency, plus
        a per-referred-member breakdown with last fee-paying trade time. Funded
        from the taker fee they paid on fills.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralEarningsEntity'
          description: ''
      security: []
      summary: Referral earnings
      tags:
        - Rewards
  /api/v2/atlas/account/rewards/pending:
    get:
      description: >-
        Maker rebates and referral rewards accrued but not yet swept. Rewards
        accrue the moment a trade fills and are paid on a daily sweep, so this
        ticks up between payouts. Reaching 0 after a sweep is expected, not an
        error.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRewardsEntity'
          description: ''
      security: []
      summary: Pending rewards
      tags:
        - Rewards
  /api/v2/atlas/account/stats/pnl:
    get:
      description: >-
        Realized PnL from settled contracts, per-market breakdown, and capital
        in/out. Open positions are not valued here — mark them client-side
        against the live price feed. `pnl_currency` narrows the response to a
        single collateral currency.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlEntity'
          description: ''
      security: []
      summary: Prediction PnL
      tags:
        - Account
  /api/v2/atlas/account/stats/pnl/history:
    get:
      description: >-
        Cumulative realized PnL over time, plus cumulative net deposits.
        Defaults to the last 30 days in daily buckets. Open positions are not
        valued — a member holding only open positions sees a flat line until
        their markets settle.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PnlPointEntity'
                type: array
          description: ''
      security: []
      summary: Prediction PnL history
      tags:
        - Account
  /api/v2/atlas/account/transactions:
    get:
      description: >-
        Your ledger across deposits, withdrawals, trades, internal transfers,
        referral earnings and maker rewards. Filter with `currency`, `type`, and
        time bounds; paginate with `page` and `limit` — totals land in the
        `Page` / `Per-Page` / `Total` response headers.
      parameters:
        - description: Entries per page, 1–1000. Defaults to 50.
          example: 50
          in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 1000
            minimum: 1
            type: integer
        - description: Page number, from 1. Read `Total` off the response headers.
          example: 1
          in: query
          name: page
          required: false
          schema:
            default: 1
            minimum: 1
            type: integer
        - description: Sort direction on the entry timestamp. Defaults to `desc`.
          example: desc
          in: query
          name: order_by
          required: false
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - description: Upper bound, Unix SECONDS.
          example: 1725148800
          in: query
          name: time_to
          required: false
          schema:
            type: number
        - description: >-
            Lower bound, Unix SECONDS — not milliseconds, and not ISO-8601. A
            millisecond value lands far in the future and returns nothing rather
            than erroring.
          example: 1722470400
          in: query
          name: time_from
          required: false
          schema:
            type: number
        - description: Find the entry for one on-chain transaction.
          example: 0x9f2c…
          in: query
          name: txid
          required: false
          schema:
            type: string
        - description: Filter by what produced the entry.
          example: trade
          in: query
          name: type
          required: false
          schema:
            enum:
              - deposit
              - withdraw
              - internal_transfer
              - trade
              - referral
              - maker_reward
            type: string
        - description: >-
            Filter to one asset. Matches either side of the entry, credit or
            debit.
          example: usdc
          in: query
          name: currency
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TransactionEntity'
                type: array
          description: ''
      security: []
      summary: Transaction history
      tags:
        - Account
  /api/v2/atlas/account/wallet:
    get:
      description: >-
        The same funding config without the market fields — your Safe (the
        deposit destination), its owner, and any outstanding setup. For a wallet
        page that is not tied to a market.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfWalletEntity'
          description: ''
      security: []
      summary: CTF wallet
      tags:
        - Wallet
  /api/v2/atlas/account/wallet/markets/{id}:
    get:
      description: >-
        Everything needed to build and sign an order for one market. Check
        `safe_status` first: on `setup_required` an order will rest and then
        fail to settle.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfConfigEntity'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: Market is not CTF-registered
      security: []
      summary: CTF config for a market
      tags:
        - Wallet
  /api/v2/atlas/account/wallet/passkey:
    post:
      description: >-
        Registers the PUBLIC half of a WebAuthn credential and derives the
        signer contract and Safe address from it. The private half never leaves
        your authenticator, so Calibri holds no key and cannot recover the
        account — enrol on a platform whose passkeys sync, or the wallet dies
        with the device.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyEnrolRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfWalletEntity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      security: []
      summary: Enrol a passkey wallet
      tags:
        - Wallet
  /api/v2/atlas/account/wallet/relay:
    post:
      description: >-
        Gasless relay for any Safe transaction you have signed — setup
        approvals, redeeming winnings, or moving USDC out. The operator executes
        and pays the gas; it cannot act without your signature. The Safe must be
        your own.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayResultEntity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      security: []
      summary: Relay a Safe transaction
      tags:
        - Wallet
  /api/v2/atlas/account/wallet/session-key:
    delete:
      description: >-
        Returns the Safe call to revoke one grant, or every outstanding grant
        when `key_id` is omitted. Revocation takes effect the moment it is
        relayed and does kill resting orders that key signed.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionKeyRevokeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKeyRevokeEntity'
          description: ''
      security: []
      summary: Revoke a session key
      tags:
        - Wallet
    get:
      description: >-
        Whether session keys are usable, the highest grant id issued, and the
        policy TTLs. Returns `enabled: false` rather than an error where the
        deployment has no session contracts — the caller then falls back to
        prompting the passkey per order.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKeyStatusEntity'
          description: ''
      security: []
      summary: Session key status
      tags:
        - Wallet
    post:
      description: >-
        Returns the Safe calls that authorise a browser-held P-256 key to sign
        orders. Nothing is authorised until you sign and relay them.
        `expires_at` is clamped DOWN to policy. The key is never a Safe owner,
        so withdraw and redeem stay passkey-only.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionKeyPrepareRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKeyPrepareEntity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      security: []
      summary: Authorise a session key
      tags:
        - Wallet
  /api/v2/atlas/public/currencies:
    get:
      description: >-
        Visible currencies in the registry. Collateral is USDC (6-decimal) on
        the chain named by `blockchain_key`. Fields describing
        operator-custodied funding — deposit and withdrawal fees, minimums,
        enabled flags — are retained for schema stability and do not apply:
        funding happens on your own Safe.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CurrencyEntity'
                type: array
          description: ''
      security: []
      summary: List currencies
      tags:
        - Currencies
  /api/v2/atlas/public/currencies/{id}:
    get:
      description: >-
        One currency from the registry, by code (e.g. `usdc`). Same object as a
        list element; only visible currencies resolve.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyEntity'
          description: ''
      security: []
      summary: Currency by id
      tags:
        - Currencies
  /api/v2/atlas/public/health/alive:
    get:
      description: >-
        Liveness probe for the Atlas process. Returns plain-text `200` when the
        process is up — not a dependency check, and not a trading-engine
        readiness signal.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEntity'
          description: ''
      security: []
      summary: Health check
      tags:
        - Health
  /api/v2/persona/identity/users:
    post:
      description: >-
        Signs up with email and password. The account starts at level 0 in
        `pending` and receives a confirmation email — confirm before signing in
        to trade. Optional referral code is accepted at signup.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
          description: ''
      security: []
      summary: Create an account
      tags:
        - Account
  /api/v2/persona/identity/users/email/confirm_code:
    post:
      description: >-
        Consumes the emailed confirmation token, stamps the email as verified,
        and moves the account to `active` so trading and verification steps can
        proceed.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEntity'
          description: ''
      security: []
      summary: Confirm an email address
      tags:
        - Account
  /api/v2/persona/identity/users/email/generate_code:
    post:
      description: >-
        Issues a fresh confirmation link for an account that has not confirmed
        yet. Fails if the email is already verified.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEntity'
          description: ''
      security: []
      summary: Resend the confirmation email
      tags:
        - Account
  /api/v2/persona/identity/users/me:
    get:
      description: >-
        The signed-in member. Narrower than `/resource/users/me`, which
        additionally returns the verification checklist.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
          description: ''
      security: []
      summary: Current account
      tags:
        - Account
  /api/v2/persona/identity/users/password/confirm_code:
    post:
      description: >-
        Consumes the emailed one-time token and sets the new password. Tokens
        are single-use and expire; a reused or stale token returns a validation
        error.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEntity'
          description: ''
      security: []
      summary: Confirm a password reset
      tags:
        - Account
  /api/v2/persona/identity/users/password/generate_code:
    post:
      description: >-
        Emails a reset link. Answers 2xx whether or not the address is
        registered — a distinguishable response would enumerate accounts.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEntity'
          description: ''
      security: []
      summary: Request a password reset
      tags:
        - Account
  /api/v2/persona/resource/users/me:
    get:
      description: >-
        The signed-in member plus `kyc`, the eleven-step verification checklist,
        and the public labels it is computed from. This is the payload a client
        gates onboarding on.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEntity'
          description: ''
      security: []
      summary: Current account with verification status
      tags:
        - Account
  /api/v2/persona/resource/users/password:
    put:
      description: >-
        Requires the current password. Only meaningful when
        `can_change_password` is true — wallet-native and social accounts carry
        a random password the holder never set.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEntity'
          description: ''
      security: []
      summary: Change password
      tags:
        - Account
  /api/v2/persona/resource/users/wallet:
    post:
      description: >-
        Attaches a verified EOA to the SIGNED-IN account, so an email or social
        member can trade non-custodially. Distinct from wallet login, which
        finds or creates an account for the wallet. Returns 409 if either the
        account or the wallet is already linked.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletLinkRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletLinkedEntity'
          description: ''
      security: []
      summary: Link a wallet to this account
      tags:
        - Account
components:
  schemas:
    ActivityItem:
      properties:
        amount:
          example: 250.5
          type: number
        created_at:
          example: '2026-08-07T10:05:30Z'
          type: string
        currency:
          example: usdc
          type: string
        description:
          example: Bought 250 YES at 0.62
          type: string
        event_slug:
          example: will-btc-reach-70k
          type: string
        id:
          example: trade-1420
          type: string
        market_id:
          example: '12'
          type: string
        side:
          example: 'yes'
          type: string
        title:
          example: BTC crosses $65,000
          type: string
        type:
          example: trade
          type: string
      type: object
    AssetCandlesResponse:
      properties:
        candles:
          items:
            $ref: '#/components/schemas/CandlePoint'
          type: array
          uniqueItems: false
        granularity:
          example: 1m
          type: string
        has_more:
          example: true
          type: boolean
        next_to:
          description: >-
            NextTo is the cursor for the next page back; HasMore is false when
            the

            page came back short, meaning the recorded history starts here and
            the

            client should stop rather than fire requests into an empty past
            forever.
          example: 1722950399
          type: integer
        symbol:
          example: BTC-USD
          type: string
      type: object
    AssetPricesResponse:
      properties:
        complete:
          description: >-
            Complete says whether the range has finished or is still filling. A
            client

            drawing a live window uses it to decide whether to also open a

            subscription; without it, it has to re-derive the clock comparison
            we

            just did.
          example: true
          type: boolean
        from:
          example: 1722950100
          type: integer
        points:
          items:
            $ref: '#/components/schemas/PricePoint'
          type: array
          uniqueItems: false
        symbol:
          example: BTC-USD
          type: string
        to:
          example: 1722950400
          type: integer
      type: object
    AssetSymbolsResponse:
      properties:
        symbols:
          description: Coinbase product ids with recorded tick/candle history.
          example:
            - BTC-USD
            - ETH-USD
            - SOL-USD
          items:
            type: string
            example: BTC-USD
          type: array
          uniqueItems: false
      example:
        symbols:
          - BTC-USD
          - ETH-USD
          - SOL-USD
      type: object
    AssetWindowResponse:
      properties:
        close:
          example: 65400.5
          type: number
        complete:
          description: 'Complete: the window is over BY THE CLOCK.'
          example: true
          type: boolean
        confirmed:
          description: >-
            Confirmed: the candle we hold was read AFTER its bucket closed, so
            it can

            no longer change. Distinct from Complete, and the distinction is the
            whole

            point — for the seconds between a window closing and the poller
            re-reading

            it, the clock says finished while the stored close is still a

            mid-formation value. Showing that as final would mean showing a
            number

            that then moves, on the one figure that decides whether a member
            won.
          example: true
          type: boolean
        granularity_seconds:
          example: 300
          type: integer
        high:
          example: 65450.75
          type: number
        low:
          example: 65300.5
          type: number
        open:
          description: >-
            Pointers, because present-but-empty is a real state: the poller has
            not

            read this bucket yet, which is normal in the first seconds of a
            window.

            Omitted rather than zeroed so a client shows a placeholder instead
            of

            drawing a $0.00 open.
          example: 65380.25
          type: number
        symbol:
          example: BTC-USD
          type: string
        window_end:
          example: 1722950700
          type: integer
        window_start:
          example: 1722950400
          type: integer
      type: object
    BookLevel:
      properties:
        price:
          example: '0.62'
          type: string
        side:
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: string
        volume:
          example: '100.50'
          type: string
      type: object
    CandlePoint:
      properties:
        c:
          example: 65400.5
          type: number
        h:
          example: 65450.75
          type: number
        l:
          example: 65300.5
          type: number
        o:
          example: 65380.25
          type: number
        t:
          example: 1722950400
          type: integer
        v:
          example: 245.8
          type: number
      type: object
    DepthResponse:
      properties:
        asks:
          items:
            items:
              type: string
            type: array
          type: array
          uniqueItems: false
        bids:
          items:
            items:
              type: string
            type: array
          type: array
          uniqueItems: false
        timestamp:
          description: Unix seconds.
          example: 1723033200
          type: integer
      type: object
    ErrorResponse:
      properties:
        errors:
          description: Match on the code, not the HTTP status or any human text.
          example:
            - order.not_found
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    LeaderboardEntry:
      properties:
        contracts:
          example: 30
          type: integer
        currency:
          example: usdc
          type: string
        rank:
          example: 1
          type: integer
        total_pnl:
          example: 4500.75
          type: number
        trades:
          example: 45
          type: integer
        uid:
          example: ID1A2B3C4D5E
          type: string
        username:
          example: alice***
          type: string
        win_rate:
          example: 0.7333
          type: number
        wins:
          example: 22
          type: integer
      type: object
    MarketPayload:
      properties:
        amount_precision:
          example: 2
          type: integer
        base_unit:
          example: BTCUSD
          type: string
        category:
          example: crypto
          type: string
        close_at:
