      type: object
    GlobalLimitEntity:
      properties:
        created_at:
          description: ISO-8601.
          example: '2026-08-07T10:00:00Z'
          type: string
        currency:
          example: usdc
          type: string
        day:
          description: Rolling 24-hour ceiling.
          example: '25000'
          type: string
        month:
          description: Rolling 30-day ceiling.
          example: '250000'
          type: string
        reference_type:
          description: What the limit is attached to.
          example: Order
          type: string
        remaining:
          additionalProperties:
            type: string
          description: >-
            How much of each window is left. Present only when `with_remaining`
