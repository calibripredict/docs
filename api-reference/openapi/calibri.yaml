            type: integer
        - description: Levels per side, 1-200 (default 20)
          in: query
          name: bids_limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookResponse'
          description: OK
        '404':
