          description: >-
            EventSlug / EventTitle are the market's event context, denormalised
            onto the

            market itself.


            A market is not addressable on its own — there is no markets.slug
            column, and the

            app routes /event/{slug}?market={id} — so without these a client
            holding a market

            from the flat /markets list cannot build a link or name what it
            belongs to, and

            has to go back for the event.


            Carried even when the market is already nested inside its event
            (where it is

            strictly redundant) so a market object means the same thing wherever
            it is found.

            A caller that pulls one out of an event payload and passes it on
            must not end up

            with something that has quietly lost its context.


            EventID is the durable key; the slug is editable and is for display
            and routing.
