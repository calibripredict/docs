          items:
            $ref: '#/components/schemas/GlobalLimitEntity'
          type: array
      required:
        - funding_method_limits
        - global_limits
      type: object
    LiquidityRewardEntity:
      properties:
        amount:
          example: '1.87'
          type: string
        currency:
          example: usdc
          type: string
        market_id:
          example: 42
          type: number
        market_title:
          description: Market title at read time; null if the market row is gone.
          example: Chiefs to win Super Bowl LXI
          type:
            - string
            - 'null'
        paid_at:
          description: RFC 3339, UTC. Null until paid.
          example: '2026-08-13T06:00:12Z'
          type:
            - string
            - 'null'
        reward_date:
          description: >-
            The UTC day the quoting was scored over (rewards are earned per day,
            not per instant).
          example: '2026-08-12'
          type: string
        status:
          description: >-
            `pending` — earned, awaiting the daily sweep. `paying` — sweep in
            flight. `paid` — in your balance.
          enum:
            - pending
            - paying
            - paid
          example: pending
          type: string
      required:
        - market_id
        - market_title
        - currency
        - reward_date
        - amount
        - status
        - paid_at
      type: object
    OrderEntity:
      properties:
        avg_price:
          description: >-
            Average price of the filled part, in the order's own outcome price
            space. Null while nothing has filled.
          example: '0.61'
          type:
            - string
            - 'null'
        client_order_id:
          description: The `client_order_id` you sent; null when none was.
          example: bot-7f3a-0001
          type:
            - string
            - 'null'
        contracts_count:
          description: Contracts formed from this order.
          example: 1
          type: number
        created_at:
          description: RFC 3339, UTC.
          example: '2026-08-07T10:00:00Z'
          type: string
        direction:
          enum:
            - buy
            - sell
          example: buy
          type: string
        event_slug:
          description: The parent event's slug, for linking. Null when unknown.
          example: btc-above-70k-december-2026
          type:
            - string
            - 'null'
        expires_at:
          description: >-
            When the order's signature lapses (RFC 3339, UTC); null when it has
            none. The engine never matches an order within 30 seconds of it.
          example: '2026-08-07T11:00:00Z'
          type:
            - string
            - 'null'
        fee:
          description: >-
            Taker fee charged to this order so far, in `quote_currency`. `"0"`
            for a maker.
          example: '0.17'
          type: string
        filled_cost:
          description: >-
            Cash for the filled part at the fill prices: paid on a buy, received
            before fees on a sell. Excludes `fee`. `"0"` while nothing has
            filled.
          example: '36.6'
          type:
            - string
            - 'null'
        filled_volume:
          example: '60'
          type: string
        id:
          example: 90311
          type: number
        ioc:
          description: >-
            Immediate-or-cancel: the unfilled remainder is refunded, never
            rested.
          example: false
          type: boolean
        locked:
          description: >-
            Collateral still locked. A separate taker-fee reserve is held
            alongside it and released when unused. Zero on a sell, which locks
            inventory instead.
          example: '24.68'
          type: string
        market_id:
          description: The market.
          example: 12
          type: number
        market_title:
          description: >-
            The market's title. Null when the engine does not know the market's
            metadata.
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type:
            - string
            - 'null'
        ord_type:
          enum:
            - limit
            - market
          example: limit
          type: string
        origin_locked:
          description: Collateral locked when the order was placed.
          example: '61.68'
          type: string
        origin_volume:
          example: '100'
          type: string
        post_only:
          description: Rejected rather than allowed to take liquidity.
          example: false
          type: boolean
        price:
          description: Limit price, `0.01`–`0.99`.
          example: '0.6'
          type: string
        quote_currency:
          example: usdc
          type: string
        remaining_volume:
          description: Unmatched remainder.
          example: '40'
          type: string
        side:
          description: The outcome traded.
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: string
        state:
          enum:
            - wait
            - done
            - cancel
            - reject
          example: wait
          type: string
        token_id:
          description: >-
            The on-chain ERC-1155 token for `side`, as a decimal string (a
            uint256 — do not parse as a number). Null when the market has no
            on-chain token.
          example: '52114319501245915516055106046884209969926127482827954674443846427813813222426'
          type:
            - string
            - 'null'
        updated_at:
          description: RFC 3339, UTC.
          example: '2026-08-07T10:05:00Z'
          type: string
        volume:
          description: Unmatched remainder (same as `remaining_volume`).
          example: '40'
          type: string
      required:
        - id
        - market_id
        - market_title
        - event_slug
        - side
        - direction
        - token_id
        - client_order_id
        - ord_type
        - price
        - state
        - volume
        - origin_volume
        - remaining_volume
        - filled_volume
        - avg_price
        - filled_cost
        - fee
        - locked
        - origin_locked
        - quote_currency
        - contracts_count
        - ioc
        - post_only
        - expires_at
        - created_at
        - updated_at
      type: object
    PasskeyEnrolRequest:
      properties:
        device:
          description: Platform and browser, for support. No identifiers.
          example: macOS · Chrome
          type: string
        prf_enabled:
          description: >-
            Whether the authenticator reported WebAuthn PRF support at
            registration. Recorded as reported and never acted on —
            authenticators are inconsistent about reporting it, so the
            authoritative test is whether a later assertion returns results.
          example: true
          type: boolean
        x:
          description: P-256 public key X coordinate, from the WebAuthn credential.
          example: 0x2f9a…
          type: string
        'y':
          description: P-256 public key Y coordinate.
          example: 0x8c41…
          type: string
      required:
        - x
        - 'y'
      type: object
    PendingRewardsEntity:
      properties:
        currency:
          example: usdc
          type: string
        liquidity:
          description: >-
            Liquidity rewards — earned for QUOTING rather than for filling, from
            how long your size rested inside the spread band. Scored once a day,
            so this steps rather than ticks.
          example: '0.75'
          type: string
        maker:
          description: Earned by your resting orders being filled.
          example: '2'
          type: string
        referral:
          description: Earned when someone you referred traded as the taker.
          example: '1.2'
          type: string
        total:
          description: Accrued but not yet swept — `maker + referral + liquidity`.
          example: '3.95'
          type: string
      required:
        - currency
        - total
        - maker
        - referral
        - liquidity
      type: object
    PnlCapitalEntity:
      properties:
        currency:
          example: usdc
          type: string
        deposits:
          description: Credited deposits, net of deposit fees.
          example: '1000'
          type: string
        net_deposits:
          description: >-
            deposits − withdrawals. The money the member put in, as opposed to
            earned.
          example: '750'
          type: string
        withdrawals:
          description: Succeeded withdrawals, including fees.
          example: '250'
          type: string
      required:
        - currency
        - deposits
        - withdrawals
        - net_deposits
      type: object
    PnlEntity:
      properties:
        by_currency:
          description: >-
            Realized totals, one block per collateral currency the member has
            traded in.
          items:
            $ref: '#/components/schemas/PnlRealizedEntity'
          type: array
        by_market:
          description: Realized PnL per market.
          items:
            $ref: '#/components/schemas/PnlMarketEntity'
          type: array
        capital:
          description: >-
            Money in versus out, per currency. Deliberately separate from PnL so
            growth from deposits is never mistaken for performance.
          items:
            $ref: '#/components/schemas/PnlCapitalEntity'
          type: array
      required:
        - by_currency
        - by_market
        - capital
      type: object
    PnlMarketEntity:
      properties:
        event_slug:
          description: The parent event's slug — what the row links to.
          example: btc-100k-by-year-end
          type:
            - string
            - 'null'
        event_title:
          example: Bitcoin price targets
          type:
            - string
            - 'null'
        legs:
          example: 4
          type: number
        market_id:
          example: 12
          type: number
        pnl:
          description: Realized PnL from settled legs in this market.
          example: '40'
          type: string
        quote_currency:
          example: usdc
          type: string
        title:
          description: Null if the market row is gone.
          example: Will BTC close above $100k on 31 Dec?
          type:
            - string
            - 'null'
      required:
        - market_id
        - title
        - event_slug
        - event_title
        - quote_currency
        - legs
        - pnl
      type: object
    PnlPointEntity:
      properties:
        at:
          description: Start of the bucket.
          example: '2026-08-01T00:00:00Z'
          type: string
        net_deposits:
          description: >-
            Cumulative deposits minus withdrawals as at this point. Subtract it
            from portfolio value to isolate trading performance from money paid
            in. Excludes adjustments and internal transfers, so it is not a full
            balance reconciliation.
          example: '1000'
          type:
            - string
            - 'null'
        realized_pnl:
          description: >-
            Cumulative realized PnL as at this point. A flat stretch means
            nothing settled in that period.
          example: '65.5'
          type: string
        settled_legs:
          description: Settled legs counted into the curve so far.
          example: 12
          type: number
      required:
        - at
        - realized_pnl
        - net_deposits
        - settled_legs
      type: object
    PnlRealizedEntity:
      properties:
        fees:
          description: Taker fees paid at match time.
          example: '4.5'
          type: string
        legs:
          description: Settled contract legs behind these figures.
          example: 12
          type: number
        pnl:
          description: returned − staked − fees. Positive is profit.
          example: '65.5'
          type: string
        quote_currency:
          description: >-
            The market's collateral currency. Figures are never summed across
            currencies.
          example: usdc
          type: string
        returned:
          description: >-
            Total returned — the whole collateral pool on winning legs, zero on
            losing ones.
          example: '520'
          type: string
        staked:
          description: Total staked on those legs.
          example: '450'
          type: string
      required:
        - quote_currency
        - legs
        - staked
        - returned
        - fees
        - pnl
      type: object
    PositionEntity:
      properties:
        avg_price:
          description: Weighted-average price paid for the contracts still held.
          example: '0.61'
          type: string
        cost_basis:
          description: avg_price × volume — what the holding cost you.
          example: '183'
          type: string
        custody:
          description: >-
            Which pool backs it. `self` holdings are real ERC-1155 tokens in
            your Safe; `custodial` are ledger entries. The two never net against
            each other.
          enum:
            - custodial
            - self
          example: self
          type: string
        event_slug:
          description: The parent event's slug — what a portfolio row links to.
          example: btc-updown-5m-1730
          type:
            - string
            - 'null'
        event_title:
          example: Bitcoin Up or Down 5m
          type:
            - string
            - 'null'
        locked_volume:
          description: Contracts reserved by your resting sell orders.
          example: '50'
          type: string
        market_id:
          description: The market this holding is in.
          example: 12
          type: number
        market_title:
          example: Will BTC close above its open?
          type:
            - string
            - 'null'
        outcome_label:
          description: The market's own label for this outcome (e.g. a team name).
          example: 'Yes'
          type: string
        outcome_labels:
          description: The market's labels for its two outcomes, `[yes, no]`.
          example:
            - 'Yes'
            - 'No'
          items:
            type: string
          type: array
        pending_volume:
          description: >-
            Contracts from a buy that has not settled on-chain yet ("settling").
            Held, but not sellable until the trade is confirmed on-chain; then
            they move into `sellable_volume`. Always `0` for `custodial`.
          example: '0'
          type: string
        quote_currency:
          description: The market's collateral currency.
          example: usdc
          type: string
        realized_pnl:
          description: >-
            Profit or loss already banked on this holding, from exits and from
            settlement. Excludes the unrealised move on what you still hold.
          example: '3'
          type: string
        sellable_volume:
          description: >-
            Contracts you can offer on a NEW sell order: `volume` less anything
            already reserved by a resting sell and less `pending_volume`. Size a
            sell against this, not `volume`.
          example: '250'
          type: string
        side:
          description: The outcome held.
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: string
        token_id:
          description: >-
            The on-chain ERC-1155 token for `side`, as a decimal string (a
            uint256 — do not parse as a number). Null when the market is not
            registered on-chain.
          example: '52114319501245915516055106046884209969926127482827954674443846427813813222426'
          type:
            - string
            - 'null'
        updated_at:
          description: RFC 3339, UTC.
          example: '2026-08-17T12:00:00Z'
          type:
            - string
            - 'null'
        volume:
          description: Contracts held.
          example: '300'
          type: string
      required:
        - market_id
        - market_title
        - event_slug
        - event_title
        - outcome_labels
        - side
        - outcome_label
        - token_id
        - custody
        - quote_currency
        - volume
        - sellable_volume
        - locked_volume
        - pending_volume
        - avg_price
        - cost_basis
        - realized_pnl
        - updated_at
      type: object
    PreferencesEntity:
      properties:
        leaderboard_opt_out:
          description: >-
            Opt out of the public leaderboard. Your masked display name stops
            appearing; settled contracts still count toward your own stats.
          example: false
          type: boolean
      type: object
    PreferencesUpdateRequest:
      properties:
        leaderboard_opt_out:
          description: >-
            Opt out of the public leaderboard. Your settled contracts still
            count toward your own stats.
          example: false
          type: boolean
      type: object
    RatesEntity:
      properties:
        base:
          description: >-
            The currency the rates are quoted against. Always `usd`; USDC is
            pegged to it.
          example: usd
          type: string
        rates:
          additionalProperties:
            type: string
          description: >-
            How many units of each currency one unit of `base` buys. DISPLAY
            ONLY: every market is priced, collateralised and settled in USDC,
            and an order signature commits to a USDC amount — these decide what
            number is printed beside it and nothing else. The base and the
            stablecoins pegged to it are omitted (they quote at 1.00). Decimal
            strings.
          example:
            eur: '0.85885'
            gbp: '0.736155'
            zar: '16.00105'
          type: object
        ttl_seconds:
          description: >-
            How long this response stays current. Poll no faster than this; a
            shorter interval returns the same body.
          example: 300
          type: number
        updated_at:
          description: >-
            When the provider struck these prices — not when we fetched them.
            RFC 3339, UTC, whole seconds.
          example: '2026-08-28T12:12:03Z'
          type: string
      required:
        - base
        - updated_at
        - ttl_seconds
        - rates
      type: object
