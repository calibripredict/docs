          example: https://www.coinbase.com/price/bitcoin
          type: string
      type: object
    TagRef:
      properties:
        id:
          example: 111
          type: integer
        label:
          example: Wimbledon
          type: string
        slug:
          example: wimbledon
          type: string
      type: object
    BalanceEntity:
      properties:
        address_eoa:
          description: The linked wallet address the balance above belongs to.
          example: '0xE1188438C85C98aADFf1a88f97764E607B4978C3'
          type:
            - string
            - 'null'
        balance:
          description: >-
            Operator-held pool. Calibri does not operate one, so this is always
            `"0"`; retained for schema stability. There is no `total` field —
            earlier docs claimed one, and the serializer has never emitted it.
          example: '0'
          type: string
        balance_eoa:
          description: >-
            Raw on-chain balance of the linked wallet, when the scanner has seen
            it. OMITTED rather than zeroed when unknown — the funding panel
            shows a dash for "no reading yet", which is not the same as an empty
            wallet.
          example: '42.10'
          type: string
        balance_safe:
          description: >-
            Available balance — the off-chain mirror of the USDC in your
            on-chain Safe. This is the figure that matters.
          example: '1250.00'
          type: string
        currency:
          description: Currency code, e.g. `usdc`.
          example: usdc
          type: string
        locked:
          description: Operator-held pool. Always `"0"`.
          example: '0'
          type: string
        locked_safe:
          description: >-
            Reserved by resting signed orders and their taker-fee reserve.
            Released when an order fills, rests, or is cancelled.
          example: '61.68'
          type: string
      required:
        - currency
        - balance_safe
        - locked_safe
        - balance
        - locked
      type: object
    ContractEntity:
      properties:
        avg_price:
          description: Volume-weighted average across fills.
          example: 0.6
          type: number
        created_at:
          description: ISO-8601.
          example: '2026-08-07T10:00:00Z'
          type: string
        custody:
          description: >-
            Always `self` — stamped from your session, never from a request
            field.
          enum:
            - self
          example: self
          type: string
        funds_spent:
          description: Collateral committed.
          example: 60
          type: number
        id:
          example: usdc
          type: number
        market_id:
          description: The market this position is in.
          example: '12'
          type: string
        market_title:
          example: Will BTC close above its open?
          type: string
        price:
          description: Fill price, a probability in (0,1).
          example: 0.6
          type: number
        quote_currency:
          example: usdc
          type: string
        settled_at:
          description: When the market resolved. Null while the contract is open.
          example: '2026-08-08T00:00:00Z'
          type:
            - string
            - 'null'
        settlement_status:
          description: >-
            The on-chain mint badge: `pending` until confirmed, `reversed` if
            the market voided.
          enum:
            - pending
            - confirmed
            - reversed
          example: confirmed
          type:
            - string
            - 'null'
        settlement_status_raw:
          description: The internal state-machine value behind the badge.
          example: matched
          type: string
        side:
          description: Your side of the contract.
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: string
        state:
          description: Lifecycle. A settled contract names the winning side.
          enum:
            - active
            - settled_yes
            - settled_no
            - voided
          example: active
          type: string
        taker_fee_amount:
          description: >-
            The taker fee charged at trade time. Nothing further is taken at
            settlement — a winning share pays the full 1.00.
          example: '0.17'
          type: string
        taker_fee_refunded:
          description: True when the market voided and the fee was returned.
          example: false
          type: boolean
        volume:
          description: Shares held.
          example: 100
          type: number
      required:
        - id
        - market_id
        - market_title
        - quote_currency
        - side
        - price
        - avg_price
        - volume
        - funds_spent
        - taker_fee_amount
        - taker_fee_refunded
        - custody
        - state
        - created_at
      type: object
    CreateOrderRequest:
      properties:
        market:
          description: Market id.
          example: '12'
          type: string
        ord_type:
          enum:
            - limit
            - market
          example: limit
          type: string
        post_only:
          description: >-
            Reject the order if it would take liquidity. A post-only order
            reserves no taker fee, because it can only ever rest as a maker.
          example: false
          type: boolean
        price:
          description: Limit price, `0.01`–`0.99`. Required for a limit order.
          example: '0.60'
          type: string
        side:
          description: The outcome you are buying.
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: string
        signed_order:
          $ref: '#/components/schemas/SignedOrderEntity'
          description: >-
            The EIP-712-signed order. Validated before anything is placed — a
            signature the server cannot verify is rejected, never rested.
        volume:
          description: Number of shares.
          example: '100'
          type: string
      required:
        - market
        - side
        - ord_type
        - volume
        - signed_order
      type: object
    CtfConfigEntity:
      properties:
        blockchain_key:
          example: polygon-mainnet
          type: string
        chain_id:
          example: 137
          type: number
        condition_id:
          description: The market's on-chain condition.
          example: 0x8f3a…
          type: string
        conditional_tokens_address:
          description: Gnosis' Conditional Tokens — where your collateral actually sits.
          example: '0x4D97DCd97eC945f40cF65F87097ACe5EA0476045'
          type: string
        domain_name:
          description: >-
            The EIP-712 domain name this exchange was DEPLOYED with. Hashed into
            every order signature, and different per network — sign with the
            served value, never a hard-coded one, or the signature will not
            recover.
          example: Calibri CTF Prediction Markets
          type: string
        exchange_address:
          description: This deployment's CTF Exchange.
          example: '0xB6Ac44d5A6388b8C7511F2fb20C0c03fD0CeDC83'
          type: string
        no_token_id:
          description: The same for the NO leg.
          example: 451…
          type: string
        owner_address:
          description: >-
            What owns the Safe: your wallet EOA, or for a passkey member the
            secp256r1 signer contract. Served so a client can spot that a
            different wallet is connected — only the owner can sign for the
            Safe.
          example: '0xE1188438C85C98aADFf1a88f97764E607B4978C3'
          type:
            - string
            - 'null'
        proxy_address:
          description: Your Safe — the deposit destination and the maker on your orders.
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type:
            - string
            - 'null'
        safe_setup:
          $ref: '#/components/schemas/SafeSetupEntity'
        safe_status:
          description: >-
            The single field that answers "can this member trade?".
            `setup_required` means an order would REST AND THEN FAIL TO SETTLE —
            worse than being rejected, so do not trade on it.
          enum:
            - ready
            - setup_required
            - error
            - unavailable
            - unlinked
          example: ready
          type: string
        session_keys_enabled:
          description: Whether this deployment has session trading keys switched on.
          example: true
          type: boolean
        signature_type:
          description: >-
            `2` = POLY_GNOSIS_SAFE (wallet-owned), `3` = POLY_1271
            (passkey-owned), `0` = EOA.
          enum:
            - 0
            - 2
            - 3
          example: 2
          type: number
        usdc_address:
          description: The collateral token.
          example: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359'
          type: string
        yes_token_id:
          description: >-
            The ERC-1155 position id for the YES leg. A token id IS the
            market-and-outcome identifier, which is why a signed order carries
            one and no market field.
          example: 713…
          type: string
      required:
        - exchange_address
        - conditional_tokens_address
        - usdc_address
        - chain_id
        - blockchain_key
        - domain_name
        - proxy_address
        - owner_address
        - signature_type
        - session_keys_enabled
        - safe_status
        - condition_id
        - yes_token_id
        - no_token_id
      type: object
