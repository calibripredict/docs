          description: Coinbase product id, e.g. "BTC-USD".
          example: BTC-USD
          type: string
        tie:
          description: >-
            True when close == open exactly, which at five-minute granularity on
            a

            quiet market is a real outcome rather than a rounding artefact.
            Published

            because the rule that breaks it (ties resolve up) is otherwise
            invisible

            on the one market where it decided the answer.
          example: false
          type: boolean
