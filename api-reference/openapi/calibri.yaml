            The signed SIWE message, exactly as returned by
            /sessions/web3/nonce.
          example: 'Sign in to Calibri: 8f21c4a9e0b7'
          type: string
        signature:
          description: The signature over `message`.
          example: 0x7b21…
          type: string
      required:
        - message
        - signature
      type: object
    WalletLinkedEntity:
      properties:
        wallet_address:
          description: >-
            The EOA now attached to the account. It is also written into the
            session, so the next request carries it as a JWT claim.
          example: '0xE1188438C85C98aADFf1a88f97764E607B4978C3'
          type: string
      required:
        - wallet_address
      type: object
  securitySchemes:
    apiKey:
      description: >-
        HMAC-signed API key. Send X-Auth-Apikey, X-Auth-Nonce and
        X-Auth-Signature.
      in: header
      name: X-Auth-Apikey
      type: apiKey
