        - safe
        - handler_installed
        - expires_at
        - calls
      type: object
    SessionKeyPrepareRequest:
      properties:
        expires_at:
          description: >-
            Requested expiry, Unix seconds. Clamped DOWN to policy — asking for
            longer returns the ceiling rather than an error.
          example: 1797600000
          type: number
        x:
          description: P-256 public key X coordinate of the browser-held key.
          example: 0x2f9a…
          type: string
        'y':
          description: P-256 public key Y coordinate.
          example: 0x8c41…
          type: string
      required:
        - x
        - 'y'
      type: object
    SessionKeyRevokeEntity:
      properties:
        all:
          description: True when revoking every outstanding grant rather than one.
          example: true
          type: boolean
        calls:
          items:
            $ref: '#/components/schemas/SafeSetupCallEntity'
          type: array
        safe:
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: string
      required:
        - safe
        - all
        - calls
      type: object
    SessionKeyRevokeRequest:
      properties:
        key_id:
          description: >-
            Revoke one grant. Omit to revoke EVERY outstanding grant — which is
            constant gas however many exist, because it is the emergency path.
          example: '7'
          type: string
      type: object
    SessionKeyStatusEntity:
      properties:
        default_ttl:
          description: The grant length this deployment actually hands out.
          example: 2592000
          type: number
        enabled:
          description: >-
            False when the deployment has no session contracts, the service is
            unreachable, or the member has no passkey wallet. Not an error — the
            caller falls back to prompting the passkey per order.
          example: true
          type: boolean
        handler_installed:
          description: Whether the Safe's session-aware fallback handler is installed.
          example: true
          type: boolean
        idle_lock_seconds:
          description: >-
            How long a device may hold an unlocked key without placing an order.
            Served rather than compiled into the client — a missing value must
            never be read as "no lock".
          example: 900
          type: number
        last_key_id:
          description: >-
            Highest grant id issued. Every order signature carries it, so read
            this after relaying an authorisation.
          example: '7'
          type: string
        max_ttl:
          description: The registry's immutable on-chain ceiling, in seconds.
          example: 15552000
          type: number
        safe:
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: string
      required:
        - enabled
      type: object
    SignedOrderEntity:
      properties:
        expiration:
          description: Unix seconds. Must be non-zero, unexpired, and within 365 days.
          example: '1797600000'
          type: string
        fee_rate_bps:
          description: >-
            Must be `"0"`. The taker fee is collected separately on-chain from
            your Safe, not through this field.
          example: '0'
          type: string
        maker:
          description: >-
            Your Safe — the address the collateral comes from. For signature
            type 3 this equals `signer`.
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: string
        maker_amount:
          description: USDC in, 6-decimal base units. `round(price × volume × 1e6)`.
          example: '60000000'
          type: string
        nonce:
          description: Exchange nonce.
          example: '0'
          type: string
        salt:
          description: >-
            Random per-order value. Two orders with identical terms must not
            share one.
          example: '5821094412'
          type: string
        side:
          description: >-
            Always `0` (BUY). Both YES and NO legs are buys that mint — the side
            you are taking is carried by `token_id` alone.
          enum:
            - 0
          example: 0
          type: number
        signature:
          description: >-
            The EIP-712 signature. For a session-signed order this is
            `abi.encode(keyId, r, s)` — exactly 96 bytes — which is how the
            server tells a session key from a passkey.
          example: 0x4f2a…
          type: string
        signature_type:
          description: >-
            `2` POLY_GNOSIS_SAFE (wallet-owned Safe), `3` POLY_1271
            (passkey-owned), `0` EOA. Take it from
            `safe_status`/`signature_type` on the wallet config rather than
            assuming.
          enum:
            - 0
            - 2
            - 3
          example: 2
          type: number
        signer:
          description: >-
            Whoever signed. Your wallet EOA for types 0 and 2; the Safe itself
            for type 3, where a passkey or session key produced the signature.
          example: '0xE1188438C85C98aADFf1a88f97764E607B4978C3'
          type: string
        taker:
          description: The zero address — the order is public and anyone may match it.
          example: '0x0000000000000000000000000000000000000000'
          type: string
        taker_amount:
          description: Outcome tokens out, 6-decimal. `round(volume × 1e6)`.
          example: '100000000'
          type: string
        token_id:
          description: >-
            The ERC-1155 position id for YOUR side. This is what says which
            market and which outcome — a signed order carries no market field.
          example: 7138104...
          type: string
      required:
        - salt
        - maker
        - signer
        - taker
        - token_id
        - maker_amount
        - taker_amount
        - expiration
        - nonce
        - fee_rate_bps
        - side
        - signature_type
        - signature
      type: object
