          example:
            day: '18500'
            month: '240000'
            week: '92000'
          type: object
        updated_at:
          description: ISO-8601.
          example: '2026-08-07T10:05:00Z'
          type: string
        verification_available:
          description: Whether a higher tier is reachable by verifying further.
          example: false
