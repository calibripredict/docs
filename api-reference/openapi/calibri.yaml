  /api/v2/atlas/account/balances:
    get:
      description: >-
        Your balances per currency. `balance_safe` (available) and `locked_safe`
        (reserved) are the mirror of the USDC in your own on-chain Safe — those
        are the figures that matter. `redeemable_safe` is winnings the contract
        owes you that you have not redeemed yet: not spendable until you do.
        `pending_safe` is proceeds of a sale from your Safe that the chain has
        not paid in yet: not spendable until the sale settles on-chain.
        `balance` / `locked` / `total` are the operator-held pool, which Calibri
        does not operate, so they are always "0".
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BalanceEntity'
                type: array
          description: ''
      summary: All balances
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/atlas/account/balances/{currency}:
    get:
      description: >-
        One currency's balance. Same shape as a list element — prefer
        `balance_safe` / `locked_safe` / `redeemable_safe` over the always-zero
        operator pool fields.
      parameters:
        - in: path
          name: currency
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceEntity'
          description: ''
      summary: Balance by currency
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/atlas/account/bridge/config:
    get:
      description: >-
        The chains you can deposit USDC from besides Polygon, each with its
        minimum, typical time to credit and current fee estimate, plus your
        deposit address (the same on every chain). USDC sent to that address on
        a listed chain is bridged to Polygon and credited automatically. Only
        USDC, and only on the listed chains.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeConfigEntity'
          description: ''
      summary: Cross-chain deposit config
      tags:
        - Other
      security:
        - apiKey: []
  /api/v2/atlas/account/bridge/transfers:
    get:
      description: >-
        Your cross-chain USDC bridges, newest first — one row per bridge:
        deposits (`direction: in`, from arrival on the source chain to credit on
        Polygon) and withdrawals (`direction: out`, from the burn on Polygon to
        the mint on the destination chain). `direction` filters to one of them.
        Pagination in the `Page`, `Per-Page` and `Total` headers. The list is
        not pushed live: refetch it, e.g. when the regular deposit notification
        for the credited mint arrives.
      parameters:
        - description: Rows per page. Defaults to 25, capped at 100.
          example: 25
          in: query
          name: limit
          required: false
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: integer
        - description: Page number, from 1.
          example: 1
          in: query
          name: page
          required: false
          schema:
            default: 1
            minimum: 1
            type: integer
        - description: '`in` (deposits) or `out` (withdrawals). Both when omitted.'
          example: out
          in: query
          name: direction
          required: false
          schema:
            enum:
              - in
              - out
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BridgeTransferEntity'
                type: array
          description: ''
      summary: Cross-chain deposits and withdrawals
      tags:
        - Other
      security:
        - apiKey: []
  /api/v2/atlas/account/bridge/transfers/{id}/consent:
    post:
      description: >-
        When gas is high, a cross-chain deposit waits in `awaiting_consent` with
        a `quote`: bridging now costs `quote.target_fee`, more than the standard
        fee. Send that exact amount as `max_fee` to accept it; the deposit is
        then bridged and you receive the amount minus that fee. If the fee has
        changed since you saw it, the answer is 409 with the current `quote`
        (and `code`: `quote_changed`, `stale_quote` or `not_awaiting_consent`) —
        show it and ask again. Not accepting is fine: the bridge re-checks gas
        every 10 minutes and bridges on its own once the standard fee covers the
        cost. Rate limited to 10 per minute.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeConsentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeConsentEntity'
          description: ''
      summary: Accept a cross-chain deposit fee
      tags:
        - Other
      security:
        - apiKey: []
  /api/v2/atlas/account/bridge/withdraw/quote:
    get:
      description: >-
        Prices a withdrawal of `amount` USDC from your wallet on Polygon to
        `destination` on another network (`chain_key`, a chain from the bridge
        config), and returns the wallet transaction to sign for it (`safe_tx`:
        one batch that pays the fee, approves and burns the rest over Circle
        CCTP). Sign `safe_tx` and relay it through `POST /account/wallet/relay`
        with this `quote_id` before `expires_at` (5 minutes); a quote can be
        used once. `fee` is ours, `max_cctp_fee` the most Circle may keep,
        `receive` the minimum you receive. `destination` must be a checksummed
        address other than your wallet; a wallet (not passkey) account can
        withdraw only to its linked wallet. Refusals are 422 with `code`:
        `below_minimum`, `withdrawals_disabled`, `chain_inactive`,
        `receive_not_positive`, `no_safe`, `no_wallet`, `destination_is_safe`,
        `destination_not_linked_wallet`. Rate limited to 10 per minute.
      parameters:
        - description: Recipient on the destination chain, checksummed.
          example: '0x5aAeb6053F3E94C9b9A09f33669435E7Ef1BeAed'
          in: query
          name: destination
          required: true
          schema:
            type: string
        - description: USDC to withdraw (fee included).
          example: '50'
          in: query
          name: amount
          required: true
          schema:
            type: string
        - description: Destination chain key.
          example: ethereum
          in: query
          name: chain_key
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeWithdrawQuoteEntity'
          description: ''
      summary: Quote a cross-chain withdrawal
      tags:
        - Other
      security:
        - apiKey: []
  /api/v2/atlas/account/contracts:
    get:
      description: >-
        Your matched positions. A winning contract settles to the full 1.00 per
        share — the fee was taken at trade time — but winnings are NOT
        auto-paid: you redeem them yourself.
      parameters:
        - description: Contracts per page. Defaults to 50.
          example: 25
          in: query
          name: limit
          required: false
          schema:
            default: 50
            minimum: 1
            type: integer
        - description: Page number, from 1. Newest contract first.
          example: 1
          in: query
          name: page
          required: false
          schema:
            default: 1
            minimum: 1
            type: integer
        - description: >-
            Only contracts created before this time — Unix SECONDS, EXCLUSIVE,
            so the `time_to` of one window can be the `time_from` of the next
            without a fill appearing in both.
          example: 1760918400
          in: query
          name: time_to
          required: false
          schema:
            minimum: 0
            type: integer
        - description: >-
            Only contracts created at or after this time — Unix SECONDS (not
            milliseconds), inclusive.
          example: 1760832000
          in: query
          name: time_from
          required: false
          schema:
            minimum: 0
            type: integer
        - description: >-
            Contracts either leg of which came from this order — useful for
            following one fill. Matches the yes side or the no side.
          example: 90210
          in: query
          name: order_id
          required: false
          schema:
            type: number
        - description: Filter to one market, by the engine's market id.
          example: '5871'
          in: query
          name: market_id
          required: false
          schema:
            type: string
        - description: >-
            Filter by verdict — the same vocabulary the `state` field returns:
            `active`, `settled_yes`, `settled_no`, `voided`. Two conveniences on
            top: `settled` is shorthand for both settled values, and a
            comma-separated list is an OR (`settled_yes,voided`). `pending` is
            accepted as an alias of `active`. Not an enum in this schema
            precisely because a list is a legal value.
          example: settled_yes,voided
          in: query
          name: state
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ContractEntity'
                type: array
          description: ''
      summary: Your contracts
      tags:
        - Positions
      security:
        - apiKey: []
  /api/v2/atlas/account/contracts/{id}:
    get:
      description: >-
        One matched position, only if you are a party to it. Same object as a
        list element — useful when following a fill or settlement deep-link.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractEntity'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      summary: Contract by id
      tags:
        - Positions
      security:
        - apiKey: []
  /api/v2/atlas/account/limits:
    get:
      description: >-
        Funding-method and global limits for your account. Use before submitting
        a deposit or withdrawal so you fail client-side instead of on the wire.
        Pass `with_remaining` to include how much of each limit is left; filter
        with `currency` and `reference_type`.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsEntity'
          description: ''
      summary: Account limits
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/atlas/account/orders:
    post:
      description: >-
        Places a non-custodial order. `signed_order` is an EIP-712 signature
        over the CTF Exchange Order struct. Atlas validates it — a signature it
        cannot verify is rejected rather than placed — then relays to the engine
        and attaches the signature. Placing locks the stake PLUS the maximum
        taker fee the fill could incur; the unused reserve is released. PASSKEY
        WALLETS: a passkey signs only in the browser it was registered in, and
        browser-held session keys are non-extractable, so neither can sign from
        a script. To place orders programmatically, add a SECOND SIGNING KEY to
        your wallet (Settings → Wallet → Signing keys) — an address you hold the
        key for, which becomes an owner of the same Safe. Orders stay
        `signature_type` 3 with maker == signer == the Safe; the signature
        becomes a standard Safe owner signature over the EIP-712
        `SafeMessage(bytes message)` whose message is `abi.encode(orderHash)`,
        in a domain of (chainId, the Safe). Signing the order hash directly
        always fails. MARKET ORDERS AND EXPIRY: a market-style order is a limit
        at a price ceiling; send `ioc: true` and the unfilled remainder is
        refunded rather than rested. The signature's `expiration` is enforced by
        the engine — it never matches an order within 30 seconds of its expiry
        (a fill must settle on-chain before the signature lapses), cancels and
        refunds a resting order at that point, and rejects an order that arrives
        inside that window (`market.order.expired`).
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEntity'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: Signature or validation failure
      summary: Place a signed order
      tags:
        - Trade
      security:
        - apiKey: []
  /api/v2/atlas/account/orders/batch:
    post:
      description: >-
        Places 1–20 signed orders in one request. Each element of `orders` is
        exactly the body of `POST /account/orders` and is validated and placed
        independently, in request order — a failure does not undo the orders
        before it, and does not stop the ones after it. The response is an array
        in request order: `{ "order": … }` (the object `POST /account/orders`
        returns) or `{ "error": { "status", "errors" } }` (the status and error
        codes that call would have answered). The request counts as one order
        per element against the order-placement rate limit; a batch that does
        not fit in what is left of the limit is refused whole (429).
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateOrdersRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BatchOrderResultEntity'
                type: array
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: '`orders` is not an array of 1–20 orders'
      summary: Place several signed orders
      tags:
        - Trade
      security:
        - apiKey: []
  /api/v2/atlas/account/orders/{id}/replace:
    post:
      description: >-
        Cancels an open order and places a new signed order in its place,
        atomically. The body is exactly the body of `POST /account/orders`, with
        a fresh `signed_order`, and must be for the same market (422
        `order.replace_market_mismatch`). The new order is validated in full
        before the old one is touched, so a rejected replacement leaves the old
        order resting. An old order that is no longer open (filled or cancelled)
        answers 409 `order.not_open` and nothing is placed. On success the
        response is the new order, as `POST /account/orders` returns it, plus
        `replaced_order_id`. If the old order was cancelled but the new one was
        then rejected, the error body also carries `replaced_order_id`: the old
        order is gone and nothing replaced it. Counts as one order against the
        order-placement rate limit.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplacedOrderEntity'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: The old order is not open
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: Signature or validation failure
      summary: Replace a signed order
      tags:
        - Trade
      security:
        - apiKey: []
  /api/v2/atlas/account/positions:
    get:
      description: >-
        Your net holdings per market and outcome, with the quantity you can sell
        right now (total less anything already reserved by a resting sell order,
        and less `pending_volume`: tokens from a buy that has not settled
        on-chain yet, sellable once it is confirmed). Use this to offer a
        position for sale; use /account/contracts for the trade history behind
        it.
      parameters:
        - description: Positions per page. Defaults to 100, capped at 200.
          example: 100
          in: query
          name: limit
          required: false
          schema:
            default: 100
            maximum: 200
            minimum: 1
            type: integer
        - description: Page number, from 1.
          example: 1
          in: query
          name: page
          required: false
          schema:
            default: 1
            minimum: 1
            type: integer
        - description: >-
            Default true: only holdings with a quantity above zero. Pass `false`
            to include settled and fully-exited holdings, which are kept as zero
            rows for the audit trail.
          example: true
          in: query
          name: open_only
          required: false
          schema:
            default: true
            type: boolean
        - description: Filter to one outcome.
          example: 'yes'
          in: query
          name: side
          required: false
          schema:
            enum:
              - 'yes'
              - 'no'
            type: string
        - description: >-
            Filter to several markets at once — comma-separated engine market
            ids, at most 50. Lets an event page read its holdings across all of
            its markets in one call. Combines with the other filters; a
            non-numeric id or a longer list is a 400.
          example: 5871,5872,5873
          in: query
          name: market_ids
          required: false
          schema:
            type: string
        - description: Filter to one market, by the engine's market id.
          example: '5871'
          in: query
          name: market_id
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PositionEntity'
                type: array
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: '`market_ids` holds a non-numeric id or more than the cap'
      summary: Your positions
      tags:
        - Positions
      security:
        - apiKey: []
  /api/v2/atlas/account/preferences:
    get:
      description: >-
        Your display preferences. Today: `leaderboard_opt_out` — whether your
        username appears on the public PnL leaderboard.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesEntity'
          description: ''
      summary: Read preferences
      tags:
        - Account
      security:
        - apiKey: []
    put:
      description: >-
        Partial update — send only the fields to change. Unknown keys are
        ignored. Returns the full preferences object after apply.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesEntity'
          description: ''
      summary: Update preferences
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/atlas/account/referrals/earnings:
    get:
      description: >-
        Commission from members you referred, funded from the taker fee they pay
        on fills. Lifetime totals by currency, split into what is still waiting
        for the daily payout (`pending_by_currency`) and what has already been
        paid to your wallet (`paid_by_currency`); the same per referred member;
        the payout history, one entry per payout sweep; when the next payout is
        due; and how often the sweep runs.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralEarningsEntity'
          description: ''
      summary: Referral earnings
      tags:
        - Rewards
      security:
        - apiKey: []
  /api/v2/atlas/account/rewards/liquidity:
    get:
      description: >-
        Liquidity rewards earned for resting orders, one row per market per UTC
        day, newest first. Scored daily at 01:00 UTC for the previous day and
        paid by the daily sweep — `status` moves pending → paying → paid. Filter
        with `status`; paginate with `page` and `limit` (totals in the `Page` /
        `Per-Page` / `Total` headers).
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LiquidityRewardEntity'
                type: array
          description: ''
      summary: Your liquidity rewards
      tags:
        - Rewards
      security:
        - apiKey: []
  /api/v2/atlas/account/rewards/pending:
    get:
      description: >-
        Maker rebates and referral rewards accrued but not yet swept. Rewards
        accrue the moment a trade fills and are paid on a daily sweep, so this
        ticks up between payouts. Reaching 0 after a sweep is expected, not an
        error.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRewardsEntity'
          description: ''
      summary: Pending rewards
      tags:
        - Rewards
      security:
        - apiKey: []
  /api/v2/atlas/account/settled:
    get:
      description: >-
        Every market you held when it resolved — the position you held, what it
        cost you (collateral plus fees), and what it paid. A market you lost
        appears here with a payout of 0, which is why this is not the same as
        filtering your transactions: a losing position moves no money at
        settlement and so has no transaction. One row per market, newest first.
      parameters:
        - description: Markets per page. Defaults to 25, capped at 100.
          example: 25
          in: query
          name: limit
          required: false
          schema:
            default: 25
            maximum: 100
            minimum: 1
            type: integer
        - description: Page number, from 1. Most recently settled market first.
          example: 1
          in: query
          name: page
          required: false
          schema:
            default: 1
            minimum: 1
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SettledMarketEntity'
                type: array
          description: ''
      summary: Settled markets
      tags:
        - Positions
      security:
        - apiKey: []
  /api/v2/atlas/account/stats/pnl:
    get:
      description: >-
        Realized PnL from settled contracts, per-market breakdown, and capital
        in/out. Open positions are not valued here — mark them client-side
        against the live price feed. `pnl_currency` narrows the response to a
        single collateral currency.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnlEntity'
          description: ''
      summary: Prediction PnL
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/atlas/account/stats/pnl/history:
    get:
      description: >-
        Cumulative realized PnL over time, plus cumulative net deposits.
        Defaults to the last 30 days in daily buckets. Open positions are not
        valued — a member holding only open positions sees a flat line until
        their markets settle.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PnlPointEntity'
                type: array
          description: ''
      summary: Prediction PnL history
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/atlas/account/transactions:
    get:
      description: >-
        Your ledger across deposits, withdrawals, trades, internal transfers,
        referral earnings and maker rewards. Filter with `currency`, `type`, and
        time bounds; paginate with `page` and `limit` — totals land in the
        `Page` / `Per-Page` / `Total` response headers.
      parameters:
        - description: Entries per page, 1–1000. Defaults to 50.
          example: 50
          in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 1000
            minimum: 1
            type: integer
        - description: Page number, from 1. Read `Total` off the response headers.
          example: 1
          in: query
          name: page
          required: false
          schema:
            default: 1
            minimum: 1
            type: integer
        - description: Sort direction on the entry timestamp. Defaults to `desc`.
          example: desc
          in: query
          name: order_by
          required: false
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - description: Upper bound, Unix SECONDS.
          example: 1725148800
          in: query
          name: time_to
          required: false
          schema:
            type: number
        - description: >-
            Lower bound, Unix SECONDS — not milliseconds, and not ISO-8601. A
            millisecond value lands far in the future and returns nothing rather
            than erroring.
          example: 1722470400
          in: query
          name: time_from
          required: false
          schema:
            type: number
        - description: Find the entry for one on-chain transaction.
          example: 0x9f2c…
          in: query
          name: txid
          required: false
          schema:
            type: string
        - description: Filter by what produced the entry.
          example: trade
          in: query
          name: type
          required: false
          schema:
            enum:
              - deposit
              - withdraw
              - internal_transfer
              - trade
              - referral
              - referral_reward
              - maker_reward
              - lp_reward
            type: string
        - description: >-
            Filter to one asset. Matches either side of the entry, credit or
            debit.
          example: usdc
          in: query
          name: currency
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TransactionEntity'
                type: array
          description: ''
      summary: Transaction history
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/atlas/account/wallet:
    get:
      description: >-
        The same funding config without the market fields — your Safe (the
        deposit destination), its owner, and any outstanding setup. For a wallet
        page that is not tied to a market.
      parameters:
        - description: >-
            Comma-separated sub-resources to carry inline, each under a key of
            the same name holding exactly what its own route returns: `owners`
            (GET /account/wallet/owners), `session_key` (GET
            /account/wallet/session-key), `auto_redeem` (GET
            /account/wallet/auto-redeem), `redeemable` (GET
            /account/wallet/redeemable). They are resolved in parallel from one
            wallet lookup, so one round-trip replaces five. Unknown names are
            ignored. Every requested key is always present: an include that is
            not applicable to the account (e.g. `owners` without a passkey
            wallet, a 400 on its own route) is `null` here rather than a failed
            request.
          example: owners,session_key,auto_redeem,redeemable
          in: query
          name: include
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfWalletBundleEntity'
          description: ''
      summary: CTF wallet
      tags:
        - Wallet
      security:
        - apiKey: []
  /api/v2/atlas/account/wallet/auto-redeem:
    get:
      description: >-
        Whether resolved winnings are redeemed into your Safe automatically, and
        the contract to approve (or revoke) to change it.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfAutoRedeemEntity'
          description: ''
      summary: Auto-redeem status
      tags:
        - Wallet
      security:
        - apiKey: []
    put:
      description: >-
        Call after relaying `setApprovalForAll(auto_redeemer_address, enabled)`
        from your Safe. Returns 409 if the chain does not show that approval
        yet.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRedeemRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfAutoRedeemEntity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: '`enabled` is not a boolean'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: >-
            Auto-redeem is unavailable for this account, the Safe is not
            registered yet, or the chain does not show the approval (or its
            revocation) yet
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: On-chain state could not be read
      summary: Set auto-redeem
      tags:
        - Wallet
      security:
        - apiKey: []
  /api/v2/atlas/account/wallet/markets/{id}:
    get:
      description: >-
        Everything needed to build and sign an order for one market. Check
        `safe_status` first: on `setup_required` an order will rest and then
        fail to settle.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfConfigEntity'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: Market is not CTF-registered
      summary: CTF config for a market
      tags:
        - Wallet
      security:
        - apiKey: []
  /api/v2/atlas/account/wallet/owners:
    get:
      description: >-
        Returns the Safe and its current owners. A passkey wallet has exactly
        one owner (the signer contract derived from your passkey) until you add
        a signing wallet of your own.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeOwnersEntity'
          description: ''
      summary: List the keys that can sign for your wallet
      tags:
        - Wallet
      security:
        - apiKey: []
    post:
      description: >-
        Returns the Safe call authorising another address to sign for your
        wallet (or removing one, with `remove: true`). Sign it with your passkey
        and relay it — nothing changes until you do. An added key is a full
        owner: it can place orders, withdraw, redeem, and remove your passkey.
        Adding a key you already added returns no calls.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafeOwnerRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafeOwnerPrepareEntity'
          description: ''
      summary: Add or remove a signing key on your wallet
      tags:
        - Wallet
      security:
        - apiKey: []
  /api/v2/atlas/account/wallet/passkey:
    post:
      description: >-
        Registers the PUBLIC half of a WebAuthn credential and derives the
        signer contract and Safe address from it. The private half never leaves
        your authenticator, so Calibri holds no key and cannot recover the
        account — enrol on a platform whose passkeys sync, or the wallet dies
        with the device.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyEnrolRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfWalletEntity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      summary: Enrol a passkey wallet
      tags:
        - Wallet
      security:
        - apiKey: []
  /api/v2/atlas/account/wallet/redeemable:
    get:
      description: >-
        Settled markets whose self-custody payout you have not yet redeemed,
        with the wallet config to sign the redeem.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtfRedeemableEntity'
          description: ''
      summary: Redeemable winnings
      tags:
        - Wallet
      security:
        - apiKey: []
  /api/v2/atlas/account/wallet/relay:
    post:
      description: >-
        Gasless relay for any Safe transaction you have signed — setup
        approvals, redeeming winnings, or moving USDC out. The operator executes
        and pays the gas; it cannot act without your signature. The Safe must be
        your own.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayResultEntity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      summary: Relay a Safe transaction
      tags:
        - Wallet
      security:
        - apiKey: []
  /api/v2/atlas/account/wallet/session-key:
    delete:
      description: >-
        Returns the Safe call to revoke one grant, or every outstanding grant
        when `key_id` is omitted. Revocation takes effect the moment it is
        relayed and does kill resting orders that key signed.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionKeyRevokeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKeyRevokeEntity'
          description: ''
      summary: Revoke a session key
      tags:
        - Wallet
      security:
        - apiKey: []
    get:
      description: >-
        Whether session keys are usable, the highest grant id issued, and the
        policy TTLs. Returns `enabled: false` rather than an error where the
        deployment has no session contracts — the caller then falls back to
        prompting the passkey per order.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKeyStatusEntity'
          description: ''
      summary: Session key status
      tags:
        - Wallet
      security:
        - apiKey: []
    post:
      description: >-
        Returns the Safe calls that authorise a browser-held P-256 key to sign
        orders. Nothing is authorised until you sign and relay them.
        `expires_at` is clamped DOWN to policy. The key is never a Safe owner,
        so withdraw and redeem stay passkey-only.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionKeyPrepareRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionKeyPrepareEntity'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEntity'
          description: ''
      summary: Authorise a session key
      tags:
        - Wallet
      security:
        - apiKey: []
  /api/v2/atlas/public/currencies:
    get:
      description: >-
        Visible currencies in the registry. Collateral is USDC (6-decimal) on
        the chain named by `blockchain_key`. Fields describing
        operator-custodied funding — deposit and withdrawal fees, minimums,
        enabled flags — are retained for schema stability and do not apply:
        funding happens on your own Safe.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CurrencyEntity'
                type: array
          description: ''
      security: []
      summary: List currencies
      tags:
        - Currencies
  /api/v2/atlas/public/currencies/{id}:
    get:
      description: >-
        One currency from the registry, by code (e.g. `usdc`). Same object as a
        list element; only visible currencies resolve.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyEntity'
          description: ''
      security: []
      summary: Currency by id
      tags:
        - Currencies
  /api/v2/atlas/public/health/alive:
    get:
      description: >-
        Liveness probe for the Atlas process. Returns plain-text `200` when the
        process is up — not a dependency check, and not a trading-engine
        readiness signal.
      parameters: []
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: string
          description: Alive. The body is the literal string `200`, as `text/plain`.
      security: []
      summary: Health check
      tags:
        - Health
  /api/v2/atlas/public/rates:
    get:
      description: >-
        USD-based reference rates, refreshed from a price provider on our own
        clock. DISPLAY ONLY: every market is priced, collateralised and settled
        in USDC, and an order signature commits to a USDC amount — these decide
        what number is shown beside it and nothing else. Served from memory, so
        poll no faster than `ttl_seconds`.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatesEntity'
          description: ''
      security: []
      summary: Reference exchange rates
      tags:
        - Currencies
  /api/v2/atlas/public/timestamp:
    get:
      description: >-
        The server's clock as Unix seconds. Use it to measure your clock's skew
        before computing a signed order's `expiration`.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimestampEntity'
          description: ''
      security: []
      summary: Server time
      tags:
        - Other
  /api/v2/persona/identity/users:
    post:
      description: >-
        Signs up with email and password. The account starts at level 0 in
        `pending` and receives a confirmation email — confirm before signing in
        to trade. Optional referral code is accepted at signup.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
          description: ''
      security: []
      summary: Create an account
      tags:
        - Account
  /api/v2/persona/identity/users/email/confirm_code:
    post:
      description: >-
        Consumes the emailed confirmation token, stamps the email as verified,
        and moves the account to `active` so trading and verification steps can
        proceed.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUserEntity'
          description: ''
      security: []
      summary: Confirm an email address
      tags:
        - Account
  /api/v2/persona/identity/users/email/generate_code:
    post:
      description: >-
        Issues a fresh confirmation link for an account that has not confirmed
        yet. Fails if the email is already verified.
      parameters: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEntity'
          description: ''
      summary: Resend the confirmation email
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/persona/identity/users/me:
    get:
      description: >-
        The signed-in member. Narrower than `/resource/users/me`, which
        additionally returns the verification checklist.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
          description: ''
      summary: Current account
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/persona/identity/users/password/confirm_code:
    post:
      description: >-
        Consumes the emailed one-time token and sets the new password. Tokens
        are single-use and expire; a reused or stale token returns a validation
        error.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEntity'
          description: ''
      security: []
      summary: Confirm a password reset
      tags:
        - Account
  /api/v2/persona/identity/users/password/generate_code:
    post:
      description: >-
        Emails a reset link. Answers 2xx whether or not the address is
        registered — a distinguishable response would enumerate accounts.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEntity'
          description: ''
      security: []
      summary: Request a password reset
      tags:
        - Account
  /api/v2/persona/resource/users/me:
    get:
      description: >-
        The signed-in member plus `kyc`, the eleven-step verification checklist,
        and the public labels it is computed from. This is the payload a client
        gates onboarding on.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEntity'
          description: ''
      summary: Current account with verification status
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/persona/resource/users/password:
    put:
      description: >-
        Requires the current password. Only meaningful when
        `can_change_password` is true — wallet-native and social accounts carry
        a random password the holder never set.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEntity'
          description: ''
      summary: Change password
      tags:
        - Account
      security:
        - apiKey: []
  /api/v2/persona/resource/users/wallet:
    post:
      description: >-
        Attaches a verified EOA to the SIGNED-IN account, so an email or social
        member can trade non-custodially. Distinct from wallet login, which
        finds or creates an account for the wallet. Returns 409 if either the
        account or the wallet is already linked.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletLinkRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletLinkedEntity'
          description: ''
      summary: Link a wallet to this account
      tags:
        - Account
      security:
        - apiKey: []
components:
  schemas:
    KLineRow:
      description: >-
        One candle: [timestamp, open, high, low, close, volume] — the bucket
        start

        in Unix seconds, the YES-space open / high / low / close prices, and the

        contracts traded in the bucket. Numbers, not strings: chart series are
        the

        one place decimals are numbers.
      example:
        - 1787083200
        - 0.6
        - 0.7
        - 0.58
        - 0.65
        - 240
      maxItems: 6
      minItems: 6
      prefixItems:
        - description: Bucket start, Unix seconds
          type: integer
        - description: Open, YES-space price
          type: number
        - description: High, YES-space price
          type: number
        - description: Low, YES-space price
          type: number
