        quote_id:
          description: >-
            Cross-chain withdrawal: the `quote_id` of `GET
            /account/bridge/withdraw/quote`; `to` / `value` / `data` /
            `operation` must be its `safe_tx` exactly. Required for any
            transaction that burns USDC over CCTP (else 422
            `bridge_quote_required`). A quote is used once: 422 `quote_used`,
            `quote_expired`, `quote_not_found`, 409 `quote_mismatch` — request a
            new quote.
          example: 6c1f0a52-4b1e-4f0e-9d7a-2a1b3c4d5e6f
          type: string
        safe:
          description: Your own Safe. The server rejects a Safe registered to anyone else.
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: string
        signature:
          description: Your SafeTx signature. Without it the operator can do nothing.
          example: 0x7b21…
          type: string
        to:
          description: >-
            Target contract — the exchange for approvals, ConditionalTokens for
            a redeem, USDC for a transfer out.
          example: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359'
          type: string
        value:
          description: Wei value. Defaults to `"0"`.
          example: '0'
          type: string
      required:
        - safe
        - to
        - data
        - signature
      type: object
    RelayResultEntity:
      properties:
        tx:
          description: >-
            The submitted transaction hash, or null if nothing needed
            submitting.
          example: 0x7d1e…
          type:
            - string
            - 'null'
      required:
        - tx
      type: object
    ReplacedOrderEntity:
      properties:
        avg_price:
          description: >-
            Average price of the filled part, in the order's own outcome price
            space. Null while nothing has filled.
          example: '0.61'
          type:
            - string
            - 'null'
        client_order_id:
          description: The `client_order_id` you sent; null when none was.
          example: bot-7f3a-0001
          type:
            - string
            - 'null'
        contracts_count:
          description: Contracts formed from this order.
          example: 1
          type: number
        created_at:
          description: RFC 3339, UTC.
          example: '2026-08-07T10:00:00Z'
          type: string
        direction:
          enum:
            - buy
            - sell
          example: buy
          type: string
        event_slug:
          description: The parent event's slug, for linking. Null when unknown.
          example: btc-above-70k-december-2026
          type:
            - string
            - 'null'
        expires_at:
          description: >-
            When the order's signature lapses (RFC 3339, UTC); null when it has
            none. The engine never matches an order within 30 seconds of it.
          example: '2026-08-07T11:00:00Z'
          type:
            - string
            - 'null'
        fee:
          description: >-
            Taker fee charged to this order so far, in `quote_currency`. `"0"`
            for a maker.
          example: '0.17'
          type: string
        filled_cost:
          description: >-
            Cash for the filled part at the fill prices: paid on a buy, received
            before fees on a sell. Excludes `fee`. `"0"` while nothing has
            filled.
          example: '36.6'
          type:
            - string
            - 'null'
        filled_volume:
          example: '60'
          type: string
        id:
          example: 90311
          type: number
        ioc:
          description: >-
            Immediate-or-cancel: the unfilled remainder is refunded, never
            rested.
          example: false
          type: boolean
        locked:
          description: >-
            Collateral still locked. A separate taker-fee reserve is held
            alongside it and released when unused. Zero on a sell, which locks
            inventory instead.
          example: '24.68'
          type: string
        market_id:
          description: The market.
          example: 12
          type: number
        market_title:
          description: >-
            The market's title. Null when the engine does not know the market's
            metadata.
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type:
            - string
            - 'null'
        ord_type:
          enum:
            - limit
            - market
          example: limit
          type: string
        origin_locked:
          description: Collateral locked when the order was placed.
          example: '61.68'
          type: string
        origin_volume:
          example: '100'
          type: string
        post_only:
          description: Rejected rather than allowed to take liquidity.
          example: false
          type: boolean
        price:
          description: Limit price, `0.01`–`0.99`.
          example: '0.6'
          type: string
        quote_currency:
          example: usdc
          type: string
        remaining_volume:
          description: Unmatched remainder.
          example: '40'
          type: string
        replaced_order_id:
          description: The order that was cancelled to make way for this one.
          example: 90310
          type: number
        side:
          description: The outcome traded.
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: string
        state:
          enum:
            - wait
            - done
            - cancel
            - reject
          example: wait
          type: string
        token_id:
          description: >-
            The on-chain ERC-1155 token for `side`, as a decimal string (a
            uint256 — do not parse as a number). Null when the market has no
            on-chain token.
          example: '52114319501245915516055106046884209969926127482827954674443846427813813222426'
          type:
            - string
            - 'null'
        updated_at:
          description: RFC 3339, UTC.
          example: '2026-08-07T10:05:00Z'
          type: string
        volume:
          description: Unmatched remainder (same as `remaining_volume`).
          example: '40'
          type: string
      required:
        - id
        - market_id
        - market_title
        - event_slug
        - side
        - direction
        - token_id
        - client_order_id
        - ord_type
        - price
        - state
        - volume
        - origin_volume
        - remaining_volume
        - filled_volume
        - avg_price
        - filled_cost
        - fee
        - locked
        - origin_locked
        - quote_currency
        - contracts_count
        - ioc
        - post_only
        - expires_at
        - created_at
        - updated_at
        - replaced_order_id
      type: object
    SafeOwnerPrepareEntity:
      properties:
        calls:
          description: >-
            The Safe call(s) to sign with your passkey and relay. EMPTY when the
            request is already satisfied — adding an address that already signs
            for the wallet changes nothing.
          items:
            $ref: '#/components/schemas/SafeSetupCallEntity'
          type: array
        owners:
          description: The owner set as it stands, before this change.
          items:
            type: string
          type: array
        safe:
          description: Your wallet (Safe) address.
          example: 0x2b01…E22a
          type: string
      required:
        - safe
        - owners
        - calls
      type: object
    SafeOwnerRequest:
      properties:
        otp:
          description: >-
            Your six-digit two-factor code. REQUIRED when adding a key — a key
            that can withdraw and replace your passkey is not something a
            hijacked session should be able to grant. Not needed to remove one.
          example: '123456'
          type: string
        owner:
          description: The address to authorise (or, with `remove`, to revoke).
          example: '0x1631794cb5841002a7feaf0cc064a228c0db8e94'
          type: string
        remove:
          description: >-
            Set to remove this key instead of adding it. Your own passkey cannot
            be removed this way.
          example: false
          type: boolean
      required:
        - owner
      type: object
    SafeOwnersEntity:
      properties:
        owners:
          description: >-
            Every address that can sign for this wallet. Empty until the Safe is
            deployed, which happens on your first deposit.
          example:
            - 0x7790…e855
          items:
            type: string
          type: array
        passkey_active:
          description: >-
            False if your passkey is NO LONGER an owner of this wallet — which
            can only happen if a key you added removed it on-chain. Treat it as
            urgent: that key is then the only thing that can sign. True when the
            wallet is not deployed yet, and true if the check could not be made.
          example: true
          type: boolean
        passkey_signer:
          description: >-
            Which of the owners is your passkey — the signer contract derived
            from your credential. Everything else in `owners` is a key you
            added.
          example: 0x7790…e855
          type:
            - string
            - 'null'
        safe:
          description: Your wallet (Safe) address.
          example: 0x2b01…E22a
          type: string
      required:
        - safe
        - owners
        - passkey_signer
        - passkey_active
      type: object
    SafeSetupCallEntity:
      properties:
        data:
          description: ABI-encoded calldata.
          example: 0x095ea7b3…
          type: string
        hash:
          description: The SafeTx hash to sign.
          example: 0x9ab1…
          type: string
        nonce:
          description: The Safe's nonce for this call. Relay in order.
          example: 4
          type: number
        operation:
          description: '`0` = CALL, `1` = DELEGATECALL (a MultiSend batch).'
          example: 0
          type: number
        to:
          description: Target contract.
          example: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359'
          type: string
      required:
        - to
        - data
        - operation
        - nonce
        - hash
      type: object
    SafeSetupEntity:
      properties:
        calls:
          description: Calls to sign and relay. Empty when ready.
          items:
            $ref: '#/components/schemas/SafeSetupCallEntity'
          type: array
        ready:
          description: True when no approvals are outstanding.
          example: true
          type: boolean
      required:
        - ready
        - calls
      type: object
    SessionKeyPrepareEntity:
      properties:
        calls:
          description: Sign and relay these to authorise the key.
          items:
            $ref: '#/components/schemas/SafeSetupCallEntity'
          type: array
        expires_at:
          description: The granted expiry, clamped DOWN to product policy.
          example: 1797600000
          type: number
        handler_installed:
          example: true
          type: boolean
        safe:
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: string
      required:
        - safe
        - handler_installed
        - expires_at
        - calls
      type: object
    SessionKeyPrepareRequest:
      properties:
        expires_at:
          description: >-
            Requested expiry, Unix seconds. Clamped DOWN to policy — asking for
            longer returns the ceiling rather than an error.
          example: 1797600000
          type: number
        x:
          description: P-256 public key X coordinate of the browser-held key.
          example: 0x2f9a…
          type: string
        'y':
          description: P-256 public key Y coordinate.
          example: 0x8c41…
          type: string
      required:
        - x
        - 'y'
      type: object
    SessionKeyRevokeEntity:
      properties:
        all:
          description: True when revoking every outstanding grant rather than one.
          example: true
          type: boolean
        calls:
          items:
            $ref: '#/components/schemas/SafeSetupCallEntity'
          type: array
        safe:
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: string
      required:
        - safe
        - all
        - calls
      type: object
    SessionKeyRevokeRequest:
      properties:
        key_id:
          description: >-
            Revoke one grant. Omit to revoke EVERY outstanding grant — which is
            constant gas however many exist, because it is the emergency path.
          example: '7'
          type: string
      type: object
    SessionKeyStatusEntity:
      properties:
        default_ttl:
          description: The grant length this deployment actually hands out.
          example: 2592000
          type: number
        enabled:
          description: >-
            False when the deployment has no session contracts, the service is
            unreachable, or the member has no passkey wallet. Not an error — the
            caller falls back to prompting the passkey per order.
          example: true
          type: boolean
        handler_installed:
          description: Whether the Safe's session-aware fallback handler is installed.
          example: true
          type: boolean
        idle_lock_seconds:
          description: >-
            How long a device may hold an unlocked key without placing an order.
            Served rather than compiled into the client — a missing value must
            never be read as "no lock".
          example: 900
          type: number
        last_key_id:
          description: >-
            Highest grant id issued. Every order signature carries it, so read
            this after relaying an authorisation.
          example: '7'
          type: string
        max_ttl:
          description: The registry's immutable on-chain ceiling, in seconds.
          example: 15552000
          type: number
        safe:
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: string
      required:
        - enabled
      type: object
    SettledMarketEntity:
      properties:
        cost:
          description: >-
            What the position cost: collateral plus the fees charged on the
            fills.
          example: '36.22065'
          type: string
        event_id:
          example: 14710
          type:
            - number
            - 'null'
        event_image_url:
          example: null
          type:
            - string
            - 'null'
        event_slug:
          description: The parent event's slug — what the row links to.
          example: btc-updown-5m
          type:
            - string
            - 'null'
        event_title:
          example: Bitcoin Up or Down 5m
          type:
            - string
            - 'null'
        fees:
          description: The fee part of `cost`.
          example: '0.72065'
          type: string
        market_id:
          example: 14738
          type: number
        market_title:
          example: Bitcoin Up or Down 5m — 11:15–11:20 UTC
          type:
            - string
            - 'null'
        payout:
          description: What it paid. `0` on a market you lost.
          example: '50'
          type: string
        quote_currency:
          example: usdc
          type:
            - string
            - 'null'
        result:
          description: >-
            How the market resolved: `yes`, `no` or `void`. Null until
            determined.
          enum:
            - 'yes'
            - 'no'
            - void
          example: 'yes'
          type:
            - string
            - 'null'
        settled_at:
          description: RFC 3339, UTC.
          example: '2026-09-11T11:21:37Z'
          type:
            - string
            - 'null'
        settlement_status:
          description: >-
            On-chain settlement state, or `null` when this holding never touched
            the chain (a custodial fill has nothing to confirm).
          enum:
            - confirmed
            - pending
          example: confirmed
          type:
            - string
            - 'null'
        side:
          description: >-
            The side you held. `both` when you bought both outcomes of the same
            market — rare, and reported rather than collapsed to the larger leg.
          enum:
            - 'yes'
            - 'no'
            - both
          example: 'yes'
          type: string
        volume:
          description: Contracts held at resolution.
          example: '50'
          type: string
      required:
        - market_id
        - market_title
        - event_id
        - event_title
        - event_slug
        - event_image_url
        - result
        - side
        - volume
        - cost
        - fees
        - payout
        - quote_currency
        - settlement_status
        - settled_at
      type: object
    SignedOrderEntity:
      properties:
        expiration:
          description: Unix seconds. Must be non-zero, unexpired, and within 365 days.
          example: '1797600000'
          type: string
        fee_rate_bps:
          description: >-
            Must be `"0"`. The taker fee is collected separately on-chain from
            your Safe, not through this field.
          example: '0'
          type: string
        maker:
          description: >-
            Your Safe — the address the collateral comes from. For signature
            type 3 this equals `signer`.
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type: string
        maker_amount:
          description: USDC in, 6-decimal base units. `round(price × volume × 1e6)`.
          example: '60000000'
          type: string
        nonce:
          description: Exchange nonce.
          example: '0'
          type: string
        salt:
          description: >-
            Random per-order value. Two orders with identical terms must not
            share one.
          example: '5821094412'
          type: string
        side:
          description: >-
            Always `0` (BUY). Both YES and NO legs are buys that mint — the side
            you are taking is carried by `token_id` alone.
          enum:
            - 0
          example: 0
          type: number
        signature:
          description: >-
            The EIP-712 signature. For a session-signed order this is
            `abi.encode(keyId, r, s)` — exactly 96 bytes — which is how the
            server tells a session key from a passkey.
          example: 0x4f2a…
          type: string
        signature_type:
          description: >-
            `2` POLY_GNOSIS_SAFE (your Safe, owned by your wallet) or `3`
            POLY_1271 (your Safe, owned by a passkey). Read it from
            `signature_type` on the wallet config rather than choosing one — an
            order signed the way the other type requires is rejected.
          enum:
            - 2
            - 3
          example: 2
          type: number
        signer:
          description: >-
            Whoever signed. Your wallet EOA for types 0 and 2; the Safe itself
            for type 3, where a passkey or session key produced the signature.
          example: '0xE1188438C85C98aADFf1a88f97764E607B4978C3'
          type: string
        taker:
          description: The zero address — the order is public and anyone may match it.
          example: '0x0000000000000000000000000000000000000000'
          type: string
        taker_amount:
          description: Outcome tokens out, 6-decimal. `round(volume × 1e6)`.
          example: '100000000'
          type: string
        token_id:
          description: >-
            The ERC-1155 position id for YOUR side. This is what says which
            market and which outcome — a signed order carries no market field.
          example: 7138104...
          type: string
      required:
        - salt
        - maker
        - signer
        - taker
        - token_id
        - maker_amount
        - taker_amount
        - expiration
        - nonce
        - fee_rate_bps
        - side
        - signature_type
        - signature
      type: object
    TimestampEntity:
      properties:
        timestamp:
          description: Server time, Unix seconds.
          example: 1792391701
          type: number
      required:
        - timestamp
      type: object
    TransactionBridgeEntity:
