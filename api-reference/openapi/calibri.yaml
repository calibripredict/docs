        - safe_tx
      type: object
    BridgeWithdrawSafeTxEntity:
      properties:
        data:
          description: '`multiSend(bytes)` calldata of the three calls.'
          example: 0x8d80ff0a…
          type: string
        operation:
          description: '`1` (DELEGATECALL).'
          example: 1
          type: number
        to:
          description: MultiSendCallOnly — the batch is delegatecalled from your wallet.
          example: '0x40A2aCCbd92BCA938b02010E17A5b8929b49130D'
          type: string
        value:
          example: '0'
          type: string
      required:
        - to
        - value
        - data
        - operation
      type: object
    ContractEntity:
      properties:
        avg_price:
          description: >-
            The price of YOUR outcome on this fill: `price` for YES, 1 − `price`
            for NO.
          example: '0.6'
          type: string
        created_at:
          description: RFC 3339, UTC.
          example: '2026-08-07T10:00:00Z'
          type: string
        direction:
          description: >-
            Whether you bought or sold `side` on this contract. Always `buy` on
            a mint.
          enum:
            - buy
            - sell
          example: buy
          type: string
        event_slug:
          description: The parent event's slug — what a portfolio row links to.
          example: btc-updown-5m-1730
          type:
            - string
            - 'null'
        event_title:
          example: Bitcoin Up or Down 5m
          type:
            - string
            - 'null'
        fee:
          description: >-
            The fee YOU paid on this fill: `taker_fee_amount` when you were the
            taker, `0` when you were the maker. A fill whose contract was voided
            (`state` `voided`: its settlement failed or was never broadcast)
            reads `0` too — the chain never collected that fee and the engine
            reversed it. A market that resolves void keeps the fee.
            `taker_fee_amount` is the fee charged on the match, whoever paid it.
          example: '0.17'
          type: string
        funds_spent:
          description: Cash paid, on a buy. 0 on a sell.
          example: '60'
          type: string
        id:
          example: 48211
          type: number
        market_id:
          description: The market this fill is in.
          example: 12
          type: number
        market_title:
          description: Null if the market row is gone.
          example: Will BTC close above its open?
          type:
            - string
            - 'null'
        match_type:
          description: >-
            `mint` creates a YES/NO pair from two buys; `transfer` moves an
            existing token from a seller to a buyer; `merge` redeems a YES and a
            NO from two sellers.
          enum:
            - mint
            - transfer
            - merge
          example: mint
          type: string
        order_id:
          description: Your order that this fill belongs to. Filter with `?order_id=`.
          example: 90311
          type:
            - number
            - 'null'
        outcome_labels:
          description: >-
            The market’s YES and NO leg names, in that order. `["Yes", "No"]` on
            a market using the default.
          example:
            - Above $77,500
            - Below $77,500
          items:
            type: string
          type: array
        price:
          description: >-
            The YES price of the match, a probability in (0,1), whichever side
            you were on.
          example: '0.6'
          type: string
        proceeds:
          description: Cash received before fees, on a sell. 0 on a buy.
          example: '0'
          type: string
        quote_currency:
          example: usdc
          type:
            - string
            - 'null'
        settled_at:
          description: >-
            When the market resolved. Null while the contract is open. RFC 3339,
            UTC.
          example: '2026-08-08T00:00:00Z'
          type:
            - string
            - 'null'
        settlement_status:
          description: >-
            The on-chain mint badge: `pending` until confirmed, `reversed` if
            the market voided. Null for a custodial fill.
          enum:
            - pending
            - confirmed
            - reversed
          example: confirmed
          type:
            - string
            - 'null'
        settlement_status_raw:
          description: The internal state-machine value behind the badge.
          example: matched
          type: string
        side:
          description: >-
            The outcome you traded on this contract. On an exit this is the
            outcome you sold or bought, not the book side.
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: string
        state:
          description: Lifecycle. A settled contract names the winning side.
          enum:
            - active
            - settled_yes
            - settled_no
            - voided
          example: active
          type: string
        taker_fee_amount:
          description: >-
            The taker fee charged at trade time. Nothing further is taken at
            settlement — a winning share pays the full 1.00.
          example: '0.17'
          type: string
        taker_or_maker:
          description: >-
            Your role on this fill: `taker` if your order arrived and matched a
            resting one, `maker` if yours was resting. On a match against
            yourself, `taker`.
          enum:
            - taker
            - maker
          example: taker
          type: string
        token_id:
          description: >-
            The on-chain ERC-1155 outcome token for `side`, as a decimal string
            (a uint256 — do not parse as a number). Null when the market is not
            registered on-chain.
          example: '52114319501245915516055106046884209969926127482827954674443846427813813222426'
          type:
            - string
            - 'null'
        volume:
          description: Shares filled.
          example: '100'
          type: string
      required:
        - id
        - market_id
        - market_title
        - event_slug
        - event_title
        - quote_currency
        - side
        - token_id
        - direction
        - match_type
        - order_id
        - price
        - avg_price
        - volume
        - funds_spent
        - proceeds
        - taker_fee_amount
        - taker_or_maker
        - fee
        - state
        - outcome_labels
        - settlement_status
        - settlement_status_raw
        - created_at
        - settled_at
      type: object
    CreateOrderRequest:
      properties:
        client_order_id:
          description: >-
            Your own id for this order, 1–64 characters of `A-Z a-z 0-9 _ -`.
            Echoed on the order and its websocket frames, and filterable on the
            order list. A second order with an id you used in the last 7 days is
            rejected with 409 `order.duplicate_client_order_id`, so a retried
            placement can never create two orders.
          example: bot-7f3a-0001
          type: string
        direction:
          description: >-
            Whether you are opening or closing. `buy` posts collateral and
            acquires the outcome; `sell` offers outcome tokens you already hold,
            so it locks INVENTORY rather than cash and its `locked` is zero.
            Defaults to `buy`, which is how every order behaved before position
            exit. See /account/positions for how much of a holding is sellable.
          enum:
            - buy
            - sell
          example: buy
          type: string
        ioc:
          description: >-
            Immediate-or-cancel. Set it on a marketable order — the "market"
            order a signed wallet has to send as a limit at a price ceiling:
            whatever the book cannot fill on arrival is refunded instead of
            resting at that ceiling. Ignored together with `post_only`. Recorded
            on the order as `ioc`.
          example: false
          type: boolean
        market_id:
          description: >-
            The market. A JSON number; a numeric string (`"12"`) is accepted
            too. Anything else is a 422.
          example: 12
          type: number
        ord_type:
          enum:
            - limit
            - market
          example: limit
          type: string
        post_only:
          description: >-
            Reject the order if it would take liquidity. A post-only order
            reserves no taker fee, because it can only ever rest as a maker.
          example: false
          type: boolean
        price:
          description: >-
            Limit price, `0.01`–`0.99`, in whole cents (e.g. 0.27, not 0.275) —
            an order finer than the market precision is rejected, not rounded.
            Required for a limit order.
          example: '0.6'
          type: string
        side:
          description: >-
            The OUTCOME this order is about — never buy/sell. Pair it with
            `direction`: a sell of `yes` and a buy of `no` are different orders
            that happen to sit on the same side of the book.
          enum:
            - 'yes'
            - 'no'
          example: 'yes'
          type: string
        signed_order:
          $ref: '#/components/schemas/SignedOrderEntity'
          description: >-
            The EIP-712-signed order. Validated before anything is placed — a
            signature the server cannot verify is rejected, never rested.
        volume:
          description: Number of shares.
          example: '100'
          type: string
      required:
        - market_id
        - side
        - ord_type
        - volume
        - signed_order
      type: object
    CtfAutoRedeemEntity:
      properties:
        auto_redeemer_address:
          description: >-
            The contract to approve with `setApprovalForAll` on the Conditional
            Tokens. It can only redeem your resolved positions and return the
            whole payout to your Safe. Null when auto-redeem is not offered.
          example: 0x4Fd2…
          type:
            - string
            - 'null'
        available:
          description: Whether this account can use auto-redeem.
          example: true
          type: boolean
        blockchain_key:
          example: polygon-mainnet
          type: string
        chain_id:
          example: 137
          type: number
        conditional_tokens_address:
          description: Gnosis' Conditional Tokens — where your collateral actually sits.
          example: '0x4D97DCd97eC945f40cF65F87097ACe5EA0476045'
          type: string
        domain_name:
          description: >-
            The EIP-712 domain name this exchange was DEPLOYED with. Hashed into
            every order signature, and different per network — sign with the
            served value, never a hard-coded one, or the signature will not
            recover.
          example: Calibri CTF Prediction Markets
          type: string
        enabled:
          description: Whether resolved winnings are redeemed into your Safe automatically.
          example: false
          type: boolean
        exchange_address:
          description: This deployment's CTF Exchange.
          example: '0xB6Ac44d5A6388b8C7511F2fb20C0c03fD0CeDC83'
          type: string
        owner_address:
          description: >-
            What owns the Safe: your wallet EOA, or for a passkey member the
            secp256r1 signer contract. Served so a client can spot that a
            different wallet is connected — only the owner can sign for the
            Safe.
          example: '0xE1188438C85C98aADFf1a88f97764E607B4978C3'
          type:
            - string
            - 'null'
        proxy_address:
          description: Your Safe — the deposit destination and the maker on your orders.
          example: '0x0DECE7d83f8D47CD8dD8278c0F22c361C58577BD'
          type:
            - string
            - 'null'
        safe_setup:
          $ref: '#/components/schemas/SafeSetupEntity'
        safe_status:
          description: >-
            The single field that answers "can this member trade?".
            `setup_required` means an order would REST AND THEN FAIL TO SETTLE —
            worse than being rejected, so do not trade on it.
          enum:
            - ready
            - setup_required
            - error
            - unavailable
            - unlinked
          example: ready
          type: string
        session_keys_enabled:
          description: Whether this deployment has session trading keys switched on.
          example: true
          type: boolean
        signature_type:
          description: >-
            How this account signs orders: `2` = POLY_GNOSIS_SAFE (Safe owned by
            your wallet), `3` = POLY_1271 (Safe owned by a passkey). Sign the
            way your type requires. Whether the Safe is usable yet is
            `safe_status`, not this field.
          enum:
            - 2
            - 3
          example: 2
          type: number
        usdc_address:
          description: The collateral token.
          example: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359'
          type: string
