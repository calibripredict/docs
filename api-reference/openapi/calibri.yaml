openapi: 3.1.0
info:
  title: Calibri API
  version: '1.0.0'
  description: >-
    The Calibri API. Discover markets, read live books, place signed orders,
    and manage positions and account data.

    Routed by path prefix to the service that answers it — which is an
    implementation detail, not something a caller has to reason about.
servers:
  - description: Production
    url: https://calibri.io
tags:
  - name: Health
    description: Service liveness.
    x-displayName: Health
  - name: Events
    description: Discover events and their metadata.
    x-displayName: Events
  - name: Markets
    description: List markets and load market detail for trading.
    x-displayName: Markets
  - name: Series
    description: Recurring event series.
    x-displayName: Series
  - name: Tags
    description: Editorial shelves used to browse the catalogue.
    x-displayName: Tags
  - name: Market Data
    description: Order book, depth, trade tape, tickers, and candles.
    x-displayName: Market Data
  - name: Assets
    description: Underlying asset price history for price-feed markets.
    x-displayName: Assets
  - name: Community
    description: Leaderboard and platform activity.
    x-displayName: Community
  - name: Currencies
    description: Currency registry.
    x-displayName: Currencies
  - name: Trade
    description: Place, list, and cancel orders.
    x-displayName: Trade
  - name: Positions
    description: Your matched contracts.
    x-displayName: Positions
  - name: Wallet
    description: Self-custody Safe, passkey, session keys, and relay.
    x-displayName: Wallet
  - name: Rewards
    description: Maker rebates and referral earnings.
    x-displayName: Rewards
  - name: Account
    description: Balances, ledger, PnL, limits, preferences, and profile.
    x-displayName: Account
  - name: Categories
    description: Categories
    x-displayName: Categories
  - name: Other
    description: Other
    x-displayName: Other
paths:
  /api/v2/pythia/orders:
    get:
      description: |-
        Your prediction orders. Open (`wait`) rows come from the live
        engine index; terminal history (`done`, `cancel`, `reject`) from
        storage. Pass `state=wait` for the open-orders tab — that is what
        the product calls for resting orders, custodial and non-custodial
        alike. Placement path differs (Atlas signed-order vs this service's
        direct POST); list and cancel do not.

        Pagination: `page` / `limit` in, totals in the `Page` / `Per-Page` /
        `Total` response headers.
      parameters:
        - description: wait (open), done, cancel, reject
          in: query
          name: state
          schema:
            type: string
        - description: Market id
          in: query
          name: market_id
          schema:
            type: integer
        - description: limit or market
          in: query
          name: ord_type
          schema:
            type: string
        - description: 'Outcome filter: yes or no'
          in: query
          name: side
          schema:
            type: string
        - description: >-
            Your client_order_id. Without `state`, looks in open orders, then
            history
          in: query
          name: client_order_id
          schema:
            type: string
        - description: Lower bound, Unix SECONDS (not milliseconds)
          in: query
          name: time_from
          schema:
            type: integer
        - description: Upper bound, Unix SECONDS (not milliseconds)
          in: query
          name: time_to
          schema:
            type: integer
        - description: asc or desc (default desc)
          in: query
          name: order_by
          schema:
            type: string
        - description: Page (default 1)
          in: query
          name: page
          schema:
            type: integer
        - description: Rows per page, 1-100 (default 100)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemberOrder'
                type: array
          description: OK
          headers:
            Page:
              schema:
                type: integer
            Per-Page:
              schema:
                type: integer
            Total:
              schema:
                type: integer
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
        - apiKey: []
      summary: Your orders
      tags:
        - Trade
  /api/v2/pythia/orders/{id}:
    get:
      description: |-
        One of your orders. Open orders resolve from the live index;
        terminal ones fall back to history. Returns 404 for another
        member's order rather than 403.
      parameters:
        - description: Order id
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberOrder'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      security:
        - apiKey: []
      summary: Order by id
      tags:
        - Trade
  /api/v2/pythia/orders/{id}/cancel:
    post:
      description: |-
        Cancels one of your open (`wait`) orders and refunds unmatched
        collateral. Same route for custodial and non-custodial resting
        orders — non-custodial placement is via Atlas; once resting, cancel
        is here. Terminal orders return 422.
      parameters:
        - description: Order id
          in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCancelResult'
          description: Accepted
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
      security:
        - apiKey: []
      summary: Cancel an order
      tags:
        - Trade
  /api/v2/pythia/orders/cancel:
    post:
      description: |-
        Cancels every open order you hold, optionally narrowed by market
        and outcome — on the query string, or as a JSON body
        `{"market_id": 12, "side": "yes"}` (a body field wins over the same
        query parameter). `orders` lists the orders cancelled, as `GET /orders`
        rows (state `cancel`); `failed` counts orders that could not be.
        Shares a per-member budget with order placement and single cancels
        (429 `market.order.rate_limited` over it).
      parameters:
        - description: Only orders in this market
          in: query
          name: market_id
          schema:
            type: integer
        - description: Only orders on this outcome (yes|no)
          in: query
          name: side
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                - $ref: '#/components/schemas/CancelAllRequest'
                  description: The same filters as a JSON body
                  summary: body
        description: The same filters as a JSON body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAllResult'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      security:
        - apiKey: []
      summary: Cancel all own orders
      tags:
        - Trade
  /api/v2/pythia/public/activity:
    get:
      description: |-
        Recent platform activity across trades, settlements and newly
        activated markets, newest first. Filter with
        `type` (`trades`, `settlements`, `new_markets`); omit it for the
        combined feed.
      parameters:
        - description: trades, settlements or new_markets
          in: query
          name: type
          schema:
            type: string
        - description: Rows, 1-200 (default 50)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivityItem'
                type: array
          description: OK
      summary: Activity feed
      tags:
        - Community
      security: []
  /api/v2/pythia/public/assets:
    get:
      description: |-
        Underlying symbols that have recorded tick/candle history
        (e.g. exchange products feeding candle-direction markets). Read
        this rather than hard-coding a product list that will go stale.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSymbolsResponse'
              example:
                symbols:
                  - BTC-USD
                  - ETH-USD
                  - SOL-USD
          description: OK
      summary: Asset symbols
      tags:
        - Assets
      security: []
  /api/v2/pythia/public/assets/{symbol}/candles:
    get:
      description: >-
        The EXCHANGE'S OWN published candles, stored verbatim — not recomputed

        from sampled ticks. A candle derived from samples has systematically

        narrower wicks, and a member trading off the chart is paid off the

        exchange's candle, so the two have to be the same numbers by
        construction.


        Paged BACKWARD only: send the returned next_to as the new to.
      parameters:
        - description: Coinbase product id, e.g. BTC-USD
          in: path
          name: symbol
          required: true
          schema:
            type: string
        - description: 'A width the exchange publishes: 1m, 5m, 15m, 1h, 6h, 1d (default 1m)'
          in: query
          name: granularity
          schema:
            type: string
        - description: Page cursor, Unix seconds. Defaults to now
          in: query
          name: to
          schema:
            type: integer
        - description: Candles per page, 1-1000 (default 300)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCandlesResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Asset candles
      tags:
        - Assets
      security: []
  /api/v2/pythia/public/assets/{symbol}/prices:
    get:
      description: |-
        The recorded tick stream over a closed range, oldest first — the shape
        that draws one window. BOTH bounds are required: this endpoint draws a
        window, and a window has two ends.

        `t` is Unix seconds, matching the live websocket tick, so a historical
        fetch and a live subscription concatenate without a time conversion in
        the middle.
      parameters:
        - description: Coinbase product id, e.g. BTC-USD
          in: path
          name: symbol
          required: true
          schema:
            type: string
        - description: Range start, Unix seconds
          in: query
          name: from
          required: true
          schema:
            type: integer
        - description: Range end, Unix seconds. Must be after from
          in: query
          name: to
          required: true
          schema:
            type: integer
        - description: Max points, 1-5000 (default 5000)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPricesResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Asset ticks
      tags:
        - Assets
      security: []
  /api/v2/pythia/public/assets/{symbol}/window:
    get:
      description: >-
        The exchange's own candle for ONE window — the price to beat, and the

        price so far. This is the figure a candle-direction market settles on.


        Two flags, and the distinction matters: `complete` means the window is

        over BY THE CLOCK; `confirmed` means the stored candle was read AFTER
        its

        bucket closed and can no longer change. In the seconds between, complete

        is true while close is still mid-formation — do not present an

        unconfirmed close as final.
      parameters:
        - description: Coinbase product id, e.g. BTC-USD
          in: path
          name: symbol
          required: true
          schema:
            type: string
        - description: Window opening instant, Unix seconds, on a granularity boundary
          in: query
          name: start
          required: true
          schema:
            type: integer
        - description: Window width in seconds (default 300)
          in: query
          name: granularity_seconds
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetWindowResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Asset window
      tags:
        - Assets
      security: []
  /api/v2/pythia/public/categories:
    get:
      description: |-
        The two-level browse tree — Sports > Soccer — with active-event
        counts. A parent's count includes its children's.
        Includes categories with no live events; retired ones are omitted.
        Use a slug with `GET /public/events?category=` or `?subcategory=`.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryNode'
                type: array
          description: OK
      summary: List browse categories
      tags:
        - Categories
      security: []
  /api/v2/pythia/public/events:
    get:
      description: |-
        The catalogue of events, each with its child markets.

        A generated or sub-daily series is COLLAPSED to a single entry — a
        five-minute feed publishes 288 events a day and must not fill the feed.
        Pass `series` to drill into one and get its individual windows, or
        `expand_series=true` to list every window of every series uncollapsed.

        `q` searches title, description, category, sub-category, tags and market
        titles (case-insensitive substring, 2+ characters). Collapsing still
        applies, but AFTER the search: a series is represented by its best
        MATCHING window, so a search naming one window returns that window.

        Pagination: `page` / `limit` in, `Page` / `Per-Page` / `Total` response
        headers out — the same headers as `/orders`. `Total` counts every
        matching event after collapsing; a page past the end is `[]`.
      parameters:
        - description: >-
            Search text, case-insensitive substring; under 2 characters is
            ignored
          in: query
          name: q
          schema:
            type: string
        - description: Filter by category
          in: query
          name: category
          schema:
            type: string
        - description: Filter by status. `resolved` covers determined and settled
          in: query
          name: status
          schema:
            type: string
        - description: Filter to one tag slug
          in: query
          name: tag
          schema:
            type: string
        - description: Filter to one series slug. Expands it rather than collapsing
          in: query
          name: series
          schema:
            type: string
        - description: Filter to one sub-category slug, e.g. tennis
          in: query
          name: subcategory
          schema:
            type: string
        - description: Filter by series cadence, e.g. daily / weekly / monthly
          in: query
          name: frequency
          schema:
            type: string
        - description: Sort order, e.g. newest
          in: query
          name: sort
          schema:
            type: string
        - description: Reverse the sort
          in: query
          name: reverse
          schema:
            type: boolean
        - description: Order of markets[] within each event
          in: query
          name: market_sort
          schema:
            type: string
        - description: List each window of a collapsed series as its own event
          in: query
          name: expand_series
          schema:
            type: boolean
        - description: Page size, 1-100 (default 100), applied after collapsing
          in: query
          name: limit
          schema:
            type: integer
        - description: Page, 1-based (default 1)
          in: query
          name: page
          schema:
            type: integer
        - description: >-
            `slim` reduces each event and market to the card fields (see
            api.SlimEvent); anything else returns the full object
          in: query
          name: fields
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  anyOf:
                    - $ref: '#/components/schemas/EnrichedEvent'
                    - $ref: '#/components/schemas/SlimEvent'
                type: array
          description: OK
          headers:
            Page:
              description: Page served
              schema:
                type: integer
            Per-Page:
              description: Page size
              schema:
                type: integer
            Total:
              description: Matching events across all pages, after collapsing
              schema:
                type: integer
      summary: List events
      tags:
        - Events
      security: []
  /api/v2/pythia/public/events/{slug}:
    get:
      description: >-
        One event with its markets — the same object as a list element.

        The path takes the event's slug or its numeric id; an all-digit value is
        an id.

        Falls back to MySQL for older windows that have left the live

        cache, so bookmarked and historical links keep resolving.


        `include` bundles the per-market live data the event page

        otherwise fetches one call at a time. The first `include_limit`

        markets (in response order) each gain `order_book`, `kline` and/or

        `recent_contracts`, holding exactly what the standalone

        `/public/markets/{id}/order-book`, `/k-line` and `/contracts/recent`

        routes return (the book also carries its `sequence`). Markets past

        the limit carry none of them. Without `include` the response is the

        plain event.
      parameters:
        - description: Event slug, or its numeric id
          in: path
          name: slug
          required: true
          schema:
            type: string
        - description: >-
            Order of markets[]: default (operator rank, else probability desc),
            az or za
          in: query
          name: market_sort
          schema:
            type: string
        - description: Comma list of `books`, `recent`, `klines`; unknown names are ignored
          in: query
          name: include
          schema:
            type: string
        - description: How many leading markets get the bundle, 1-12 (default 6)
          in: query
          name: include_limit
          schema:
            type: integer
        - description: k-line period in minutes, as /k-line takes it (default 1)
          in: query
          name: period
          schema:
            type: integer
        - description: k-line rows, 1-10000 (default 30)
          in: query
          name: kline_limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBundle'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Event by slug or id
      tags:
        - Events
      security: []
  /api/v2/pythia/public/home:
    get:
      description: |-
        The main event list for the given query, the four fixed rails
        (`trending`, `ending_soon`, `volume`, `featured` — each
        `/public/events?sort=<rail>&limit=5&status=active`) and the
        category tree, in one response. Each part is exactly what its
        standalone route returns. Takes the same query parameters as
        `/public/events` for the main list, except `q` and `page`, which
        are ignored: the main list is always the first page, unsearched.
      parameters:
        - description: Filter by category
          in: query
          name: category
          schema:
            type: string
        - description: Filter by status. `resolved` covers determined and settled
          in: query
          name: status
          schema:
            type: string
        - description: Filter to one tag slug
          in: query
          name: tag
          schema:
            type: string
        - description: Filter to one series slug. Expands it rather than collapsing
          in: query
          name: series
          schema:
            type: string
        - description: Filter to one sub-category slug, e.g. tennis
          in: query
          name: subcategory
          schema:
            type: string
        - description: Filter by series cadence, e.g. daily / weekly / monthly
          in: query
          name: frequency
          schema:
            type: string
        - description: Sort order, e.g. newest
          in: query
          name: sort
          schema:
            type: string
        - description: Reverse the sort
          in: query
          name: reverse
          schema:
            type: boolean
        - description: Order of markets[] within each event
          in: query
          name: market_sort
          schema:
            type: string
        - description: Page size, applied after collapsing
          in: query
          name: limit
          schema:
            type: integer
        - description: '`slim` reduces the main list AND the rails to the card fields'
          in: query
          name: fields
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
          description: OK
      summary: Home bundle
      tags:
        - Events
      security: []
  /api/v2/pythia/public/leaderboard:
    get:
      description: |-
        Top members by realised PnL on settled contracts. `username` is a
        privacy-masked display name (or an explicit display name when set).
        A member with settled contracts in more than one currency appears
        once per currency. Filter with `period` (`all`, `24h`, `7d`, `30d`).
      parameters:
        - description: all (default), 24h, 7d or 30d
          in: query
          name: period
          schema:
            type: string
        - description: Page, from 1 (default 1)
          in: query
          name: page
          schema:
            type: integer
        - description: Rows per page, 1-100 (default 100)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
                type: array
          description: OK
          headers:
            Page:
              description: The page returned
              schema:
                type: integer
            Per-Page:
              description: Rows per page
              schema:
                type: integer
            Total:
              description: Ranked rows on the whole board, at most 100
              schema:
                type: integer
      summary: Leaderboard
      tags:
        - Community
      security: []
  /api/v2/pythia/public/markets:
    get:
      description: |-
        Every live market as a flat list, with the same object shape as market
        detail (pricing fields and CTF ids included). An order — including a
        signed one — can be built straight from a list response without a
        per-market follow-up call.
      parameters:
        - description: >-
            Filter on the published status. `resolved` covers determined and
            settled
          in: query
          name: status
          schema:
            type: string
        - description: asc (default) or desc
          in: query
          name: ordering
          schema:
            type: string
        - description: >-
            Only the live market whose yes_token_id or no_token_id this is: the
            decimal string, exactly as published
          in: query
          name: token_id
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MarketPayload'
                type: array
          description: OK
      summary: List markets
      tags:
        - Markets
      security: []
  /api/v2/pythia/public/markets/{market}:
    get:
      description: >-
        One market with pricing fields and CTF ids needed to build an order.

        Falls back to stored data for settled and voided markets, so historical

        markets and bookmarked links keep resolving after the engine has dropped
        them.
      parameters:
        - description: Market id
          in: path
          name: market
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPayload'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Market detail
      tags:
        - Markets
      security: []
  /api/v2/pythia/public/markets/{market}/contracts/recent:
    get:
      description: |-
        The public trade tape — recently matched YES/NO contracts at a
        price and volume, newest first. Served for settled markets too
        (historical tape from storage), not only live engine markets.

        `from_id` and `time_from` switch to OLDEST first, for paging forward;
        `from_id` wins when both are given. Prices are in YES space.

        Voided trades appear with `state: "voided"`: a match whose on-chain
        settlement failed for good and was reversed off-chain. Every row has
        `state`; drop voided rows if you want only trades that stood.
      parameters:
        - description: Market id
          in: path
          name: market
          required: true
          schema:
            type: string
        - description: Rows, 1-1000 (default 100)
          in: query
          name: limit
          schema:
            type: integer
        - description: >-
            Cursor: only contracts with id greater than this, OLDEST first. Pass
            the last id you received to page forward without gaps
          in: query
          name: from_id
          schema:
            type: integer
        - description: >-
            Only contracts matched at or after this time, Unix SECONDS
            (inclusive), OLDEST first. Continue with from_id
          in: query
          name: time_from
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicContract'
                type: array
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Recent contracts
      tags:
        - Market Data
      security: []
  /api/v2/pythia/public/markets/{market}/depth:
    get:
      description: |-
        Aggregated book as `[price, volume]` pairs per side, best-first,
        plus a server timestamp. Lighter than the full order-book payload —
        use this for depth charts; use the order-book endpoint when you
        need side-tagged levels.
      parameters:
        - description: Market id
          in: path
          name: market
          required: true
          schema:
            type: string
        - description: Levels per side, 1-100 (default 100)
          in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
