      description: >-
        PriceTarget is the level this market is judged against, published BEFORE

        it settles.


        The sibling of PriceSettlement and deliberately not the same thing.

        PriceSettlement is what happened and exists only once a market is
        decided;

        this is the question, and it is known the moment the market is listed. A

        strike ladder needs it: every rung shares one underlying price chart and

        differs only in where its line sits, so without this the front end has a

