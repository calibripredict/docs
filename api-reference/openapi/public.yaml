          example: 200
          type:
          - integer
          - "null"
        end_at:
          example: "2026-12-31T00:00:00Z"
          type:
          - string
          - "null"
        featured:
          example: false
          type: boolean
        id:
          example: 12345
          type: integer
        image_url:
          example: https://cdn.calibri.io/events/btc-70k.png
          type:
          - string
          - "null"
        market_count:
          example: 2
          type: integer
        markets:
          items:
            $ref: '#/components/schemas/SlimMarket'
          type: array
          uniqueItems: false
        outcome_structure:
          description: 'The card fields: what a grid or rail card prints beside the
            title.'
          example: independent
          type: string
        price_feed:
          anyOf:
          - $ref: '#/components/schemas/PriceFeed'
          - type: "null"
        series:
          anyOf:
          - $ref: '#/components/schemas/SeriesRef'
          - type: "null"
        slug:
          example: btc-above-70k-december-2026
          type: string
        status:
          enum:
          - submitted
          - initialized
          - active
          - closed
          - resolving
          - settling
          - settled
