components:
  schemas:
    KLineRow:
      description: |-
        One candle: [timestamp, open, high, low, close, volume] — the bucket start
        in Unix seconds, the YES-space open / high / low / close prices, and the
        contracts traded in the bucket. Numbers, not strings: chart series are the
        one place decimals are numbers.
      example:
      - 1787083200
      - 0.6
      - 0.7
      - 0.58
      - 0.65
      - 240
      maxItems: 6
      minItems: 6
      prefixItems:
      - description: Bucket start, Unix seconds
        type: integer
      - description: Open, YES-space price
        type: number
      - description: High, YES-space price
        type: number
      - description: Low, YES-space price
        type: number
      - description: Close, YES-space price
        type: number
      - description: Contracts traded
        type: number
      type: array
    ActivityItem:
      properties:
        amount:
          description: The contract's notional (price × volume) in `currency`; null
            on new_market.
          example: "250.5"
          type:
          - string
          - "null"
        created_at:
          example: "2026-08-07T10:05:30Z"
          type: string
        currency:
          example: usdc
          type:
          - string
          - "null"
        description:
          example: YES @ 62%
          type:
          - string
          - "null"
        event_slug:
          description: Null when the market has no event.
          example: will-btc-reach-70k
          type:
          - string
          - "null"
        id:
          description: |-
            The id of the row the item is about: a contract for trade and
            settlement, an event for new_market. A contract that traded and then
            settled appears twice with the same id, once per type.
          example: 1420
          type: integer
        market_id:
          example: 12
          type:
          - integer
          - "null"
        side:
          enum:
          - "yes"
          - "no"
          - null
          example: "yes"
          type:
          - string
          - "null"
        title:
          example: BTC crosses $65,000
          type: string
        type:
          enum:
          - trade
          - settlement
          - new_market
          example: trade
          type: string
      type: object
    AssetCandlesResponse:
      properties:
        candles:
          items:
            $ref: '#/components/schemas/CandlePoint'
          type: array
          uniqueItems: false
        granularity:
          example: 1m
          type: string
        has_more:
          example: true
          type: boolean
        next_to:
          description: |-
            NextTo is the cursor for the next page back; HasMore is false when the
            page came back short, meaning the recorded history starts here and the
            client should stop rather than fire requests into an empty past forever.
          example: 1722950399
          type: integer
        symbol:
          example: BTC-USD
          type: string
      type: object
    AssetPricesResponse:
      properties:
        complete:
          description: |-
            Complete says whether the range has finished or is still filling. A client
            drawing a live window uses it to decide whether to also open a
            subscription; without it, it has to re-derive the clock comparison we
            just did.
          example: true
          type: boolean
        from:
          example: 1722950100
          type: integer
        points:
          items:
            $ref: '#/components/schemas/PricePoint'
          type: array
          uniqueItems: false
        symbol:
          example: BTC-USD
          type: string
        to:
          example: 1722950400
          type: integer
      type: object
    AssetSymbolsResponse:
      properties:
        symbols:
          description: Coinbase product ids with recorded tick/candle history.
          example:
            - BTC-USD
            - ETH-USD
            - SOL-USD
          items:
            type: string
            example: BTC-USD
          type: array
          uniqueItems: false
      example:
        symbols:
          - BTC-USD
          - ETH-USD
          - SOL-USD
      type: object
    AssetWindowResponse:
      properties:
        close:
          example: 65400.5
          type: number
        complete:
          description: 'Complete: the window is over BY THE CLOCK.'
          example: true
          type: boolean
        confirmed:
          description: |-
            Confirmed: the candle we hold was read AFTER its bucket closed, so it can
            no longer change. Distinct from Complete, and the distinction is the whole
            point — for the seconds between a window closing and the poller re-reading
            it, the clock says finished while the stored close is still a
            mid-formation value. Showing that as final would mean showing a number
            that then moves, on the one figure that decides whether a member won.
          example: true
          type: boolean
        granularity_seconds:
          example: 300
          type: integer
        high:
          example: 65450.75
          type: number
        low:
          example: 65300.5
          type: number
        open:
          description: |-
            Pointers, because present-but-empty is a real state: the poller has not
            read this bucket yet, which is normal in the first seconds of a window.
            Omitted rather than zeroed so a client shows a placeholder instead of
            drawing a $0.00 open.
          example: 65380.25
          type: number
        symbol:
          example: BTC-USD
          type: string
        window_end:
          example: 1722950700
          type: integer
        window_start:
          example: 1722950400
          type: integer
      type: object
    BookLevel:
      properties:
        price:
          example: "0.62"
          type: string
        side:
          enum:
          - "yes"
          - "no"
          example: "yes"
          type: string
        volume:
          example: "100.50"
          type: string
      type: object
    BundledOrderBook:
      description: Exactly `GET /public/markets/{id}/order-book`, plus the book's
        `sequence`.
      properties:
        no_asks:
          items:
            $ref: '#/components/schemas/BookLevel'
          type: array
          uniqueItems: false
        no_bids:
          items:
            $ref: '#/components/schemas/BookLevel'
          type: array
          uniqueItems: false
        sequence:
          example: 8814
          type: integer
        yes_asks:
          items:
            $ref: '#/components/schemas/BookLevel'
          type: array
          uniqueItems: false
        yes_bids:
          items:
            $ref: '#/components/schemas/BookLevel'
          type: array
          uniqueItems: false
      type: object
    CancelAllRequest:
      properties:
        market_id:
          description: Only orders in this market. A JSON number or a numeric string.
          example: 12
          type: integer
        side:
          description: Only orders on this outcome.
          enum:
          - "yes"
          - "no"
          example: "yes"
          type: string
      type: object
    CancelAllResult:
      properties:
        cancelled:
          example: 3
          type: integer
        failed:
          example: 0
          type: integer
        orders:
          description: Orders are the orders this call cancelled, in state `cancel`.
          items:
            $ref: '#/components/schemas/MemberOrder'
          type: array
          uniqueItems: false
        total:
          example: 3
          type: integer
      type: object
    CandlePoint:
      properties:
        c:
          example: 65400.5
          type: number
        h:
          example: 65450.75
          type: number
        l:
          example: 65300.5
          type: number
        o:
          example: 65380.25
          type: number
        t:
          example: 1722950400
          type: integer
        v:
          example: 245.8
          type: number
      type: object
    DepthResponse:
      properties:
        asks:
          items:
            items:
              type: string
            type: array
          type: array
          uniqueItems: false
        bids:
          items:
            items:
              type: string
            type: array
          type: array
          uniqueItems: false
        timestamp:
          description: Unix seconds.
          example: 1723033200
          type: integer
      type: object
    EnrichedEvent:
      properties:
        category:
          example: crypto
          type: string
        created_at:
          description: |-
            CreatedAt (RFC3339, from events.created_at) backs the "newest" list sort.
            Before it was surfaced, "newest" fell back to id DESC.
          example: "2026-08-07T10:00:00Z"
          type:
          - string
          - "null"
        description:
          example: Resolves from the final Coinbase BTC-USD trade price before the
            close date.
          type:
          - string
          - "null"
        display_type:
          description: |-
            DisplayType (events.display_type) picks the chart SOURCE, not the market
            shape: "probability" (default) plots the markets' own YES probability,
            "price_feed" plots an underlying feed with a reference line.
          example: probability
          type: string
        effective_taker_fee_rate_bps:
          description: |-
            EffectiveTakerFeeRateBps is the resolved fee rate the matching engine
            will charge for trades in any of this event's markets. Computed at
            load time as: COALESCE(override, category default). NULL/nil means
            UNRESOLVED — no override and no fee_categories row for the category —
            which order placement rejects (distinct from a resolved 0 = free).
            Read-only — not persisted as its own column.
          example: 200
          type:
          - integer
          - "null"
        end_at:
          description: The earliest close_at across the event's markets. Null when
            none has one.
          example: "2026-12-31T00:00:00Z"
          type:
          - string
          - "null"
        featured:
          example: false
          type: boolean
        id:
          example: 12345
          type: integer
        image_url:
          example: https://cdn.calibri.io/events/btc-70k.png
          type:
          - string
          - "null"
        market_count:
          example: 2
          type: integer
        markets:
          items:
            $ref: '#/components/schemas/EnrichedMarket'
          type: array
          uniqueItems: false
        outcome_structure:
          description: |-
            OutcomeStructure (events.outcome_structure) says how this event's markets
            relate to one another. It selects the frontend layout and is deliberately
            NOT derivable from len(Markets) — a contender race, a strike ladder and a
            fixture's derivative bundle can all carry a dozen markets and none of them
            renders like the others.

              independent — one question, or several unrelated ones (the default)
              one_winner  — at most one market resolves YES; ranked, sums to ~100%
              ladder      — nested thresholds over one variable ("above $100k",
                            "above $110k"). Several legs resolve YES together so it is
                            not one_winner, but the legs are nested so it is not
                            independent either: prices fall monotonically down the
                            ladder, ordered by markets.event_rank.

            Kalshi carries the same three as MECNET / DIRECNET / none.

            Display + validation only. Neither Kalshi's collateral netting nor
            Polymarket's NegRiskAdapter is implemented on our side.
          example: independent
          type: string
        price_feed:
          anyOf:
          - $ref: '#/components/schemas/PriceFeed'
          - type: "null"
        series:
          anyOf:
          - $ref: '#/components/schemas/SeriesRef'
          - type: "null"
        series_window_count:
          description: |-
            How many windows of this rolling series are listed, this one included.
            Null for everything else.
          example: 12
          type:
          - integer
          - "null"
        slug:
          example: btc-above-70k-december-2026
          type: string
        status:
          description: The event's own lifecycle state (events.aasm_state).
          enum:
          - submitted
          - initialized
          - active
          - closed
          - resolving
          - settling
          - settled
          - canceled
          example: active
          type: string
        subcategory:
          anyOf:
          - $ref: '#/components/schemas/CategoryRef'
          - type: "null"
        tags:
          description: |-
            Tags are the editorial SHELVES this event sits on — what puts it on a hub
            page. Many-to-many and deliberately not taxonomic: "Wimbledon" collects the
            men's winner race, the women's winner race and every match, which share no
            series and no outcome structure. Always present (possibly empty) so the
            frontend need not nil-check.
          items:
            $ref: '#/components/schemas/TagRef'
          type: array
          uniqueItems: false
        taker_fee_rate_bps_override:
          description: |-
            TakerFeeRateBpsOverride mirrors events.taker_fee_rate_bps_override
            (NULL = inherit from category default, or global default if no category row).
            Persisted to the DB; included in JSON for admin consumers.
          example: 200
          type:
          - integer
          - "null"
        title:
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type: string
        total_volume:
          description: |-
            Every contract the event's markets have ever traded. Null when nothing
            has, so a consumer can tell "never traded" from "quiet today" — which
            total_volume_24h alone cannot say.
          example: "15000.25"
          type:
          - string
          - "null"
        total_volume_24h:
          description: Contracts traded across the event's markets in the last 24h.
          example: "1500.25"
          type: string
      type: object
    EnrichedMarket:
      properties:
        amount_precision:
          example: 2
          type:
          - integer
          - "null"
        category:
          example: crypto
          type: string
        change_24h:
          description: |-
            24h change of the last price as a signed fraction ("0.0833" is +8.33%).
            Null when there is no opening price to measure from.
          example: "0.0833"
          type:
          - string
          - "null"
        close_at:
          example: "2026-07-22T18:00:00Z"
          type:
          - string
          - "null"
        description:
          example: Resolves YES if the Coinbase BTC-USD close on 31 Dec 2026 is above
            $70,000.
          type:
          - string
          - "null"
        determination_at:
          description: |-
            DeterminationAt is when the outcome is EXPECTED to become knowable —
            distinct from close, which is only when trading stops.

            Published so a member is told the gap in advance. Kalshi's daily-high
            temperature markets settle 6–7 hours after close because the authoritative
            report lands hours after the weather; without this field that reads as a
            stuck market rather than a documented wait.

            Null when the outcome is expected at close.
          example: "2026-07-23T10:00:00Z"
          type:
          - string
          - "null"
        event_id:
          example: 12345
          type:
          - integer
          - "null"
        event_rank:
          description: |-
            EventRank is the operator's manual ordering of this market WITHIN its
            event (`markets.event_rank`), ascending. nil = unranked. It exists because
            the natural order of a ladder is not derivable from price: a date ladder
            reads chronologically, a strike ladder by strike, and neither matches
            probability order. When no market in an event carries a rank, the default
            sort falls back to probability descending — the right answer for
            candidate-style events.
          example: 1
          type:
          - integer
          - "null"
        event_slug:
          description: |-
            EventSlug / EventTitle are the market's event context, denormalised onto the
            market itself.

            A market is not addressable on its own — there is no markets.slug column, and the
            app routes /event/{slug}?market={id} — so without these a client holding a market
            from the flat /markets list cannot build a link or name what it belongs to, and
            has to go back for the event.

            Carried even when the market is already nested inside its event (where it is
            strictly redundant) so a market object means the same thing wherever it is found.
            A caller that pulls one out of an event payload and passes it on must not end up
            with something that has quietly lost its context.

            EventID is the durable key; the slug is editable and is for display and routing.
          example: btc-above-70k-december-2026
          type:
          - string
          - "null"
        event_title:
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type:
          - string
          - "null"
        group_item_title:
          description: |-
            GroupItemTitle (markets.group_item_title) is this market's short label
            WITHIN its event — "Atlanta Hawks", "O/U 2.5". nil means the frontend
            derives one from the title, which is why an unlabelled contender list
            currently reads "Will Abiy Ahmed be the next Prime Min…".
          example: Above $70,000
          type:
          - string
          - "null"
        id:
          example: 54321
          type: integer
        image_url:
          example: https://cdn.calibri.io/markets/btc-70k.png
          type:
          - string
          - "null"
        last_price:
          description: From the 24h ticker; null when the market has no ticker.
          example: "0.61"
          type:
          - string
          - "null"
        liquidity_reward:
          anyOf:
          - $ref: '#/components/schemas/LiquidityReward'
          - type: "null"
        max_price:
          example: "0.99"
          type:
          - string
          - "null"
        min_amount:
          example: "1"
          type:
          - string
          - "null"
        min_price:
          example: "0.01"
          type:
          - string
          - "null"
        no_price:
          example: "0.38"
          type:
          - string
          - "null"
        no_token_id:
          example: "9876543210987654321098765432109876543210"
          type:
          - string
          - "null"
        open_at:
          example: "2026-07-21T10:00:00Z"
          type:
          - string
          - "null"
        open_interest:
          description: |-
            Outstanding complete YES/NO sets — see readOpenInterest. Attached after
            paging, so only the markets a response actually carries are read. Null
            when it cannot be read.
          example: "1250"
          type:
          - string
          - "null"
        outcome_labels:
          description: |-
            OutcomeLabels are the display names of this market's two legs, index 0 the
            YES leg and index 1 the NO leg, with the ["Yes","No"] default already
            applied — consumers never have to handle NULL. Naming them turns a
            proposition into a head-to-head, so the chart draws two labelled lines
            instead of one and the buy buttons carry the contestant's name.

            DISPLAY ONLY. The canonical resolution leg is still YES/NO: settlement,
            the CTF condition and every ledger row are untouched by a relabel.
          items:
            type: string
          type: array
          uniqueItems: false
        price_precision:
          description: |-
            The engine's trading config for the market, as /public/markets/{id}
            carries it, so an order can be built off the event payload. Null for a
            market the engine does not hold (settled, not yet open).
          example: 4
          type:
          - integer
          - "null"
        price_settlement:
          anyOf:
          - $ref: '#/components/schemas/PriceSettlement'
          - type: "null"
        price_target:
          anyOf:
          - $ref: '#/components/schemas/PriceTarget'
          - type: "null"
        quote_currency:
          example: usdc
          type: string
        resolution_source:
          example: Coinbase BTC-USD
          type:
          - string
          - "null"
        result:
          enum:
          - "yes"
          - "no"
          - void
          - null
          example: "yes"
          type:
          - string
          - "null"
        rules:
          example: Settles on the final Coinbase BTC-USD trade price before 23:59:59
            UTC.
          type:
          - string
          - "null"
        settlement_panel:
          anyOf:
          - $ref: '#/components/schemas/SettlementPanel'
          - type: "null"
        status:
          description: |-
            Status SHADOWS MarketMeta.Status (shallower field wins), so a nested
            market speaks the same public vocabulary as /public/markets: the raw
            aasm_state carries internal states publicMarketStatus exists to withhold.
          enum:
          - active
          - closed
          - determined
          - settled
          - cancelled
          - voided
          example: active
          type: string
        terms:
          anyOf:
          - $ref: '#/components/schemas/MarketTerms'
          - type: "null"
        title:
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type: string
        volume:
          description: |-
            Lifetime contract volume for this market. Same unit as volume_24h —
            contracts. Null when the market has never traded.
          example: "15000.25"
          type:
          - string
          - "null"
        volume_24h:
          example: "1500.25"
          type:
          - string
          - "null"
        yes_price:
          description: |-
            YES / NO probability from the live book mid, else the last trade. Null
            when the market has neither.
          example: "0.62"
          type:
          - string
          - "null"
        yes_token_id:
          description: |-
            YesTokenID / NoTokenID are the on-chain ERC-1155 position ids for this
            market's two legs, once atlas has registered the condition. nil (null)
            until then, because a market that is not CTF-registered has no tokens — emitting
            "" would read as "registered with an empty id".

            Published because a token id IS the market-and-outcome identifier: it is derived
            from (resolver, questionId, collateral), so it names exactly one outcome of one
            market and never changes. A signed exchange order carries the token id and NO
            market field — the token id has already answered "which market, which outcome".

            Serving them here is what lets an API client build an order from the market it
            already fetched, rather than making a second authed per-market call for data that
            is public, immutable and identical for every member.
          example: "1234567890123456789012345678901234567890"
          type:
          - string
          - "null"
      type: object
    ErrorResponse:
      properties:
        errors:
          description: Match on the code, not the HTTP status or any human text.
          example:
          - order.not_found
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    EventBundle:
      properties:
        category:
          example: crypto
          type: string
        created_at:
          description: |-
            CreatedAt (RFC3339, from events.created_at) backs the "newest" list sort.
            Before it was surfaced, "newest" fell back to id DESC.
          example: "2026-08-07T10:00:00Z"
          type:
          - string
          - "null"
        description:
          example: Resolves from the final Coinbase BTC-USD trade price before the
            close date.
          type:
          - string
          - "null"
        display_type:
          description: |-
            DisplayType (events.display_type) picks the chart SOURCE, not the market
            shape: "probability" (default) plots the markets' own YES probability,
            "price_feed" plots an underlying feed with a reference line.
          example: probability
          type: string
        effective_taker_fee_rate_bps:
          description: |-
            EffectiveTakerFeeRateBps is the resolved fee rate the matching engine
            will charge for trades in any of this event's markets. Computed at
            load time as: COALESCE(override, category default). NULL/nil means
            UNRESOLVED — no override and no fee_categories row for the category —
            which order placement rejects (distinct from a resolved 0 = free).
            Read-only — not persisted as its own column.
          example: 200
          type:
          - integer
          - "null"
        end_at:
          description: The earliest close_at across the event's markets. Null when
            none has one.
          example: "2026-12-31T00:00:00Z"
          type:
          - string
          - "null"
        featured:
          example: false
          type: boolean
        id:
          example: 12345
          type: integer
        image_url:
          example: https://cdn.calibri.io/events/btc-70k.png
          type:
          - string
          - "null"
        market_count:
          example: 2
          type: integer
        markets:
          items:
            $ref: '#/components/schemas/EventBundleMarket'
          type: array
          uniqueItems: false
        outcome_structure:
          description: |-
            OutcomeStructure (events.outcome_structure) says how this event's markets
            relate to one another. It selects the frontend layout and is deliberately
            NOT derivable from len(Markets) — a contender race, a strike ladder and a
            fixture's derivative bundle can all carry a dozen markets and none of them
            renders like the others.

              independent — one question, or several unrelated ones (the default)
              one_winner  — at most one market resolves YES; ranked, sums to ~100%
              ladder      — nested thresholds over one variable ("above $100k",
                            "above $110k"). Several legs resolve YES together so it is
                            not one_winner, but the legs are nested so it is not
                            independent either: prices fall monotonically down the
                            ladder, ordered by markets.event_rank.

            Kalshi carries the same three as MECNET / DIRECNET / none.

            Display + validation only. Neither Kalshi's collateral netting nor
            Polymarket's NegRiskAdapter is implemented on our side.
          example: independent
          type: string
        price_feed:
          anyOf:
          - $ref: '#/components/schemas/PriceFeed'
          - type: "null"
        series:
          anyOf:
          - $ref: '#/components/schemas/SeriesRef'
          - type: "null"
        series_window_count:
          description: |-
            How many windows of this rolling series are listed, this one included.
            Null for everything else.
          example: 12
          type:
          - integer
          - "null"
        slug:
          example: btc-above-70k-december-2026
          type: string
        status:
          description: The event's own lifecycle state (events.aasm_state).
          enum:
          - submitted
          - initialized
          - active
          - closed
          - resolving
          - settling
          - settled
          - canceled
          example: active
          type: string
        subcategory:
          anyOf:
          - $ref: '#/components/schemas/CategoryRef'
          - type: "null"
        tags:
          description: |-
            Tags are the editorial SHELVES this event sits on — what puts it on a hub
            page. Many-to-many and deliberately not taxonomic: "Wimbledon" collects the
            men's winner race, the women's winner race and every match, which share no
