        side:
          description: |-
            Side is the outcome token that changed hands on a transfer (a buyer
            meeting a holder who sells). Null on a mint or a merge, which move no
            single outcome, and on a transfer whose source did not record it.
          enum:
          - "yes"
          - "no"
          - null
          example: "yes"
          type:
          - string
          - "null"
        state:
          description: |-
            State is the fill's standing: active (market unresolved), settled_yes /
            settled_no, or voided — reversed off-chain after its on-chain settlement
            failed for good. Voided fills stay on the tape; filter on this field.
          enum:
          - active
          - settled_yes
          - settled_no
          - voided
          example: active
          type: string
        taker_side:
          description: |-
            TakerSide names the outcome the AGGRESSOR bought — the side that crossed
            the spread and paid the taker fee; on a fill whose taker SOLD it is the
            other outcome (selling YES is buying NO in price terms). It is what lets a
            tape be read as pressure rather than as a list of prices.

            Null means UNKNOWN, not "neither": a contract matched before the engine
            recorded a taker, or a row whose source does not carry it. Render those as
            unattributed rather than picking a side.
          enum:
          - "yes"
          - "no"
          - null
          example: "yes"
          type:
          - string
          - "null"
        volume:
          example: "25.5"
          type: string
      type: object
    SeriesCount:
      properties:
        event_count:
          example: 12
          type: integer
        frequency:
          description: |-
            How often the feed produces events. Carried because the browse feed has
            to tell a rolling series from a one-off: a five-minute feed publishes 288
            events a day and must appear ONCE, not 288 times.
          example: daily
          type:
          - string
          - "null"
        generated:
          description: |-
            Generated reports whether atlas's roller mints this series' events from a
            template (`series.roll_template` is set), rather than them being imported
            or hand-made.

            This is what says the events are the SAME QUESTION per window, and
            frequency cannot substitute for it. `seed-atp` and a daily crypto up/down
            feed are both `daily`; one publishes a different fixture each day and must
            be listed in full, the other asks "did BTC close up?" every day and must
            collapse to one card. Collapsing on frequency alone would bury the
            fixtures; not collapsing would show the same question six times.
          example: true
          type: boolean
        id:
          example: 789
          type: integer
        slug:
          example: daily-btc-close
          type: string
        title:
          example: Daily BTC Close
          type: string
      type: object
    SlimEvent:
      properties:
        category:
          example: crypto
