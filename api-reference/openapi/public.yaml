components:
  schemas:
    ActivityItem:
      properties:
        amount:
          example: 250.5
          type: number
        created_at:
          example: "2026-08-07T10:05:30Z"
          type: string
        currency:
          example: usdc
          type: string
        description:
          example: Bought 250 YES at 0.62
          type: string
        event_slug:
          example: will-btc-reach-70k
          type: string
        id:
          example: trade-1420
          type: string
        market_id:
          example: "12"
          type: string
        side:
          example: "yes"
          type: string
        title:
          example: BTC crosses $65,000
          type: string
        type:
          example: trade
          type: string
      type: object
    AssetCandlesResponse:
      properties:
        candles:
          items:
            $ref: '#/components/schemas/CandlePoint'
          type: array
          uniqueItems: false
        granularity:
          example: 1m
          type: string
        has_more:
          example: true
          type: boolean
        next_to:
          description: |-
            NextTo is the cursor for the next page back; HasMore is false when the
            page came back short, meaning the recorded history starts here and the
            client should stop rather than fire requests into an empty past forever.
          example: 1722950399
          type: integer
        symbol:
          example: BTC-USD
          type: string
      type: object
    AssetPricesResponse:
      properties:
        complete:
          description: |-
            Complete says whether the range has finished or is still filling. A client
            drawing a live window uses it to decide whether to also open a
            subscription; without it, it has to re-derive the clock comparison we
            just did.
          example: true
          type: boolean
        from:
          example: 1722950100
          type: integer
        points:
          items:
            $ref: '#/components/schemas/PricePoint'
          type: array
          uniqueItems: false
        symbol:
          example: BTC-USD
          type: string
        to:
          example: 1722950400
          type: integer
      type: object
    AssetSymbolsResponse:
      properties:
        symbols:
          description: Coinbase product ids with recorded tick/candle history.
          example:
            - BTC-USD
            - ETH-USD
            - SOL-USD
          items:
            type: string
            example: BTC-USD
          type: array
          uniqueItems: false
      example:
        symbols:
          - BTC-USD
          - ETH-USD
          - SOL-USD
      type: object
    AssetWindowResponse:
      properties:
        close:
          example: 65400.5
          type: number
        complete:
          description: 'Complete: the window is over BY THE CLOCK.'
          example: true
          type: boolean
        confirmed:
          description: |-
            Confirmed: the candle we hold was read AFTER its bucket closed, so it can
            no longer change. Distinct from Complete, and the distinction is the whole
            point — for the seconds between a window closing and the poller re-reading
            it, the clock says finished while the stored close is still a
            mid-formation value. Showing that as final would mean showing a number
            that then moves, on the one figure that decides whether a member won.
          example: true
          type: boolean
        granularity_seconds:
          example: 300
          type: integer
        high:
          example: 65450.75
          type: number
        low:
          example: 65300.5
          type: number
        open:
          description: |-
            Pointers, because present-but-empty is a real state: the poller has not
            read this bucket yet, which is normal in the first seconds of a window.
            Omitted rather than zeroed so a client shows a placeholder instead of
            drawing a $0.00 open.
          example: 65380.25
          type: number
        symbol:
          example: BTC-USD
          type: string
        window_end:
          example: 1722950700
          type: integer
        window_start:
          example: 1722950400
          type: integer
      type: object
    BookLevel:
      properties:
        price:
          example: "0.62"
          type: string
        side:
          enum:
          - "yes"
          - "no"
          example: "yes"
          type: string
        volume:
          example: "100.50"
          type: string
      type: object
    CandlePoint:
      properties:
        c:
          example: 65400.5
          type: number
        h:
          example: 65450.75
          type: number
        l:
          example: 65300.5
          type: number
        o:
          example: 65380.25
          type: number
        t:
          example: 1722950400
          type: integer
        v:
          example: 245.8
          type: number
      type: object
    DepthResponse:
      properties:
        asks:
          items:
            items:
              type: string
            type: array
          type: array
          uniqueItems: false
        bids:
          items:
            items:
              type: string
            type: array
          type: array
          uniqueItems: false
        timestamp:
          description: Unix seconds.
          example: 1723033200
          type: integer
      type: object
    ErrorResponse:
      properties:
        errors:
          description: Match on the code, not the HTTP status or any human text.
          example:
          - order.not_found
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    LeaderboardEntry:
      properties:
        contracts:
          example: 30
          type: integer
        currency:
          example: usdc
          type: string
        rank:
          example: 1
          type: integer
        total_pnl:
          example: 4500.75
          type: number
        trades:
          example: 45
          type: integer
        uid:
          example: ID1A2B3C4D5E
          type: string
        username:
          example: alice***
          type: string
        win_rate:
          example: 0.7333
          type: number
        wins:
          example: 22
          type: integer
      type: object
    MarketPayload:
      properties:
        amount_precision:
          example: 2
          type: integer
        base_unit:
          example: BTCUSD
          type: string
        category:
          example: crypto
          type: string
        close_at:
          example: "2026-07-22T18:00:00Z"
          type: string
        ctf_no_token_id:
          example: "9876543210987654321098765432109876543210"
          type: string
        ctf_yes_token_id:
          description: |-
            CTFYesTokenID / CTFNoTokenID are the on-chain ERC-1155 position ids for this
            market's two legs, once atlas has registered the condition. nil (and omitted)
            until then, because a market that is not CTF-registered has no tokens — emitting
            "" would read as "registered with an empty id".

            Published because a token id IS the market-and-outcome identifier: it is derived
            from (resolver, questionId, collateral), so it names exactly one outcome of one
            market and never changes. A signed exchange order carries the token id and NO
            market field — the token id has already answered "which market, which outcome".

            Serving them here is what lets an API client build an order from the market it
            already fetched, rather than making a second authed per-market call for data that
            is public, immutable and identical for every member.
          example: "1234567890123456789012345678901234567890"
          type: string
        description:
          example: Resolves YES if the Coinbase BTC-USD close on 31 Dec 2026 is above
            $70,000.
          type: string
        determination_at:
          description: |-
            DeterminationAt is when the outcome is EXPECTED to become knowable —
            distinct from close, which is only when trading stops.

            Published so a member is told the gap in advance. Kalshi's daily-high
            temperature markets settle 6–7 hours after close because the authoritative
            report lands hours after the weather; without this field that reads as a
            stuck market rather than a documented wait.

            Omitted when the outcome is expected at close.
          example: "2026-07-23T10:00:00Z"
          type: string
        event_id:
          example: 12345
          type: integer
        event_rank:
          description: |-
            EventRank is the operator's manual ordering of this market WITHIN its
            event (`markets.event_rank`), ascending. nil = unranked. It exists because
            the natural order of a ladder is not derivable from price: a date ladder
            reads chronologically, a strike ladder by strike, and neither matches
            probability order. When no market in an event carries a rank, the default
            sort falls back to probability descending — the right answer for
            candidate-style events.
          example: 1
          type: integer
        event_slug:
          description: |-
            EventSlug / EventTitle are the market's event context, denormalised onto the
            market itself.

            A market is not addressable on its own — there is no markets.slug column, and the
            app routes /event/{slug}?market={id} — so without these a client holding a market
            from the flat /markets list cannot build a link or name what it belongs to, and
            has to go back for the event.

            Carried even when the market is already nested inside its event (where it is
            strictly redundant) so a market object means the same thing wherever it is found.
            A caller that pulls one out of an event payload and passes it on must not end up
            with something that has quietly lost its context.

            EventID is the durable key; the slug is editable and is for display and routing.
          example: btc-above-70k-december-2026
          type: string
        event_title:
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type: string
        group_item_title:
          description: |-
            GroupItemTitle (markets.group_item_title) is this market's short label
            WITHIN its event — "Atlanta Hawks", "O/U 2.5". nil means the frontend
            derives one from the title, which is why an unlabelled contender list
            currently reads "Will Abiy Ahmed be the next Prime Min…".
          example: Above $70,000
          type: string
        id:
          description: |-
            ID and Status SHADOW the embedded fields of the same json name. The
            encoder resolves a tag conflict by depth — shallower wins — so these
            depth-0 fields are what get emitted.

            ID because MarketMeta.ID is an int64 while the engine keys on the string
            form, and clients key on the string.
          example: "12"
          type: string
        image_url:
          example: https://cdn.calibri.io/markets/btc-70k.png
          type: string
        market_id:
          description: the ID used in the markets/order book
          example: "54321"
          type: string
        max_price:
          example: "0.99"
          type: string
        min_amount:
          example: "1.00"
          type: string
        min_price:
          example: "0.01"
          type: string
        name:
          description: |-
            Trading parameters. Only the engine knows these, and only for markets it
            is currently trading — pointers so a settled market omits them rather
            than publishing zero values that read as real limits.
          example: Will BTC close above $70k on 2026-12-31?
          type: string
        open_at:
          example: "2026-07-21T10:00:00Z"
          type: string
        outcome_labels:
          description: |-
            OutcomeLabels are the display names of this market's two legs, index 0 the
            YES leg and index 1 the NO leg, with the ["Yes","No"] default already
            applied — consumers never have to handle NULL. Naming them turns a
            proposition into a head-to-head, so the chart draws two labelled lines
            instead of one and the buy buttons carry the contestant's name.

            DISPLAY ONLY. The canonical resolution leg is still YES/NO: settlement,
            the CTF condition and every ledger row are untouched by a relabel.
          items:
            type: string
          type: array
          uniqueItems: false
        price_precision:
          example: 4
          type: integer
        price_settlement:
          $ref: '#/components/schemas/PriceSettlement'
        quote_currency:
          example: usdc
          type: string
        quote_unit:
          example: usdc
          type: string
        resolution_source:
          example: Coinbase BTC-USD
          type: string
        result:
          example: "yes"
          type: string
        rules:
          example: Settles on the final Coinbase BTC-USD trade price before 23:59:59
            UTC.
          type: string
        settlement_panel:
          $ref: '#/components/schemas/SettlementPanel'
        status:
          description: "Status because the published vocabulary is narrower than the
            column.\n\t\t\t\tMarketMeta.Status is scanned straight from markets.aasm_state,
            which\ncarries internal states — `escalated` in particular announces to
            everyone\nholding a position that two reviewers disagreed. Emitting the
            embedded\nfield raw is precisely the leak publicMarketStatus exists to
            prevent, and\nshadowing is what makes that unmissable rather than a step
            someone can\nforget."
          enum:
          - active
          - closed
          - determined
          - settled
          - cancelled
          - voided
          example: active
          type: string
        title:
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type: string
      type: object
    MemberOrder:
      properties:
        contracts_count:
          example: 0
          type: integer
        created_at:
          example: "2026-08-07T10:00:00Z"
          type: string
        filled_volume:
          example: "0"
          type: string
        id:
          example: 1420
          type: integer
        locked:
          example: "6.20"
          type: string
        market:
          example: "12"
          type: string
        ord_type:
          enum:
          - limit
          - market
          example: limit
          type: string
        origin_locked:
          example: "6.20"
          type: string
        origin_volume:
          example: "10"
          type: string
        price:
          example: "0.62"
          type: string
        quote_currency:
          example: usdc
          type: string
        remaining_volume:
          example: "10"
          type: string
        side:
          enum:
          - "yes"
          - "no"
          example: "yes"
          type: string
        state:
          enum:
          - wait
          - done
          - cancel
          - reject
          example: wait
          type: string
        updated_at:
          example: "2026-08-07T10:05:00Z"
          type: string
        volume:
          example: "10"
          type: string
      type: object
    OrderBookResponse:
      properties:
        no_bids:
          items:
            $ref: '#/components/schemas/BookLevel'
          type: array
          uniqueItems: false
        yes_bids:
          items:
            $ref: '#/components/schemas/BookLevel'
          type: array
          uniqueItems: false
      type: object
    OrderCancelResult:
      properties:
        id:
          example: 1420
          type: integer
        state:
          enum:
          - cancel
          example: cancel
          type: string
      type: object
    PricePoint:
      properties:
        p:
          example: 65400.5
          type: number
        t:
          example: 1722950400
          type: integer
      type: object
    PublicContract:
      properties:
        created_at:
          description: When the contract matched. RFC3339 UTC.
          example: "2026-08-07T10:00:00Z"
          type: string
        id:
          example: 1420
          type: integer
        market_id:
          example: "12"
          type: string
        price:
          example: "0.62"
          type: string
        state:
          enum:
          - active
          - settled_yes
          - settled_no
          example: active
          type: string
        volume:
          example: "25.5"
          type: string
      type: object
    SeriesCount:
      properties:
        event_count:
          example: 12
          type: integer
        frequency:
          description: |-
            How often the feed produces events. Carried because the browse feed has
            to tell a rolling series from a one-off: a five-minute feed publishes 288
            events a day and must appear ONCE, not 288 times.
          example: daily
          type: string
        generated:
          description: |-
            Generated reports whether atlas's roller mints this series' events from a
            template (`series.roll_template` is set), rather than them being imported
            or hand-made.

            This is what says the events are the SAME QUESTION per window, and
            frequency cannot substitute for it. `seed-atp` and a daily crypto up/down
            feed are both `daily`; one publishes a different fixture each day and must
            be listed in full, the other asks "did BTC close up?" every day and must
            collapse to one card. Collapsing on frequency alone would bury the
            fixtures; not collapsing would show the same question six times.
          example: true
          type: boolean
        id:
          example: 789
          type: integer
        slug:
          example: daily-btc-close
          type: string
        title:
          example: Daily BTC Close
          type: string
      type: object
    TagCount:
      properties:
        event_count:
          example: 42
          type: integer
        id:
          example: 111
          type: integer
        label:
          example: Wimbledon
          type: string
        slug:
          example: wimbledon
          type: string
      type: object
    TickerEntry:
      properties:
        amount:
          example: "900.50"
          type: string
        avg_price:
          example: "0.60"
          type: string
        buy:
          example: "0.58"
          type: string
        high:
          example: "0.72"
          type: string
        last:
          example: "0.62"
          type: string
        low:
          example: "0.55"
          type: string
        open:
          example: "0.60"
          type: string
        price_change_percent:
          example: +3.33%
          type: string
        sell:
          example: "0.68"
          type: string
        vol:
          example: "1500.25"
          type: string
      type: object
    TickerResponse:
      properties:
        at:
          description: Unix seconds.
          example: 1723033200
          type: integer
        ticker:
          $ref: '#/components/schemas/TickerEntry'
      type: object
    Event:
      properties:
        category:
          example: crypto
          type: string
        created_at:
          description: |-
            CreatedAt (RFC3339, from events.created_at) backs the "newest" list sort.
            Before it was surfaced, "newest" fell back to id DESC.
          example: "2026-08-07T10:00:00Z"
          type: string
        description:
          example: Resolves from the final Coinbase BTC-USD trade price before the
            close date.
          type: string
        display_type:
          description: |-
            DisplayType (events.display_type) picks the chart SOURCE, not the market
            shape: "probability" (default) plots the markets' own YES probability,
            "price_feed" plots an underlying feed with a reference line.
          example: probability
          type: string
        effective_taker_fee_rate_bps:
          description: |-
            EffectiveTakerFeeRateBps is the resolved fee rate the matching engine
            will charge for trades in any of this event's markets. Computed at
            load time as: COALESCE(override, category default). NULL/nil means
            UNRESOLVED — no override and no fee_categories row for the category —
            which order placement rejects (distinct from a resolved 0 = free).
            Read-only — not persisted as its own column.
          example: 200
          type: integer
        featured:
          example: false
          type: boolean
        id:
          example: 12345
          type: integer
        image_url:
          example: https://cdn.calibri.io/events/btc-70k.png
          type: string
        markets:
          items:
            $ref: '#/components/schemas/MarketMeta'
          type: array
          uniqueItems: false
        outcome_structure:
          description: |-
            OutcomeStructure (events.outcome_structure) says how this event's markets
            relate to one another. It selects the frontend layout and is deliberately
            NOT derivable from len(Markets) — a contender race, a strike ladder and a
            fixture's derivative bundle can all carry a dozen markets and none of them
            renders like the others.

              independent — one question, or several unrelated ones (the default)
              one_winner  — at most one market resolves YES; ranked, sums to ~100%
              ladder      — nested thresholds over one variable ("above $100k",
                            "above $110k"). Several legs resolve YES together so it is
                            not one_winner, but the legs are nested so it is not
                            independent either: prices fall monotonically down the
                            ladder, ordered by markets.event_rank.

            Kalshi carries the same three as MECNET / DIRECNET / none.

            Display + validation only. Neither Kalshi's collateral netting nor
            Polymarket's NegRiskAdapter is implemented on our side.
          example: independent
          type: string
        price_feed:
          description: |-
            PriceFeed (events.price_feed) carries {source, symbol, reference_price}
            for the price_feed layout. Passed through opaquely — pythia never
            interprets it. nil when unset.
          items:
            type: integer
          type: array
          uniqueItems: false
        series:
          $ref: '#/components/schemas/SeriesRef'
        slug:
          example: btc-above-70k-december-2026
          type: string
        status:
          example: active
          type: string
        tags:
          description: |-
            Tags are the editorial SHELVES this event sits on — what puts it on a hub
            page. Many-to-many and deliberately not taxonomic: "Wimbledon" collects the
            men's winner race, the women's winner race and every match, which share no
            series and no outcome structure. Always present (possibly empty) so the
            frontend need not nil-check.
          items:
            $ref: '#/components/schemas/TagRef'
          type: array
          uniqueItems: false
        taker_fee_rate_bps_override:
          description: |-
            TakerFeeRateBpsOverride mirrors events.taker_fee_rate_bps_override
            (NULL = inherit from category default, or global default if no category row).
            Persisted to the DB; included in JSON for admin consumers.
          example: 200
          type: integer
        title:
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type: string
      type: object
    MarketMeta:
