    MemberOrder:
      properties:
        avg_price:
          description: |-
            AvgPrice is the average price of the filled part, in the ORDER'S OWN
            outcome price space (a NO order's fills read as NO prices, not the YES book
            price). Null while nothing has filled.
          example: "0.61"
          type:
          - string
          - "null"
        client_order_id:
          description: ClientOrderID is the id the caller chose at placement; null
            when none was.
          example: bot-7f3a-0001
          type:
          - string
          - "null"
        contracts_count:
          example: 0
          type: integer
        created_at:
          description: Timestamps are RFC3339 in UTC (`Z`), from either source.
          example: "2026-08-07T10:00:00Z"
          type: string
        direction:
          description: |-
            Direction is whether the order acquires the outcome named by `side` (buy)
            or disposes of held outcome tokens (sell, a position exit). `side` alone
            cannot tell a `sell yes` from a `buy yes`.
          enum:
          - buy
          - sell
          example: buy
          type: string
        event_slug:
          example: btc-above-70k-december-2026
          type:
          - string
          - "null"
        expires_at:
          description: |-
            ExpiresAt is when the order's authorisation lapses (a signed order's
            EIP-712 expiration), RFC3339 UTC; null when it has none. The engine never
            matches an order inside 30 seconds of it and cancels a resting one then.
          example: "2026-08-07T11:00:00Z"
          type:
          - string
          - "null"
        fee:
          description: |-
            Fee is the taker fee charged to this order so far ("0" when none — a maker
            is never charged). In quote_currency.
          example: "0.04"
          type: string
        filled_cost:
          description: |-
            FilledCost is the cash for the filled part at the fill prices: paid, on a
            buy; received before fees, on a sell. Excludes the taker fee, which is
            `fee`. "0" while nothing has filled; null only if it cannot be determined.
          example: "3.05"
          type:
          - string
          - "null"
        filled_volume:
          example: "0"
          type: string
        id:
          example: 1420
          type: integer
        ioc:
          description: |-
            IOC: immediate-or-cancel — the unfilled remainder after the order's one
            pass as a taker is refunded, never rested.
          example: false
          type: boolean
        locked:
          example: "6.20"
          type: string
        market_id:
          example: 12
          type: integer
        market_title:
          description: |-
            MarketTitle / EventSlug are the order's market context, denormalised onto
            the order the same way EventSlug/EventTitle are denormalised onto a market.

            Without them `market_id` is a bare id and nothing else: a client listing a
            member's orders can only print "3573", and has no slug to link with (a
            market is not addressable on its own — the app routes
            /event/{slug}?market={id}). The only alternative is a market read per row,
            which is a fan-out over a paginated list for data this handler already
            holds in memory.

            Null when the market's metadata is unknown here (an id that is in
            neither the cache nor storage); the row still carries `market_id`.
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type:
          - string
          - "null"
        ord_type:
          enum:
          - limit
          - market
          example: limit
          type: string
        origin_locked:
          example: "6.20"
          type: string
        origin_volume:
          example: "10"
          type: string
        post_only:
          description: |-
            PostOnly: the order could only rest as a maker; it was rejected rather
            than allowed to cross.
          example: false
          type: boolean
        price:
          example: "0.62"
          type: string
        quote_currency:
          example: usdc
          type: string
        remaining_volume:
          example: "10"
          type: string
        side:
          enum:
          - "yes"
          - "no"
          example: "yes"
          type: string
        state:
          enum:
          - wait
          - done
          - cancel
          - reject
          example: wait
          type: string
        token_id:
          description: |-
            TokenID is the on-chain ERC-1155 id of the outcome `side` names (the
            market's yes_token_id or no_token_id), so a client can match the
            order to the token it holds without a market read. Null when the market
            has no on-chain token, or its metadata is unknown here.
          example: "1234567890123456789012345678901234567890"
          type:
          - string
          - "null"
        updated_at:
          example: "2026-08-07T10:05:00Z"
          type: string
        volume:
          example: "10"
          type: string
      type: object
