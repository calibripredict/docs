        title:
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type: string
        total_volume:
          example: "15000.25"
          type:
          - string
          - "null"
        total_volume_24h:
          example: "1500.25"
          type: string
      type: object
    SlimMarket:
      properties:
        change_24h:
          example: "0.0333"
          type:
          - string
          - "null"
        close_at:
          example: "2026-07-22T18:00:00Z"
          type:
          - string
          - "null"
        group_item_title:
          description: |-
            The operator's short label for a market of a multi-outcome event, its
            lifetime volume, and a threshold market's level — all read by the cards
            and the ticket.
          example: Above $70,000
          type:
          - string
          - "null"
        id:
          example: 54321
          type: integer
        last_price:
          example: "0.61"
          type:
          - string
          - "null"
        liquidity_reward:
          anyOf:
          - $ref: '#/components/schemas/LiquidityReward'
          - type: "null"
        open_at:
          example: "2026-07-21T10:00:00Z"
          type:
          - string
          - "null"
        outcome_labels:
          items:
            type: string
          type: array
          uniqueItems: false
        price_precision:
          example: 4
          type:
          - integer
          - "null"
        price_target:
          anyOf:
          - $ref: '#/components/schemas/PriceTarget'
          - type: "null"
        quote_currency:
          example: usdc
          type: string
        result:
          enum:
          - "yes"
          - "no"
          - void
          - null
          example: "yes"
          type:
          - string
          - "null"
        status:
          enum:
          - active
          - closed
          - determined
          - settled
          - cancelled
          - voided
          example: active
          type: string
        title:
          example: Will BTC close above $70,000 on 31 Dec 2026?
          type: string
        volume:
          example: "15000.25"
          type:
          - string
          - "null"
        volume_24h:
          example: "1500.25"
          type:
          - string
          - "null"
        yes_price:
          example: "0.62"
          type:
          - string
          - "null"
      type: object
    TagCount:
      properties:
        event_count:
          example: 42
          type: integer
        id:
          example: 111
          type: integer
        label:
          example: Wimbledon
          type: string
        slug:
          example: wimbledon
          type: string
      type: object
    TickerEntry:
      properties:
        avg_price:
          example: "0.6"
          type: string
        buy:
          example: "0.58"
          type:
          - string
          - "null"
        buy_volume:
          example: "120"
          type:
          - string
          - "null"
        change_24h:
          description: |-
            The 24h move of `last` against `open` as a signed fraction: "0.0333" is
            +3.33%. Null when there is no open price.
          example: "0.0333"
          type:
          - string
          - "null"
        high:
          example: "0.72"
          type: string
        last:
          example: "0.62"
          type: string
        low:
          example: "0.55"
          type: string
        open:
          example: "0.6"
          type: string
        quote_volume:
          description: Quote currency traded in the last 24h.
          example: "900.5"
          type: string
        sell:
          example: "0.68"
          type:
          - string
          - "null"
        sell_volume:
          example: "75.5"
          type:
          - string
          - "null"
        volume:
          description: Contracts traded in the last 24h.
          example: "1500.25"
          type: string
      type: object
    TickerResponse:
      properties:
        ticker:
          $ref: '#/components/schemas/TickerEntry'
        timestamp:
          description: Unix seconds.
          example: 1723033200
          type: integer
      type: object
    CategoryNode:
      properties:
        children:
          description: |-
            Present on top-level nodes; always non-nil so a client can range without
            a nil check.
          items:
            $ref: '#/components/schemas/CategoryNode'
          type: array
          uniqueItems: false
        event_count:
          description: |-
            Active events beneath this node, counted the way the FEED counts them: a
            rolling series contributes ONE, not one per window. For a parent it
            includes its children's, because that is what the number beside a browse
            chip means.

            Counted from the same events the feed serves rather than from the database,
            so the two cannot disagree. Counting rows made the Crypto chip read 27 and
            open onto 4 cards — the feed collapses a five-minute series to the single
            window a member can act on, and a count that ignores that is a promise the
            page does not keep.
          example: 492
          type: integer
        frequencies:
          description: |-
            Cadence facets within this node, present ones only, already ordered
            shortest-first. The browse sidebar is built from these.
          items:
            $ref: '#/components/schemas/FacetCount'
          type: array
          uniqueItems: false
        icon:
          example: SportsSoccer
          type: string
        id:
          example: 10
          type: integer
        label:
          example: Sports
          type: string
        slug:
          example: sports
          type: string
      type: object
    CategoryParentRef:
      description: The top-level node this sits under. Null on a top-level node itself.
      properties:
        icon:
          example: SportsSoccer
          type:
          - string
          - "null"
        id:
          example: 10
          type: integer
        label:
          example: Sports
          type: string
        slug:
          example: sports
          type: string
      type: object
    CategoryRef:
      description: |-
        Subcategory is the browse SUBJECT — the leaf of the two-level category
        tree, carrying its parent for a breadcrumb. Exactly one per event and
        often absent, because an event may sit directly under its top-level
        category.

        Not a replacement for Category above: that stays the fee key. This is what
        the browse chips and the /categories drilldown are built from.
      properties:
        icon:
          description: |-
            Icon KEY the frontends map, not an icon. Replaces their hardcoded maps,
            which could not be extended without a deploy.
          example: SportsSoccer
          type:
          - string
          - "null"
        id:
          example: 15
          type: integer
        label:
          example: Soccer
          type: string
        parent:
          anyOf:
          - $ref: '#/components/schemas/CategoryParentRef'
          - type: "null"
        slug:
          example: soccer
          type: string
      type: object
    FacetCount:
      properties:
        event_count:
          example: 8
          type: integer
        label:
          description: Display form, because "five_min" is not what a member reads.
          example: 5 Min
          type: string
        value:
          description: The filter value, as ?frequency= takes it.
          example: five_min
          type: string
      type: object
    LiquidityReward:
      description: |-
        LiquidityReward is what the market pays makers for resting orders today
        (UTC). Null when no reward period covers today.
      properties:
        currency:
          example: usdc
          type: string
        daily_rate:
          description: The daily pool, summed across every period covering today.
          example: "3"
          type: string
        max_spread:
          description: |-
            The widest distance from the midpoint, in probability units, at which a
            resting order still earns.
          example: "0.045"
          type: string
        min_size:
          description: The smallest resting size, in contracts, that earns.
          example: "20"
          type: string
      type: object
    MarketTerms:
      description: |-
        Terms is what this market resolves against, as structured fields — the
        conditions `rules` states in prose: kind, strike_type, floor_strike /
        cap_strike, underlying, measure (instant, granularity, basis) and settles_on.

        `rules` is for a person and free to change its wording; terms are what code
        reads, so an integrator never parses a title to learn the strike. Kalshi
        publishes the same thing as strike_type / floor_strike / cap_strike.

        Stored by atlas (`markets.terms`, derived from the resolution source and its
        params — atlas owns that derivation) and decoded here only so the published
        schema names every field. Null for a market with no automated source.
      properties:
        cap_strike:
          example: "77500"
          type:
          - string
          - "null"
        floor_strike:
          description: |-
            Decimal strings; null when not applicable. A band is half-open: inclusive
            floor, exclusive cap.
          example: "70000"
          type:
          - string
          - "null"
        kind:
          description: threshold | range | direction | categorical
          example: threshold
          type: string
        measure:
          anyOf:
          - $ref: '#/components/schemas/TermsMeasure'
          - type: "null"
        settles_on:
          description: The resolution provider that settles the market, e.g. coinbase_spot.
          example: coinbase_spot
          type: string
        strike_type:
          description: greater | greater_equal | less | less_equal | between | direction
            | none
          example: greater_equal
          type: string
        underlying:
          anyOf:
          - $ref: '#/components/schemas/TermsUnderlying'
          - type: "null"
      type: object
    PriceFeed:
      description: |-
        PriceFeed (events.price_feed) is the underlying feed a price_feed event
        charts: {symbol, window_start, granularity_seconds}. Null when unset.
      properties:
        granularity_seconds:
          description: Candle granularity the chart and the reference line use.
          example: 300
          type: integer
        symbol:
          description: Exchange product id, e.g. "BTC-USD".
          example: BTC-USD
          type: string
        window_start:
          description: When the event's window opens. RFC 3339 UTC, whole seconds.
          example: "2026-10-19T06:35:00Z"
          type: string
      type: object
    PriceSettlement:
      description: |-
        PriceSettlement is the pair of numbers that decided a price-feed market:
        the deciding candle's open and close.

        Published so a settled window can show what happened — price to beat,
        final price, the difference, and which way it went — WITHOUT reading the
        asset price history. That independence is the point: history is recorded
        best-effort over a websocket, so a gap in it must degrade the chart and
        not the answer. These numbers came from the exchange candle that actually
        settled the market.

        nil for anything not settled from a candle.
      properties:
        candle_start:
          description: |-
            The deciding candle's opening instant, ISO-8601 UTC. Reproducible: anyone
            can re-request this exact candle and get these exact numbers.
          example: "2026-07-22T18:00:00Z"
          type: string
        close:
          example: "69200.5"
          type: string
        granularity_seconds:
          example: 300
          type: integer
        open:
          description: The price to beat and the deciding close, as decimal strings.
          example: "68500.75"
          type: string
        symbol:
          description: Coinbase product id, e.g. "BTC-USD".
          example: BTC-USD
          type: string
        tie:
          description: |-
            True when close == open exactly, which at five-minute granularity on a
            quiet market is a real outcome rather than a rounding artefact. Published
            because the rule that breaks it (ties resolve up) is otherwise invisible
            on the one market where it decided the answer.
          example: false
          type: boolean
      type: object
    PriceTarget:
      description: |-
        PriceTarget is the level this market is judged against, published BEFORE
        it settles.

        The sibling of PriceSettlement and deliberately not the same thing.
        PriceSettlement is what happened and exists only once a market is decided;
        this is the question, and it is known the moment the market is listed. A
        strike ladder needs it: every rung shares one underlying price chart and
        differs only in where its line sits, so without this the front end has a
        chart and no idea what to draw on it.

        nil for anything not judged against a fixed level — an up/down window's
        reference is its own opening price, which is PriceSettlement's business.
      properties:
        cap_strike:
          example: "77500"
          type:
          - string
          - "null"
        comparator:
          description: |-
            How the close is compared to it: gte, gt, lte or lt. Published because
            "above $77,000" and "at or above $77,000" are different markets on a tie,
            and the chart's own label should not have to guess which one this is.
          enum:
          - gte
          - gt
          - lte
          - lt
          - null
          example: gte
          type:
          - string
          - "null"
        floor_strike:
          description: |-
            Band form, half-open [floor, cap): inclusive floor, exclusive cap. That
            convention is not a detail — it is what lets a set of bands cover the
            price line exactly once, with no gap for a close to fall through and no
            overlap where two legs both pay.

            Either bound is absent on a wing: a bottom band has only a cap, a top
            band only a floor. Decimal strings, null when absent, so "no floor" and "a
            floor of zero" stay distinguishable on the wire.
          example: "75000"
          type:
          - string
          - "null"
        threshold:
          description: |-
            Threshold form. The level the close is compared against, in the market's
            quote currency, as a decimal string. Null on a band.
          example: "77000"
          type:
          - string
          - "null"
      type: object
    SeriesRef:
      description: |-
        Series is the FEED this event came from — Polymarket's `atp` / `mls-2025`,
        Kalshi's `series_ticker`. Usually absent: a one-off competition has no feed
        behind it, and Polymarket returns `series: []` on every Wimbledon event
        including the matches. Null when unset.
      properties:
        frequency:
          description: |-
            How often the feed produces events. Carried because the browse feed has
            to tell a rolling series from a one-off: a five-minute feed publishes 288
            events a day and must appear ONCE, not 288 times.
          example: daily
          type:
          - string
          - "null"
        generated:
          description: |-
            Generated reports whether atlas's roller mints this series' events from a
            template (`series.roll_template` is set), rather than them being imported
            or hand-made.

            This is what says the events are the SAME QUESTION per window, and
            frequency cannot substitute for it. `seed-atp` and a daily crypto up/down
            feed are both `daily`; one publishes a different fixture each day and must
            be listed in full, the other asks "did BTC close up?" every day and must
            collapse to one card. Collapsing on frequency alone would bury the
            fixtures; not collapsing would show the same question six times.
          example: true
          type: boolean
        id:
          example: 789
          type: integer
        slug:
          example: daily-btc-close
          type: string
        title:
          example: Daily BTC Close
          type: string
      type: object
    SettlementPanel:
      description: |-
        SettlementPanel is the PUBLISHED, ordered list of authorities this
        market's outcome may be determined from, resolved from the market's own
        override or inherited from its series.

        Carried on the public payload deliberately. The panel's whole value is
        that a member could read it BEFORE they traded — an unpublished rule is
        not the rule anyone agreed to, and a hierarchy that lives only in the
        admin tool cannot be quoted back at us in a dispute, which is the one
        situation it exists for.

        nil when no panel governs the market, which is the normal case for
        anything a machine settles.
      properties:
        description:
          description: |-
            How the panel is applied beyond the ordering — what happens when two
            sources disagree, and what happens when none has published.
          example: First consult these sources
          type:
          - string
          - "null"
        entries:
          description: |-
            Already ordered: primaries first, then fallbacks, each by rank. The order
            IS the content — it is what decides the outcome when two sources disagree.
          items:
            $ref: '#/components/schemas/SettlementSource'
          type: array
          uniqueItems: false
        id:
          example: 456
          type: integer
        inherited_from_series:
          description: True when the panel came from the series rather than the market
            itself.
          example: false
          type: boolean
        name:
          example: Primary Sources
          type: string
        terms_url:
          description: The rules page it is published on.
          example: https://calibri.io/hub/terms-of-use
          type:
          - string
          - "null"
      type: object
    SettlementSource:
      properties:
        name:
          example: Coinbase
          type: string
        tier:
          description: |-
            "primary" — consult first, a body that publishes the answer itself.
            "fallback" — only where no primary source has spoken.
          example: primary
          type: string
        url:
          example: https://www.coinbase.com/price/bitcoin
          type:
          - string
          - "null"
      type: object
    TagRef:
      properties:
        id:
          example: 111
          type: integer
        label:
          example: Wimbledon
          type: string
        slug:
          example: wimbledon
          type: string
      type: object
    TermsMeasure:
      properties:
        at:
          description: 'The instant that decides it: the deciding candle''s close,
            ISO-8601 UTC.'
          example: "2026-09-17T00:00:00Z"
          type: string
        basis:
          description: |-
            close | close_vs_previous_close (this window's close against the previous
            window's close; a tie resolves up)
          example: close
          type: string
        granularity_seconds:
          example: 60
          type: integer
        window_start:
          description: |-
            A direction market's window opens here; `at` is when it closes. Null
            for any other kind.
          example: "2026-09-16T16:00:00Z"
          type:
          - string
          - "null"
      type: object
    TermsUnderlying:
      properties:
        source:
          example: coinbase
          type: string
        symbol:
          example: BTC-USD
          type: string
      type: object
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Auth-Apikey
      description: HMAC-signed API key. Send X-Auth-Apikey, X-Auth-Nonce and X-Auth-Signature.
info:
  description: |-
    Market data and authenticated order management for Calibri prediction
    markets.

    Public routes need no authentication and send Cache-Control (15s on
    browse, 5s on live data, `immutable` on a closed asset range).
    Authenticated order routes use the same HMAC API key as Atlas.

    Open orders and cancel live here for both custodial and non-custodial
    members. Non-custodial *placement* is Atlas `POST /account/orders`
    (signed EIP-712); once resting, list and cancel are these endpoints.
  title: Calibri Markets & Orders
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v2/pythia/orders:
    get:
      description: |-
        Your prediction orders. Open (`wait`) rows come from the live
        engine index; terminal history (`done`, `cancel`, `reject`) from
        storage. Pass `state=wait` for the open-orders tab — that is what
        the product calls for resting orders, custodial and non-custodial
        alike. Placement path differs (Atlas signed-order vs this service's
        direct POST); list and cancel do not.

        Pagination: `page` / `limit` in, totals in the `Page` / `Per-Page` /
        `Total` response headers.
      parameters:
      - description: wait (open), done, cancel, reject
        in: query
        name: state
        schema:
          type: string
      - description: Market id
        in: query
        name: market_id
        schema:
          type: integer
      - description: limit or market
        in: query
        name: ord_type
        schema:
          type: string
      - description: 'Outcome filter: yes or no'
        in: query
        name: side
        schema:
          type: string
      - description: Your client_order_id. Without `state`, looks in open orders,
          then history
        in: query
        name: client_order_id
        schema:
          type: string
      - description: Lower bound, Unix SECONDS (not milliseconds)
        in: query
        name: time_from
        schema:
          type: integer
      - description: Upper bound, Unix SECONDS (not milliseconds)
        in: query
        name: time_to
        schema:
          type: integer
      - description: asc or desc (default desc)
        in: query
        name: order_by
        schema:
          type: string
      - description: Page (default 1)
        in: query
        name: page
        schema:
          type: integer
      - description: Rows per page, 1-100 (default 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MemberOrder'
                type: array
          description: OK
          headers:
            Page:
              schema:
                type: integer
            Per-Page:
              schema:
                type: integer
            Total:
              schema:
                type: integer
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
      - apiKey: []
      summary: Your orders
      tags:
      - Trade
  /api/v2/pythia/orders/{id}:
    get:
      description: |-
        One of your orders. Open orders resolve from the live index;
        terminal ones fall back to history. Returns 404 for another
        member's order rather than 403.
      parameters:
      - description: Order id
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberOrder'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      security:
      - apiKey: []
      summary: Order by id
      tags:
      - Trade
  /api/v2/pythia/orders/{id}/cancel:
    post:
      description: |-
        Cancels one of your open (`wait`) orders and refunds unmatched
        collateral. Same route for custodial and non-custodial resting
        orders — non-custodial placement is via Atlas; once resting, cancel
        is here. Terminal orders return 422.
      parameters:
      - description: Order id
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCancelResult'
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
      security:
      - apiKey: []
      summary: Cancel an order
      tags:
      - Trade
  /api/v2/pythia/orders/cancel:
    post:
      description: |-
        Cancels every open order you hold, optionally narrowed by market
        and outcome — on the query string, or as a JSON body
        `{"market_id": 12, "side": "yes"}` (a body field wins over the same
        query parameter). `orders` lists the orders cancelled, as `GET /orders`
        rows (state `cancel`); `failed` counts orders that could not be.
        Shares a per-member budget with order placement and single cancels
        (429 `market.order.rate_limited` over it).
      parameters:
      - description: Only orders in this market
        in: query
        name: market_id
        schema:
          type: integer
      - description: Only orders on this outcome (yes|no)
        in: query
        name: side
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/CancelAllRequest'
                description: The same filters as a JSON body
                summary: body
        description: The same filters as a JSON body
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAllResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      security:
      - apiKey: []
      summary: Cancel all own orders
      tags:
      - Trade
  /api/v2/pythia/public/activity:
    get:
      description: |-
        Recent platform activity across trades, settlements and newly
        activated markets, newest first. Filter with
        `type` (`trades`, `settlements`, `new_markets`); omit it for the
        combined feed.
      parameters:
      - description: trades, settlements or new_markets
        in: query
        name: type
        schema:
          type: string
      - description: Rows, 1-200 (default 50)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ActivityItem'
                type: array
          description: OK
      summary: Activity feed
      tags:
      - Community
  /api/v2/pythia/public/assets:
    get:
      description: |-
        Underlying symbols that have recorded tick/candle history
        (e.g. exchange products feeding candle-direction markets). Read
        this rather than hard-coding a product list that will go stale.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSymbolsResponse'
              example:
                symbols:
                  - BTC-USD
                  - ETH-USD
                  - SOL-USD
          description: OK
      summary: Asset symbols
      tags:
      - Assets
  /api/v2/pythia/public/assets/{symbol}/candles:
    get:
      description: |-
        The EXCHANGE'S OWN published candles, stored verbatim — not recomputed
        from sampled ticks. A candle derived from samples has systematically
        narrower wicks, and a member trading off the chart is paid off the
        exchange's candle, so the two have to be the same numbers by construction.

        Paged BACKWARD only: send the returned next_to as the new to.
      parameters:
      - description: Coinbase product id, e.g. BTC-USD
        in: path
        name: symbol
        required: true
        schema:
          type: string
      - description: 'A width the exchange publishes: 1m, 5m, 15m, 1h, 6h, 1d (default
          1m)'
        in: query
        name: granularity
        schema:
          type: string
      - description: Page cursor, Unix seconds. Defaults to now
        in: query
        name: to
        schema:
          type: integer
      - description: Candles per page, 1-1000 (default 300)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCandlesResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Asset candles
      tags:
      - Assets
  /api/v2/pythia/public/assets/{symbol}/prices:
    get:
      description: |-
        The recorded tick stream over a closed range, oldest first — the shape
        that draws one window. BOTH bounds are required: this endpoint draws a
        window, and a window has two ends.

        `t` is Unix seconds, matching the live websocket tick, so a historical
        fetch and a live subscription concatenate without a time conversion in
        the middle.
      parameters:
      - description: Coinbase product id, e.g. BTC-USD
        in: path
        name: symbol
        required: true
        schema:
          type: string
      - description: Range start, Unix seconds
        in: query
        name: from
        required: true
        schema:
          type: integer
      - description: Range end, Unix seconds. Must be after from
        in: query
        name: to
        required: true
        schema:
          type: integer
      - description: Max points, 1-5000 (default 5000)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPricesResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Asset ticks
      tags:
      - Assets
  /api/v2/pythia/public/assets/{symbol}/window:
    get:
      description: |-
        The exchange's own candle for ONE window — the price to beat, and the
        price so far. This is the figure a candle-direction market settles on.

        Two flags, and the distinction matters: `complete` means the window is
        over BY THE CLOCK; `confirmed` means the stored candle was read AFTER its
        bucket closed and can no longer change. In the seconds between, complete
        is true while close is still mid-formation — do not present an
        unconfirmed close as final.
      parameters:
      - description: Coinbase product id, e.g. BTC-USD
        in: path
        name: symbol
        required: true
        schema:
          type: string
      - description: Window opening instant, Unix seconds, on a granularity boundary
        in: query
        name: start
        required: true
        schema:
          type: integer
      - description: Window width in seconds (default 300)
        in: query
        name: granularity_seconds
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetWindowResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Asset window
      tags:
      - Assets
  /api/v2/pythia/public/categories:
    get:
      description: |-
        The two-level browse tree — Sports > Soccer — with active-event
        counts. A parent's count includes its children's.
        Includes categories with no live events; retired ones are omitted.
        Use a slug with `GET /public/events?category=` or `?subcategory=`.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryNode'
                type: array
          description: OK
      summary: List browse categories
      tags:
      - Categories
  /api/v2/pythia/public/events:
    get:
      description: |-
        The catalogue of events, each with its child markets.

        A generated or sub-daily series is COLLAPSED to a single entry — a
        five-minute feed publishes 288 events a day and must not fill the feed.
        Pass `series` to drill into one and get its individual windows, or
        `expand_series=true` to list every window of every series uncollapsed.

        `q` searches title, description, category, sub-category, tags and market
        titles (case-insensitive substring, 2+ characters). Collapsing still
        applies, but AFTER the search: a series is represented by its best
        MATCHING window, so a search naming one window returns that window.

        Pagination: `page` / `limit` in, `Page` / `Per-Page` / `Total` response
        headers out — the same headers as `/orders`. `Total` counts every
        matching event after collapsing; a page past the end is `[]`.
      parameters:
      - description: Search text, case-insensitive substring; under 2 characters is
          ignored
        in: query
        name: q
        schema:
          type: string
      - description: Filter by category
        in: query
        name: category
        schema:
          type: string
      - description: Filter by status. `resolved` covers determined and settled
        in: query
        name: status
        schema:
          type: string
      - description: Filter to one tag slug
        in: query
        name: tag
        schema:
          type: string
      - description: Filter to one series slug. Expands it rather than collapsing
        in: query
        name: series
        schema:
          type: string
      - description: Filter to one sub-category slug, e.g. tennis
        in: query
        name: subcategory
        schema:
          type: string
      - description: Filter by series cadence, e.g. daily / weekly / monthly
        in: query
        name: frequency
        schema:
          type: string
      - description: Sort order, e.g. newest
        in: query
        name: sort
        schema:
          type: string
      - description: Reverse the sort
        in: query
        name: reverse
        schema:
          type: boolean
      - description: Order of markets[] within each event
        in: query
        name: market_sort
        schema:
          type: string
      - description: List each window of a collapsed series as its own event
        in: query
        name: expand_series
        schema:
          type: boolean
      - description: Page size, 1-100 (default 100), applied after collapsing
        in: query
        name: limit
        schema:
          type: integer
      - description: Page, 1-based (default 1)
        in: query
        name: page
        schema:
          type: integer
      - description: '`slim` reduces each event and market to the card fields (see
          api.SlimEvent); anything else returns the full object'
        in: query
        name: fields
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  anyOf:
                  - $ref: '#/components/schemas/EnrichedEvent'
                  - $ref: '#/components/schemas/SlimEvent'
                type: array
          description: OK
          headers:
            Page:
              description: Page served
              schema:
                type: integer
            Per-Page:
              description: Page size
              schema:
                type: integer
            Total:
              description: Matching events across all pages, after collapsing
              schema:
                type: integer
      summary: List events
      tags:
      - Events
  /api/v2/pythia/public/events/{slug}:
    get:
      description: |-
        One event with its markets — the same object as a list element.
        The path takes the event's slug or its numeric id; an all-digit value is an id.
        Falls back to MySQL for older windows that have left the live
        cache, so bookmarked and historical links keep resolving.

        `include` bundles the per-market live data the event page
        otherwise fetches one call at a time. The first `include_limit`
        markets (in response order) each gain `order_book`, `kline` and/or
        `recent_contracts`, holding exactly what the standalone
        `/public/markets/{id}/order-book`, `/k-line` and `/contracts/recent`
        routes return (the book also carries its `sequence`). Markets past
        the limit carry none of them. Without `include` the response is the
        plain event.
      parameters:
      - description: Event slug, or its numeric id
        in: path
        name: slug
        required: true
        schema:
          type: string
      - description: 'Order of markets[]: default (operator rank, else probability
          desc), az or za'
        in: query
        name: market_sort
        schema:
          type: string
      - description: Comma list of `books`, `recent`, `klines`; unknown names are
          ignored
        in: query
        name: include
        schema:
          type: string
      - description: How many leading markets get the bundle, 1-12 (default 6)
        in: query
        name: include_limit
        schema:
          type: integer
      - description: k-line period in minutes, as /k-line takes it (default 1)
        in: query
        name: period
        schema:
          type: integer
      - description: k-line rows, 1-10000 (default 30)
        in: query
        name: kline_limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBundle'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Event by slug or id
      tags:
      - Events
  /api/v2/pythia/public/home:
    get:
      description: |-
        The main event list for the given query, the four fixed rails
        (`trending`, `ending_soon`, `volume`, `featured` — each
        `/public/events?sort=<rail>&limit=5&status=active`) and the
        category tree, in one response. Each part is exactly what its
        standalone route returns. Takes the same query parameters as
        `/public/events` for the main list, except `q` and `page`, which
        are ignored: the main list is always the first page, unsearched.
      parameters:
      - description: Filter by category
        in: query
        name: category
        schema:
          type: string
      - description: Filter by status. `resolved` covers determined and settled
        in: query
        name: status
        schema:
          type: string
      - description: Filter to one tag slug
        in: query
        name: tag
        schema:
          type: string
      - description: Filter to one series slug. Expands it rather than collapsing
        in: query
        name: series
        schema:
          type: string
      - description: Filter to one sub-category slug, e.g. tennis
        in: query
        name: subcategory
        schema:
          type: string
      - description: Filter by series cadence, e.g. daily / weekly / monthly
        in: query
        name: frequency
        schema:
          type: string
      - description: Sort order, e.g. newest
        in: query
        name: sort
        schema:
          type: string
      - description: Reverse the sort
        in: query
        name: reverse
        schema:
          type: boolean
      - description: Order of markets[] within each event
        in: query
        name: market_sort
        schema:
          type: string
      - description: Page size, applied after collapsing
        in: query
        name: limit
        schema:
          type: integer
      - description: '`slim` reduces the main list AND the rails to the card fields'
        in: query
        name: fields
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
          description: OK
      summary: Home bundle
      tags:
      - Events
  /api/v2/pythia/public/leaderboard:
    get:
      description: |-
        Top members by realised PnL on settled contracts. `username` is a
        privacy-masked display name (or an explicit display name when set).
        A member with settled contracts in more than one currency appears
        once per currency. Filter with `period` (`all`, `24h`, `7d`, `30d`).
      parameters:
      - description: all (default), 24h, 7d or 30d
        in: query
        name: period
        schema:
          type: string
      - description: Page, from 1 (default 1)
        in: query
        name: page
        schema:
          type: integer
      - description: Rows per page, 1-100 (default 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
                type: array
          description: OK
          headers:
            Page:
              description: The page returned
              schema:
                type: integer
            Per-Page:
              description: Rows per page
              schema:
                type: integer
            Total:
              description: Ranked rows on the whole board, at most 100
              schema:
                type: integer
      summary: Leaderboard
      tags:
      - Community
  /api/v2/pythia/public/markets:
    get:
      description: |-
        Every live market as a flat list, with the same object shape as market
        detail (pricing fields and CTF ids included). An order — including a
        signed one — can be built straight from a list response without a
        per-market follow-up call.
      parameters:
      - description: Filter on the published status. `resolved` covers determined
          and settled
        in: query
        name: status
        schema:
          type: string
      - description: asc (default) or desc
        in: query
        name: ordering
        schema:
          type: string
      - description: 'Only the live market whose yes_token_id or no_token_id this
          is: the decimal string, exactly as published'
        in: query
        name: token_id
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MarketPayload'
                type: array
          description: OK
      summary: List markets
      tags:
      - Markets
  /api/v2/pythia/public/markets/{market}:
    get:
      description: |-
        One market with pricing fields and CTF ids needed to build an order.
        Falls back to stored data for settled and voided markets, so historical
        markets and bookmarked links keep resolving after the engine has dropped them.
      parameters:
      - description: Market id
        in: path
        name: market
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPayload'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Market detail
      tags:
      - Markets
  /api/v2/pythia/public/markets/{market}/contracts/recent:
    get:
      description: |-
        The public trade tape — recently matched YES/NO contracts at a
        price and volume, newest first. Served for settled markets too
        (historical tape from storage), not only live engine markets.

        `from_id` and `time_from` switch to OLDEST first, for paging forward;
        `from_id` wins when both are given. Prices are in YES space.

        Voided trades appear with `state: "voided"`: a match whose on-chain
        settlement failed for good and was reversed off-chain. Every row has
        `state`; drop voided rows if you want only trades that stood.
      parameters:
      - description: Market id
        in: path
        name: market
        required: true
        schema:
          type: string
      - description: Rows, 1-1000 (default 100)
        in: query
        name: limit
        schema:
          type: integer
      - description: 'Cursor: only contracts with id greater than this, OLDEST first.
          Pass the last id you received to page forward without gaps'
        in: query
        name: from_id
        schema:
          type: integer
      - description: Only contracts matched at or after this time, Unix SECONDS (inclusive),
          OLDEST first. Continue with from_id
        in: query
        name: time_from
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicContract'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: Recent contracts
      tags:
      - Market Data
  /api/v2/pythia/public/markets/{market}/depth:
    get:
      description: |-
        Aggregated book as `[price, volume]` pairs per side, best-first,
        plus a server timestamp. Lighter than the full order-book payload —
        use this for depth charts; use the order-book endpoint when you
        need side-tagged levels.
      parameters:
      - description: Market id
        in: path
        name: market
        required: true
        schema:
          type: string
      - description: Levels per side, 1-100 (default 100)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepthResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Depth
      tags:
      - Market Data
  /api/v2/pythia/public/markets/{market}/k-line:
    get:
      description: |-
        OHLC history for the market's own probability (not the underlying
        asset). Each row is [timestamp, open, high, low, close, volume],
        timestamp in Unix seconds. Settled markets are still served from
        storage so historical charts keep loading.
      parameters:
      - description: Market id
        in: path
        name: market
        required: true
        schema:
          type: string
      - description: 'Period in minutes: 1,5,15,30,60,120,240,360,720,1440,4320,10080'
        in: query
        name: period
        schema:
          type: integer
      - description: Unix seconds
        in: query
        name: time_from
        schema:
          type: integer
      - description: Unix seconds
        in: query
        name: time_to
        schema:
          type: integer
      - description: Rows, 1-10000 (default 30)
        in: query
        name: limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/KLineRow'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
      summary: K-line (candles)
      tags:
      - Market Data
  /api/v2/pythia/public/markets/{market}/order-book:
    get:
      description: |-
        Aggregated combined book. Because YES + NO = 1.00 there is one book,
        expressed as YES bids and NO bids. Each level carries side, price and
        volume ONLY — no order ids, timestamps or owner data are exposed.
        Use `depth` for the lighter `[price, volume]` chart shape.
      parameters:
      - description: Market id
        in: path
        name: market
        required: true
        schema:
          type: string
      - description: Levels per side, 1-200 (default 20)
        in: query
        name: asks_limit
        schema:
          type: integer
      - description: Levels per side, 1-200 (default 20)
        in: query
        name: bids_limit
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Order book
      tags:
      - Market Data
  /api/v2/pythia/public/markets/{market}/ticker:
    get:
      description: |-
        Rolling 24h ticker for one market — last, open, high, low, volume
        and change — plus the top of the book: `buy` / `sell` (best bid / ask,
        YES-price space) and `buy_volume` / `sell_volume` (size at each), all
        null when that side of the book is empty. For a live multi-market
        dashboard prefer `GET /public/tickers`.
      parameters:
      - description: Market id
        in: path
        name: market
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
      summary: Ticker
      tags:
      - Market Data
  /api/v2/pythia/public/series:
    get:
      description: |-
        Every series backing at least one active event, busiest first.
        Derived from the live event cache — empty shelves never appear.
        Use a series slug with `GET /public/events?series=` to expand
        collapsed windows.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SeriesCount'
                type: array
          description: OK
      summary: List series
      tags:
      - Series
  /api/v2/pythia/public/tags:
    get:
      description: |-
        Every tag with at least one ACTIVE event on it, busiest first, with
        an event count. Derived from the live event cache, so an empty shelf
        never appears — use for category navigation, not a static taxonomy.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagCount'
                type: array
          description: OK
      summary: List tags
      tags:
      - Tags
  /api/v2/pythia/public/tickers:
    get:
      description: |-
        A snapshot of the rolling 24h ticker for every live market, keyed
        by market id. Prefer this over N single-market ticker calls when
        building a multi-market board.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: '#/components/schemas/TickerResponse'
                type: object
              example:
                "12":
                  timestamp: 1723033200
                  ticker:
                    buy: '0.62'
                    sell: '0.64'
                    buy_volume: '120'
                    sell_volume: '75.5'
                    low: '0.58'
                    high: '0.67'
                    open: '0.6'
                    last: '0.62'
                    avg_price: '0.61'
                    volume: '1500.25'
                    quote_volume: '900.5'
                    change_24h: '0.0333'
                "13":
                  timestamp: 1723033200
                  ticker:
                    buy: null
                    sell: '0.43'
                    buy_volume: null
                    sell_volume: '40'
                    low: '0.39'
                    high: '0.47'
                    open: '0.45'
                    last: '0.42'
                    avg_price: '0.43'
                    volume: '820'
                    quote_volume: '352.6'
                    change_24h: '-0.0667'
          description: OK
      summary: All tickers
      tags:
      - Market Data
